tailwind.config = {

 ink: { 950:'#FFFFFF', 900:'#F9FAFB', 800:'#F3F4F6', 700:'#E5E7EB' },

 slate2:{ 50:'#1D1D1B', 100:'#222222', 200:'#404040', 300:'#525252', 400:'#9CA3AF', 500:'#6B7280' },

 cream: { 100:'#F9FAFB', 200:'#E5E7EB', 300:'#9CA3AF', 400:'#6B7280' },

 accent:{ amber:'#FBBC04', pink:'#FB7185', emer:'#10B981' },

<style>
 /* Always reserve scrollbar space so the layout never shifts between routes.
 Three-layer defense: scrollbar-gutter (modern), overflow-y:scroll (legacy),
 and a custom WebKit scrollbar that takes up real width (instead of macOS's
 overlay default which has zero width and causes layout to jump). */
 html { scrollbar-gutter: stable; overflow-y: scroll; }
 html, body { margin: 0; padding: 0; }
 body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #FFFFFF; color: #222222; }
 /* Custom scrollbar, takes real width on macOS so layout stays stable. */
 ::-webkit-scrollbar { width: 12px; height: 12px; }
 ::-webkit-scrollbar-track { background: transparent; }
 ::-webkit-scrollbar-thumb { background: rgba(29,29,27,0.14); border-radius: 6px; border: 2px solid #FFFFFF; }
 ::-webkit-scrollbar-thumb:hover { background: rgba(29,29,27,0.26); }
 /* Firefox equivalent */
 html { scrollbar-width: thin; scrollbar-color: rgba(29,29,27,0.18) transparent; }
 h1,h2,h3 { letter-spacing: -0.015em; }
 /* Editorial display serif, pairs with sans body to give a culinary-magazine feel.
 Used on hero H1, section H2s, venue name, member name. Inter stays everywhere else. */
 .font-serif-display { font-family: 'Fraunces', 'Source Serif Pro', 'Georgia', serif; font-optical-sizing: auto; letter-spacing: -0.022em; font-feature-settings: 'ss01'; }
 /* Hero text sits on the video and stays legible regardless of frame content, 
 light cream foreground with a soft dark halo. */
 .hero-on-video { color: #FFFFFF; text-shadow: 0 2px 18px rgba(29,29,27,0.55), 0 1px 3px rgba(29,29,27,0.4); }
 .hero-on-video strong { color: #FFFFFF; }
 /* Animated shimmer overlay for the redemption verification screen, defeats
 screenshots because the gradient is constantly moving. */
 .mv-shimmer-anim {
 background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 35%, rgba(255,255,255,0) 70%);
 background-size: 250% 250%;
 animation: mvShimmerMove 3.2s linear infinite;
 }
 @keyframes mvShimmerMove {
 0% { background-position: 0% 100%; }
 100% { background-position: 100% 0%; }
 }
 /* Gentle hue drift on the member avatar tile, makes the profile feel alive. */
 @keyframes hue-drift { 0%, 100% { filter: hue-rotate(-6deg); } 50% { filter: hue-rotate(8deg); } }
 .avatar-drift { animation: hue-drift 9s ease-in-out infinite; }
 /* Page-transition cross-fade, applied on route change via go(). */
 #root { transition: opacity 180ms ease-out; }
 /* .grain dotted pattern removed for the white-bg refresh, the page now
 reads as clean paper rather than textured cream. Class kept as a no-op
 so the many `.grain` references throughout the markup still resolve. */
 .grain { }

 /* Partner logo wall, neotaste-style infinite marquee. The track holds
 TWO copies of the same logo set; sliding it from translateX(0) to
 translateX(-50%) makes the second copy land exactly where the first
 started, so the loop seams are invisible. Soft fade on the left/right
 edges via mask-image. */
 .mv-logo-marquee {
 -webkit-mask-image: linear-gradient(to right, transparent 0, black 100px, black calc(100% - 100px), transparent 100%);
 mask-image: linear-gradient(to right, transparent 0, black 100px, black calc(100% - 100px), transparent 100%);
 }
 .mv-logo-track {
 animation: mv-logo-marquee 40s linear infinite;
 will-change: transform;
 }
 @keyframes mv-logo-marquee {
 from { transform: translateX(0); }
 to { transform: translateX(-50%); }
 }
 .mv-logo-marquee:hover .mv-logo-track { animation-play-state: paused; }
 .toast { animation: rise .2s ease-out; }
 @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
 .pop { animation: pop .4s cubic-bezier(.2,1.4,.4,1); }
 @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
 .digit { font-variant-numeric: tabular-nums; }
 .frame { box-shadow: 0 30px 80px rgba(29,29,27,.18); }
 input::placeholder { color: #9CA3AF; }

 /* ===== Stellar map styling, brand-coherent overrides ===== */
 /* Make the Leaflet container blend into our cream-paper UI. */
 .leaflet-container { background: #F9FAFB; font-family: inherit; outline: none; }
 /* Attribution panel, dark on cream. */
 .leaflet-control-attribution { background: rgba(255,255,255,0.85) !important; color: #6F624E !important; font-size: 9px !important; padding: 2px 6px !important; }
 .leaflet-control-attribution a { color: #4A3D2A !important; }
 /* Custom zoom controls, cream pills with dark text, terracotta hover. */
 .leaflet-bar { box-shadow: 0 8px 24px rgba(29,29,27,.10) !important; border: 0 !important; }
 .leaflet-bar a { background: rgba(255,255,255,0.96) !important; color: #222222 !important; border-color: rgba(29,29,27,.08) !important; font-weight: 800; }
 .leaflet-bar a:hover { background: #C8392E !important; color: #fff !important; }

 /* ----- Pins: simple coral dot with cuisine glyph. Name lives in a tooltip
 that only shows on hover/active state, keeps the map uncluttered. ----- */
 .mv-pin-wrap {
 position: relative; width: 42px; height: 50px;
 cursor: pointer;
 }
 .mv-pin {
 position: absolute; top: 0; left: 50%;
 transform: translateX(-50%);
 width: 36px; height: 36px; border-radius: 50%;
 background: #C8392E;
 border: 2.5px solid #FFFFFF;
 box-shadow: 0 6px 14px rgba(229,56,42,.45), 0 1px 0 rgba(255,255,255,.2) inset;
 display: grid; place-items: center;
 font-size: 18px; line-height: 1;
 transition: transform .18s ease, box-shadow .18s ease;
 }
 .mv-pin-tail {
 position: absolute; top: 33px; left: 50%;
 transform: translateX(-50%);
 width: 0; height: 0;
 border-left: 7px solid transparent;
 border-right: 7px solid transparent;
 border-top: 11px solid #C8392E;
 filter: drop-shadow(0 4px 4px rgba(229,56,42,.35));
 }
 .mv-pin-name {
 position: absolute; bottom: 100%; left: 50%;
 transform: translateX(-50%);
 margin-bottom: 6px;
 background: #1D1D1B;
 color: #FFFFFF;
 border: 1px solid rgba(255,255,255,.18);
 padding: 5px 10px;
 border-radius: 9999px;
 font-size: 11px; font-weight: 700;
 white-space: nowrap;
 pointer-events: none;
 opacity: 0;
 transition: opacity .15s ease, transform .15s ease;
 box-shadow: 0 6px 18px rgba(29,29,27,.30);
 }
 .mv-pin-wrap:hover .mv-pin-name,
 .mv-pin-wrap.is-active .mv-pin-name { opacity: 1; transform: translateX(-50%) translateY(-2px); }
 .mv-pin-wrap:hover .mv-pin { transform: translateX(-50%) scale(1.12); box-shadow: 0 12px 28px rgba(229,56,42,.55); }
 .mv-pin-wrap.is-active .mv-pin { transform: translateX(-50%) scale(1.18); background: #FFFFFF; color: #C8392E; border-color: #C8392E; }
 .mv-pin-wrap.is-active .mv-pin-tail { border-top-color: #FFFFFF; filter: drop-shadow(0 4px 4px rgba(255,255,255,.2)); }
 /* Live-now: green pulse ring around the pin head. */
 .mv-pin-wrap.is-live::before {
 content: ''; position: absolute;
 top: -4px; left: 50%; transform: translateX(-50%);
 width: 44px; height: 44px; border-radius: 50%;
 border: 2px solid rgba(52,211,153,.7);
 animation: mvPulse 1.8s ease-out infinite;
 pointer-events: none;
 }
 @keyframes mvPulse {
 0% { transform: translateX(-50%) scale(.85); opacity: .9; }
 70% { transform: translateX(-50%) scale(1.4); opacity: 0; }
 100% { opacity: 0; }
 }

 /* ----- Cluster bubbles, real circles (we don't load MarkerCluster.Default.css
 so we have to supply our own shape too, not just colour). ----- */
 .marker-cluster {
 background: rgba(229,56,42,.18) !important;
 border-radius: 50% !important;
 width: 44px !important; height: 44px !important;
 text-align: center;
 }
 .marker-cluster div {
 width: 32px !important; height: 32px !important;
 margin: 6px 0 0 6px !important;
 background: #C8392E !important;
 color: #fff !important;
 border-radius: 50% !important;
 border: 2px solid #FFFFFF !important;
 font-weight: 800 !important;
 box-shadow: 0 6px 16px rgba(229,56,42,.5);
 display: grid; place-items: center;
 }
 .marker-cluster span { line-height: 1 !important; font-size: 13px; }
 /* Brand-styled popups, cream paper with dark text. */
 .leaflet-popup-content-wrapper { background: #FFFFFF !important; color: #222222 !important; border-radius: 14px !important; box-shadow: 0 20px 50px rgba(29,29,27,.22) !important; padding: 0 !important; overflow: hidden; border: 1px solid rgba(29,29,27,.08); }
 .leaflet-popup-content { margin: 0 !important; line-height: 1.4 !important; min-width: 240px; }
 .leaflet-popup-tip { background: #FFFFFF !important; }
 .leaflet-popup-close-button { color: #9CA3AF !important; padding: 8px !important; }
 .mv-popup { padding: 10px 12px 12px; }
 .mv-popup-img { width: 100%; height: 96px; background: #F9FAFB center/cover no-repeat; border-radius: 10px; margin-bottom: 8px; }
 .mv-popup-title { font-weight: 800; font-size: 14px; color: #1D1D1B; }
 .mv-popup-sub { font-size: 11px; color: #9CA3AF; margin-top: 1px; }
 .mv-popup-btn { display: inline-block; margin-top: 8px; background: #C8392E; color: #fff !important; font-weight: 800; font-size: 11px; padding: 7px 12px; border-radius: 9999px; text-decoration: none; }
 .mv-popup-btn:hover { background: #A52C23; }
 /* Map container has a subtle vignette so it doesn't feel like a flat plate. */
 .mv-map-frame { position: relative; }
 .mv-map-frame::after {
 content:''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
 box-shadow: inset 0 0 80px rgba(29,29,27,.12), inset 0 0 0 1px rgba(29,29,27,.08);
 }
 /* List rows, hover highlights matching pin via JS. */
 .mv-listrow.is-active { background: rgba(229,56,42,.08); border-color: rgba(229,56,42,.4); }

 /* ====================================================================
 Phase 1, member-discovery UX uplift.
 Flash pulse, photo cards, rails, ticker.
 ==================================================================== */
 @keyframes mv-flash-pulse {
 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(229,56,42, 0.55); }
 50% { transform: scale(1.08); box-shadow: 0 0 0 14px rgba(229,56,42, 0); }
 }
 /* Flash pin, slow pulsing coral ring layered on the existing pin head. */
 .mv-pin-wrap.is-flash .mv-pin {

 }

 .mv-pin-wrap.is-hover .mv-pin {

 }
 .mv-flash-chip {
 display: inline-flex; align-items: center; gap: 4px;
 padding: 3px 8px; border-radius: 999px;
 background: linear-gradient(135deg, #C8392E 0%, #F26B1F 100%);
 color: #FFFFFF; font-size: 10px; font-weight: 800;
 letter-spacing: 0.08em; text-transform: uppercase;
 box-shadow: 0 2px 8px rgba(229,56,42, 0.4);
 }
 .mv-flash-chip::before {
 content: ''; display: inline-block; width: 5px; height: 5px;
 border-radius: 50%; background: #FFE89A;
 animation: mv-flash-pulse 1.4s ease-in-out infinite;
 }
 .mv-card-photo {
 position: relative; overflow: hidden; border-radius: 14px;
 background: #F9FAFB;
 }
 .mv-card-photo::after {
 content: ''; position: absolute; inset: 0;
 background: linear-gradient(to top, rgba(29,29,27,0.55) 0%, rgba(29,29,27,0) 50%);
 pointer-events: none;
 }
 .mv-rail {
 display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
 padding: 4px 4px 18px 4px; margin: 0 -4px;
 scrollbar-width: thin;
 }
 .mv-rail::-webkit-scrollbar { height: 6px; }
 .mv-rail::-webkit-scrollbar-thumb { background: rgba(29,29,27,0.18); border-radius: 3px; }
 .mv-rail > * { scroll-snap-align: start; flex: 0 0 auto; }
 /* Right-edge fade: the partly-visible next item reads as an intentional
    "scroll for more" cue rather than a broken cut-off. Works on any
    background and needs no JS — key for mobile, where the scrollbar hides. */
 .mv-rail, .mv-fadex {
 -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent);
 mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent);
 }
 .mv-ticker-track {
 display: inline-flex; gap: 40px; padding-right: 40px;
 animation: mv-ticker 30s linear infinite;
 }
 @keyframes mv-ticker {
 from { transform: translateX(0); }
 to { transform: translateX(-50%); }
 }
 .mv-ticker:hover .mv-ticker-track { animation-play-state: paused; }
</style>

/* safeHash, tries Web Crypto first (Chrome/Firefox file://, all HTTPS).

const cryptoAvailable = typeof crypto !== 'undefined' && crypto.subtle && typeof crypto.subtle.digest === 'function';
function fallbackHash(s) {
 // FNV-1a 64-bit-ish in pure JS, deterministic, sufficient for distinguishing passwords in a demo.
 let h1 = 0x811c9dc5, h2 = 0x1505;
 for (let i = 0; i < s.length; i++) {
 const c = s.charCodeAt(i);
 h1 ^= c; h1 = (h1 * 0x01000193) >>> 0;
 h2 = (((h2 << 5) + h2) ^ c) >>> 0;
 }
 return 'fb_' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
async function safeHash(text) {
 if (!cryptoAvailable) return fallbackHash(text);
 try {
 const buf = new TextEncoder().encode(text);
 const hash = await crypto.subtle.digest('SHA-256', buf);
 return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
 } catch {

 }
}

}

function getAllVenues() {

 // Discover/Map; they resolve through findVenueBySlug only (for saved
 // venues + direct links).
 const partnerLive = (store.partnerVenues || []).filter(pv => pv.status === 'LIVE').map(toMemberShape);
 const overrides = store.seedOverrides || {};

 const seeds = VENUES.map(v => {
 const o = overrides[v.slug];
 if (o && o._hidden) return null;

function findVenueBySlug(slug) {

 const live = getAllVenues().find(v => v.slug === slug);

 else if (cuisine.includes('mediterran') || cuisine.includes('greek')) key = 'med';
 else if (cuisine.includes('vegan') || cuisine.includes('veget')) key = 'vegan';
 const bucket = buckets[key];
 const id = bucket[h % bucket.length];
 return 'https://images.unsplash.com/photo-' + id + '?w=1000&q=80&auto=format&fit=crop';
}

function VenueArt(venue, opts={}) {
 const { aspect='16/10', radius='rounded-2xl', cls='', compact=false } = opts;
 // Honest path: a real partner-uploaded photo of THEIR venue.
 if (venueHasRealPhoto(venue)) {
 return el('div',{class:'relative overflow-hidden ' + radius + ' ' + cls, style:'aspect-ratio:' + aspect.replace('/','/')},
 el('img',{src: venueRealPhotoSrc(venue), alt: venue.name, class:'absolute inset-0 w-full h-full object-cover', style:'filter:brightness(0.92) saturate(1.05)'})
 );
 }
 // Photo path: cuisine-matched real photography. Falls back to SVG illustration
 // only if the image fails to load (offline / blocked CDN). Looks like a real
 // restaurant listing while staying honest about what we know about the venue.
 if (!compact) {
 const photoUrl = cuisinePhotoFor(venue);
 const wrap = el('div',{class:'relative overflow-hidden ' + radius + ' ' + cls, style:'aspect-ratio:' + aspect.replace('/','/')});
 const img = el('img',{
 src: photoUrl,
 alt: venue.name + ', ' + (venue.cuisine || 'restaurant'),
 loading:'lazy',
 class:'absolute inset-0 w-full h-full object-cover',
 style:'filter:brightness(0.92) saturate(1.05)'
 });
 img.addEventListener('error', () => {
 // Photo failed, swap to the illustrated placeholder built below.
 wrap.innerHTML = '';
 const fallback = renderIllustratedVenue(venue, { aspect, radius, cls:'', compact });
 // fallback is a <div> with the SVG inside; move its children up.
 while (fallback.firstChild) wrap.appendChild(fallback.firstChild);
 });
 wrap.appendChild(img);
 return wrap;
 }
 // Compact thumbnail mode (small history rows), keep using the lightweight illustration.
 return renderIllustratedVenue(venue, opts);
}

// Original illustrated venue card kept as a fallback, renders the SVG pattern.
function renderIllustratedVenue(venue, opts={}) {
 const { aspect='16/10', radius='rounded-2xl', cls='', compact=false } = opts;
 // No real photo → a typography-forward placeholder. Brand gradient + tile
 // motif + one clean cuisine glyph centered. No fake food drawings, no
 // monogram chip, no "illustration" label, the card is obviously not a photo
 // and doesn't need to apologise for it.
 const name = venue.name || 'Venue';
 const seed = (venue.slug || name);
 let h = 0; for (let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
 // Coral-family palettes only, keep every card brand-consistent. No amber outlier.
 const palettes = [
 { from:'#1F0A12', via:'#150812', to:'#0A0613', accent:'#C8392E' }, // wine
 { from:'#1A0A14', via:'#100612', to:'#070612', accent:'#FB7185' }, // soft coral
 { from:'#181014', via:'#100C12', to:'#070612', accent:'#C8392E' } // espresso w/ coral
 ];
 const p = palettes[h % palettes.length];
 const uid = 'va' + h.toString(36);
 // Compact glyph viewBox (matches ILLUS.cuisineGlyph kit), kept simple,
 // pulled from the existing icon set so it's one design language.
 const glyphPaths = {
 tapas: '<ellipse cx="12" cy="16" rx="9" ry="2.5"/><circle cx="8" cy="13" r="1.5"/><circle cx="12" cy="11.5" r="2"/><circle cx="16" cy="13" r="1.5"/>',
 catalan: '<path d="M5 11 Q 5 17 12 19 Q 19 17 19 11 V 6 L 12 4 L 5 6 Z"/>',
 wine: '<path d="M8 3 L16 3 Q 16 11 12 13 Q 8 11 8 3 Z"/><line x1="12" y1="13" x2="12" y2="20"/><line x1="9" y1="20" x2="15" y2="20"/>',
 asian: '<path d="M4 12 Q 4 18 12 18 Q 20 18 20 12 Z"/><path d="M9 8 L 15 4"/>',
 seafood: '<path d="M3 12 Q 8 4 12 12 Q 16 4 21 12 Q 16 20 12 12 Q 8 20 3 12 Z"/>',
 brunch: '<ellipse cx="12" cy="14" rx="8" ry="3"/><circle cx="12" cy="11" r="3"/>',
 vegan: '<path d="M12 21 V 11"/><path d="M12 11 Q 6 8 5 4 Q 11 5 12 11 Z"/><path d="M12 13 Q 18 10 19 6 Q 13 7 12 13 Z"/>',
 med: '<path d="M4 12 Q 12 4 20 12"/><path d="M4 16 Q 12 8 20 16"/>'
 };
 const cuisine = cuisineGlyphFor(venue.cuisine);
 const glyph = glyphPaths[cuisine] || glyphPaths.tapas;
 // Tile pattern subtly textures the background; the centered glyph reads as
 // "restaurant of this cuisine type" without drawing food.
 const glyphSize = compact ? 90 : 140;
 const glyphX = 400 - glyphSize/2;
 const glyphY = 250 - glyphSize/2;
 const svgInner =
 '<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%">'+
 '<defs>'+
 '<linearGradient id="' + uid + 'g" x1="0%" y1="0%" x2="100%" y2="100%">'+
 '<stop offset="0%" stop-color="' + p.from + '"/>'+
 '<stop offset="60%" stop-color="' + p.via + '"/>'+
 '<stop offset="100%" stop-color="' + p.to + '"/>'+
 '</linearGradient>'+
 '<pattern id="' + uid + 't" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">'+
 '<path d="M0 22 L22 0 L44 22 L22 44 Z" fill="none" stroke="' + p.accent + '" stroke-width="0.5" stroke-opacity="0.16"/>'+
 '<circle cx="22" cy="22" r="1.2" fill="' + p.accent + '" fill-opacity="0.20"/>'+
 '</pattern>'+
 '<radialGradient id="' + uid + 'r" cx="50%" cy="50%" r="55%">'+
 '<stop offset="0%" stop-color="' + p.accent + '" stop-opacity="0.16"/>'+
 '<stop offset="100%" stop-color="' + p.accent + '" stop-opacity="0"/>'+
 '</radialGradient>'+
 '</defs>'+
 '<rect x="0" y="0" width="800" height="500" fill="url(#' + uid + 'g)"/>'+
 '<rect x="0" y="0" width="800" height="500" fill="url(#' + uid + 't)"/>'+
 '<rect x="0" y="0" width="800" height="500" fill="url(#' + uid + 'r)"/>'+
 // Single clean cuisine glyph centered. Stroke at coral, low opacity.
 '<svg x="' + glyphX + '" y="' + glyphY + '" width="' + glyphSize + '" height="' + glyphSize + '" viewBox="0 0 24 24" fill="none" stroke="' + p.accent + '" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.55">' +
 glyph +
 '</svg>'+
 '</svg>';
 return el('div',{class:'relative overflow-hidden ' + radius + ' ' + cls, style:'aspect-ratio:' + aspect.replace('/','/'), html: svgInner});
}

// Map a cuisine string to the right glyph key.
function cuisineGlyphFor(c) {
 if (!c) return 'tapas';
 const s = String(c).toLowerCase();
 if (s.includes('catalan')) return 'catalan';
 if (s.includes('mediterran')) return 'med';
 if (s.includes('seafood') || s.includes('mar')) return 'seafood';
 if (s.includes('brunch')) return 'brunch';
 if (s.includes('vegan') || s.includes('vegetar')) return 'vegan';
 if (s.includes('japan') || s.includes('asian') || s.includes('thai') || s.includes('chinese')) return 'asian';
 if (s.includes('wine') || s.includes('vermut') || s.includes('cava')) return 'wine';
 return 'tapas';
}

const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);

/* ========================================================================
 AUTH HANDLERS, real persistent users
 ======================================================================== */
async function registerUser({ firstName, lastName, email, password, role='MEMBER' }) {
 email = email.trim().toLowerCase();
 if (!isEmail(email)) throw new Error('Please enter a valid email.');
 if (password.length < 8) throw new Error('Password must be at least 8 characters.');
 if (store.users.find(u => u.email === email)) throw new Error('An account with that email already exists.');
 const u = {
 id: 'u_' + Math.random().toString(36).slice(2,12),
 email,
 passwordHash: await hashPassword(password),
 firstName: firstName?.trim() || null,
 lastName: lastName?.trim() || null,
 role,
 createdAt: Date.now(),
 verifiedAt: Date.now() // demo skips email-verify
 };
 store.users.push(u);
 if (!store.saved[u.id]) store.saved[u.id] = [];
 saveStore();
 setSession(u.id);
 return u;
}
async function loginUser({ email, password }) {
 email = email.trim().toLowerCase();
 const u = store.users.find(x => x.email === email);
 if (!u) throw new Error('Email or password is wrong.');
 const ok = await checkPassword(u.passwordHash, password);
 if (!ok) throw new Error('Email or password is wrong.');
 setSession(u.id);
 return u;
}
function logout() {
 clearSession();
 go('landing');
 toast('Signed out');
}

/* ========================================================================
 HERO BACKGROUND VIDEO, full-bleed cinematic loop behind the landing copy.

 Pipeline:
 1. Generate clips in Veo 3 → drop as hero-1.mp4, hero-2.mp4, ... in
 media/hero/.
 2. Run `media/hero/stitch.sh` (ffmpeg concat with shared codec/profile,
 faststart, no audio, 1920×1080 30fps) → produces hero.mp4 + hero-poster.jpg.
 3. This component just plays hero.mp4 on loop, with the poster as the
 poster attribute (instant paint before the bytes arrive).

 If hero.mp4 isn't there yet (file 404s), the video element hides itself
 and the SVG Barcelona cityscape underneath stays visible.

 autoplay + muted + playsinline so iOS/Android won't block.
 On narrow screens we preload less aggressively to save mobile data.
 ======================================================================== */
function HeroBackgroundVideo() {
 const SRC = 'media/hero/hero.mp4';
 const POSTER = 'media/hero/hero-poster.jpg';
 const isNarrow = typeof window !== 'undefined' && window.innerWidth < 700;
 const video = document.createElement('video');
 // Background-video styling: dimmed + slightly desaturated so the copy
 // dominates. opacity 0.55 plus a brightness/saturate filter pushes the
 // shot back into "ambient atmosphere" territory. The dark gradient
 // overlay drawn AFTER this element does the rest of the heavy lifting.
 // mask-image fades the video itself to transparent at the bottom edge
 // so there's no hard seam where the hero section meets the next one.
 video.className = 'absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-700';
 video.style.filter = 'brightness(0.62) saturate(0.85) contrast(1.02)';
 video.style.maskImage = 'linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 70%, rgba(0,0,0,0.5) 88%, rgba(0,0,0,0) 100%)';
 video.style.webkitMaskImage = video.style.maskImage;
 video.muted = true;
 video.autoplay = true;
 video.loop = true;
 video.playsInline = true;
 video.setAttribute('playsinline','');
 video.setAttribute('webkit-playsinline','');
 video.setAttribute('aria-hidden','true');
 video.preload = isNarrow ? 'metadata' : 'auto';
 video.poster = POSTER;
 video.src = SRC;
 video.addEventListener('loadeddata', () => {
 // Fade in to a *muted* opacity, not full 1.0. We want background, not centerpiece.
 video.style.opacity = '0.72';
 // Cityscape SVG fades almost entirely out, the video carries the mood now.
 const svg = document.querySelector('[data-hero-svg]');
 if (svg) svg.style.opacity = '0.08';
 });
 video.addEventListener('error', () => {
 // hero.mp4 not delivered yet → keep the SVG placeholder visible.
 video.style.display = 'none';
 });
 // play() returns a Promise in real browsers, undefined in JSDOM, guard it.
 const p = video.play();
 if (p && typeof p.catch === 'function') p.catch(()=>{});
 return video;
}

// Returns true if a venue has a same-day flash deal active right now.
// dealSlots may carry FLASH-type entries seeded for hype campaigns.
function venueHasFlashNow(v) {
 if (!v) return false;
 // Search both the member-facing liveDeal (frozen at last admin approval)
 // and the raw editor draft so seeded venues without a liveDeal still show.
 const pv = v._pv || v;
 const lists = [];
 if (pv && pv.liveDeal && Array.isArray(pv.liveDeal.dealSlots)) lists.push(pv.liveDeal.dealSlots);
 if (Array.isArray(pv.dealSlots)) lists.push(pv.dealSlots);
 const today = new Date().toISOString().slice(0,10);
 return lists.some(slots => slots.some(s =>
 s && s.type === 'FLASH' && s.date === today && (s.cap == null || (s.redeemed||0) < s.cap)
 ));
}
// "X slots left tonight", null if not applicable (no per-day caps configured).
function venueSlotsLeftToday(v) {
 if (!v) return null;
 const pv = v._pv || v;
 const lists = [];
 if (pv && pv.liveDeal && Array.isArray(pv.liveDeal.dealSlots)) lists.push(pv.liveDeal.dealSlots);
 else if (Array.isArray(pv.dealSlots)) lists.push(pv.dealSlots);
 const today = new Date().toISOString().slice(0,10);
 let foundCap = false;
 let left = 0;
 lists.forEach(slots => slots.forEach(s => {
 if (s && s.date === today && s.cap != null) {
 foundCap = true;
 left += Math.max(0, (s.cap||0) - (s.redeemed||0));
 }
 }));
 return foundCap ? left : null;
}

 // === Annual / Monthly segmented toggle ===
 // Lives between the H2 and the membership card. Pick a plan → the
 // card's foil-stamp price + caption + sub-line update live. Annual is
 // the default + carries a "save 43%" pill for the comparative cue.
 el('div',{
 class:'mt-10 inline-flex items-center p-1 rounded-full bg-ink-900 ring-1 ring-mv-500/15 shadow-inner shadow-mv-500/[0.04]',
 ref: toggleEl => {
 queueMicrotask(() => {
 const section = toggleEl.closest('section');
 if (!section) return;
 const btns = toggleEl.querySelectorAll('button[data-plan]');
 const amount = section.querySelector('.mv-price-amount');
 const label = section.querySelector('.mv-price-label');
 const sub = section.querySelector('.mv-price-sub');
 if (!amount || !label || !sub) return;
 function setPlan(plan) {
 btns.forEach(b => {
 const active = b.dataset.plan === plan;
 b.classList.toggle('bg-mv-500', active);
 b.classList.toggle('text-white', active);
 b.classList.toggle('shadow-md', active);
 b.classList.toggle('shadow-mv-500/30', active);
 b.classList.toggle('text-slate2-300', !active);
 b.classList.toggle('hover:text-slate2-100', !active);
 });
 const es = (typeof MV_LANG !== 'undefined' && MV_LANG === 'es');
 if (plan === 'annual') {
 amount.textContent = '€3.99';
 label.textContent = es ? '/mes · anual' : '/mo · annual';
 sub.textContent = es ? 'Se cobra una vez al año, 47,88 €. Ahorras 36 € frente al plan mensual.' : 'Billed once a year, €47.88 up front. Save €36 vs monthly.';
 } else {
 amount.textContent = '€6.99';
 label.textContent = es ? '/mes · mensual' : '/mo · monthly';
 sub.textContent = es ? 'Se cobra cada mes. Cancela cuando quieras.' : 'Billed each month. Cancel any month.';
 }
 }
 btns.forEach(b => b.addEventListener('click', () => setPlan(b.dataset.plan)));
 setPlan('annual'); // default
 });
 }
 },

// Auto-generated id for each field, lets screen readers connect the visible
// <label> with the <input> (previously they were sibling DOM nodes with no
// associative attribute, so VoiceOver announced "password, edit text" without
// any label text).
let _fieldUid = 0;
function nextFieldId(name) { _fieldUid += 1; return 'fld_' + name + '_' + _fieldUid; }
function InputField(label, type, name, placeholder, required=true, autocomplete='', extra='') {
 const wrap = el('div',{});
 const id = nextFieldId(name);
 wrap.appendChild(el('label',{class:'block text-xs uppercase tracking-widest text-slate2-400 font-bold mb-1', for:id}, label));
 const inp = el('input',{
 id, type, name, placeholder,
 class:'w-full bg-slate2-50/[0.04] border border-slate2-50/10 rounded-xl px-4 py-3 text-slate2-50 placeholder:text-slate2-500 outline-none focus:border-mv-500 focus:bg-slate2-50/[0.07]'
 });
 if (required) inp.required = true;
 if (autocomplete) inp.autocomplete = autocomplete;
 if (extra) {
 const m = extra.matchAll(/(\w+)="([^"]*)"/g);
 for (const x of m) inp.setAttribute(x[1], x[2]);
 }
 wrap.appendChild(inp);
 return wrap;
}
/* PasswordField, password input with a built-in show/hide toggle.
 Optional minlength enforced via the HTML attribute. */
function PasswordField(label, name, placeholder, { required=true, autocomplete='new-password', minlength=8, helpText } = {}) {
 const wrap = el('div',{});
 const id = nextFieldId(name);
 wrap.appendChild(el('label',{class:'block text-xs uppercase tracking-widest text-slate2-400 font-bold mb-1', for:id}, label));
 const container = el('div',{class:'relative'});
 const inp = el('input',{
 id, type:'password', name, placeholder, autocomplete,

 });
 if (required) inp.required = true;
 if (minlength) inp.setAttribute('minlength', String(minlength));
 let shown = false;
 const toggle = el('button',{
 type:'button',
 'aria-label':'Show password',
 class:'absolute inset-y-0 right-2 my-auto h-7 px-2 rounded-md text-xs font-bold text-slate2-400 hover:text-slate2-50 hover:bg-slate2-50/[0.06] cursor-pointer bg-transparent border-0',
 onclick: () => {
 shown = !shown; inp.type = shown ? 'text' : 'password';
 toggle.textContent = shown ? 'Hide' : 'Show';
 toggle.setAttribute('aria-label', shown ? 'Hide password' : 'Show password');
 }
 }, 'Show');
 container.appendChild(inp);
 container.appendChild(toggle);
 wrap.appendChild(container);
 if (helpText) wrap.appendChild(el('div',{class:'mt-1 text-[10px] text-slate2-500'}, helpText));
 return wrap;
}

  if (params.get('demo') === '1') {

 {

function AppProfile() {

 const sub = currentSub();
 const prefs = getPrefs(u);
 const prefCuisines = (prefs.cuisines || []).slice(0, 6);
 const prefBarrios = (prefs.barrios || []).slice(0, 4);

 // ---- Derived stats ----
 const AVG_SAVED = 18;
 const myReds = store.redemptions.filter(r => r.memberId === u.id);
 const myBookings = store.bookings.filter(b => b.memberId === u.id);
 const since30 = Date.now() - 30 * 86400000;
 const recentReds = myReds.filter(r => r.redeemedAt >= since30);
 const totalSaved = myReds.length * AVG_SAVED;
 const recentSaved = recentReds.length * AVG_SAVED;
 const monthsSub = sub ? Math.max(1, Math.ceil((Date.now() - (sub.startedAt || Date.now())) / (30 * 86400000))) : 0;
 const totalPaid = monthsSub * 4.99;
 const multiple = totalPaid > 0 ? (totalSaved / totalPaid) : 0;
 const memberSince = u.createdAt ? new Date(u.createdAt) : new Date();
 const memberSinceLabel = memberSince.toLocaleDateString('en-GB', { month:'short', year:'numeric' });

 // Unique cuisines + barrios actually visited.
 const visitedVenues = myReds.map(r => findVenueBySlug(r.venueSlug)).filter(Boolean);
 const uniqueCuisines = new Set(visitedVenues.map(v => (v.cuisine || '').split('·')[0].trim())).size;
 const uniqueBarrios = new Set(visitedVenues.map(v => v.barrio)).size;

 // Top cuisine + top venue
 const cuisineCounts = {};
 const venueCounts = {};
 visitedVenues.forEach(v => {
 const c = (v.cuisine || 'Other').split('·')[0].trim();
 cuisineCounts[c] = (cuisineCounts[c] || 0) + 1;
 venueCounts[v.slug] = (venueCounts[v.slug] || 0) + 1;
 });
 const topCuisine = Object.entries(cuisineCounts).sort((a,b) => b[1]-a[1])[0];
 const topVenueSlug = Object.entries(venueCounts).sort((a,b) => b[1]-a[1])[0]?.[0];
 const topVenue = topVenueSlug ? findVenueBySlug(topVenueSlug) : null;

 // Member tier, playful, based on redemption count.
 let tier = { label:'New', color:'text-slate2-400', bg:'bg-slate2-50/5', emoji:'', next: 1 };
 if (myReds.length >= 1) tier = { label:'Explorer', color:'text-mv-400', bg:'bg-mv-500/15', emoji:'', next: 3 };
 if (myReds.length >= 3) tier = { label:'Regular', color:'text-accent-amber', bg:'bg-accent-amber/15', emoji:'', next: 10 };
 if (myReds.length >= 10) tier = { label:'Connoisseur', color:'text-accent-emer', bg:'bg-accent-emer/15', emoji:'', next: 25 };

 // currently-open slot, so the redemption-code + confirmation flow is

 (() => {
 const pvForSlots = v._pv;
 const venuePaused = pvForSlots && pvForSlots.status === 'PAUSED';
 const liveDeal = pvForSlots ? getLiveDeal(pvForSlots) : null;
 const venueDefault = liveDeal?.dealTerms || pvForSlots?.dealTerms || DEFAULT_DEAL_TERMS;
 const liveSlots = liveDeal?.dealSlots || pvForSlots?.dealSlots || [];
 const activeSlots = (liveSlots || []).filter(s => s && s.active);
 const dealsForCard = getVenueDeals(v);

 // Pick a target slot for redemption: prefer one open right now, else first active.
 const bookable = activeSlots.find(s => isSlotBookableNow(pvForSlots, s)) || activeSlots[0] || null;
 const fallbackStaticTime = !pvForSlots && Array.isArray(v.times) ? v.times[0] : null;
 const canRedeemNow = !venuePaused && (
 (bookable && isSlotBookableNow(pvForSlots, bookable)) || (!!fallbackStaticTime)
 );
 const slotLabel = (bookable && (bookable.label || 'Slot') + ' · ' + bookable.timeStart + '-' + bookable.timeEnd) || fallbackStaticTime;

 // Optional inline status banner (open now / next opening).
 let banner = null;
 if (activeSlots.length) {
 const openSlot = activeSlots.find(s => isSlotBookableNow(pvForSlots, s));
 if (openSlot) {
 banner = el('div',{class:'rounded-xl bg-accent-emer/15 border border-accent-emer/40 px-3 py-2.5 flex items-center gap-2.5'},

 el('div',{class:'text-[12px] text-accent-emer font-bold leading-tight'}, t('venue.openNowBanner') || 'Disponible ahora mismo')
 );
 } else {

 el('span',{class:'font-bold'}, t('venue.nextOpeningBanner') || 'Próxima disponibilidad'),
 ' · ', hint
 )
 );
 }
 }

 let progress = 0; // 0..1
 let dragging = false;
 let fired = false;

 function commitRedeem() {
 b.redeemed = true; b.redeemedAt = Date.now();
 store.redemptions.unshift({ memberId: u.id, venueSlug: b.venueSlug, redeemedAt: Date.now(), method: 'SLIDE_CONFIRM' });

 (() => {

 const fill = el('div',{class:'absolute inset-y-0 left-0 bg-gradient-to-r from-mv-500 to-mv-400 transition-[width] duration-150 ease-out', style:'width:0%'});
 const label = el('div',{class:'absolute inset-0 flex items-center justify-center pointer-events-none text-[12px] font-extrabold uppercase tracking-[0.25em] text-slate2-300'},'Slide to redeem →');
 const thumb = el('button',{class:'absolute top-1 h-12 w-12 rounded-full bg-white shadow-lg shadow-mv-500/30 flex items-center justify-center cursor-grab', style:'left:4px'},

 );
 track.append(fill, label, thumb);
 function setProgress(p) {
 progress = Math.max(0, Math.min(1, p));
 fill.style.width = (progress * 100) + '%';
 const tw = track.getBoundingClientRect().width;
 thumb.style.left = Math.max(4, Math.min(tw - 52, progress * tw - 24)) + 'px';
 if (progress >= 0.92 && !fired) {
 fired = true; dragging = false;
 fill.style.width = '100%';
 label.textContent = 'Confirming…';
 setTimeout(commitRedeem, 280);
 }
 }
 function onMove(e) {
 if (!dragging || fired) return;
 const rect = track.getBoundingClientRect();
 const x = ('touches' in e ? e.touches[0]?.clientX : e.clientX) ?? rect.left;
 setProgress((x - rect.left) / rect.width);
 }
 function onUp() {
 if (fired) return;
 dragging = false;
 setProgress(0);
 }
 thumb.addEventListener('pointerdown', () => { dragging = true; fired = false; });
 thumb.addEventListener('touchstart', () => { dragging = true; fired = false; });
 window.addEventListener('pointermove', onMove);
 window.addEventListener('touchmove', onMove);
 window.addEventListener('pointerup', onUp);
 window.addEventListener('touchend', onUp);
 // Keyboard fallback, Enter or click commits.
 thumb.addEventListener('click', () => { if (!fired) { fired = true; commitRedeem(); } });
 return track;

 );
 }

 if (b.redeemedAt && Date.now() - b.redeemedAt < 6 * 60 * 1000) paint();
 }, 1000);
 return AppShell(inner, { narrow: true });

 let pv = currentPartnerVenue();
 // B-4 (companion): if the owner has no venue (e.g., admin-deleted), seed a
 // fresh DRAFT so they can re-list without getting locked out of signup.
 if (!pv) {
 pv = {
 id: 'pv_' + Math.random().toString(36).slice(2,10),
 ownerId: u.id, name: '', slug: '',
 barrio: '', cuisine: '', priceTier: 2,

 phone: '', website: '', instagram: '',
 description: '', hours: '',

 };
 store.partnerVenues.push(pv);
 u.partnerVenueId = pv.id;
 saveStore();
 }

 // Resume where they left off (persisted as state.params.step for back-button friendliness).
 // Wizard is now 5 steps (Sprint G1 added Terms): basics, address, photos, deal review, terms.

 let errors = {}; // { fieldKey: msg }

 errors[key] && el('span',{class:'normal-case text-red-400 text-xs ml-2'}, errors[key])
 );
 }
 function optLabel(label) {

 }, pv[key] ?? ''),

 // ---- step validators ----
 function validateStep(n) {
 errors = {};
 if (n === 1) {
 if (!pv.name?.trim()) errors.name = 'Required';
 if (!pv.cuisine?.trim()) errors.cuisine = 'Required';
 if (!pv.barrio?.trim()) errors.barrio = 'Required';

 // Helper: confirm + run destructive action (uses window.confirm for safety).
 const confirmDo = (msg, fn) => { if (window.confirm(msg)) fn(); };

 // Cascade-delete a user, remove their bookings, redemptions, saved list,
 // subscription, and (if partner) their venue. Returns count summary.
 function deleteUser(userId) {
 const user = store.users.find(x => x.id === userId);
 if (!user) return false;
 // E-1: never let the last admin be deleted. Leaving the store with no
 // admins is an unrecoverable state (no one can promote new admins).
 if (user.role === 'ADMIN') {

 store.partnerVenues = store.partnerVenues.filter(v => v.ownerId !== userId);
 store.bookings = store.bookings.filter(b => b.memberId !== userId && !venueSlugs.includes(b.venueSlug));
 store.redemptions = store.redemptions.filter(r => r.memberId !== userId && !venueSlugs.includes(r.venueSlug));
 if (store.reviews) store.reviews = store.reviews.filter(r => r.memberId !== userId && !venueSlugs.includes(r.venueSlug));
 delete store.saved[userId];
 delete store.subscriptions[userId];
 store.users = store.users.filter(x => x.id !== userId);
 saveStore();

 }

 function deleteVenue(venueId) {

 // ===== Tab: Partners =====
 function AdminPartners() {
 // ----- closure state (survives paintPartners() re-renders within a
 // single AdminPartners() invocation; render() resets it) -----
 let q = '';
 let statusFilter = 'all';
 // Bulk-select (C1+C2): tracks slugs for partner-venue selection and
 // override slugs for seed-venue selection. Cleared after bulk mutation.
 const selectedPartners = new Set();
 const selectedSeeds = new Set();
 // Multi-axis filter panel (D1)
 const filters = {
 barrios: new Set(), // empty = no filter
 cuisines: new Set(),
 priceMin: 1, priceMax: 4,
 ratingMin: 0, ratingMax: 5,
 photos: 'any' // 'any' | 'has' | 'missing'
 };
 let filtersOpen = false;
 // Sortable columns (D3)
 let sortKey = 'default'; // 'default' | 'name' | 'status' | 'rating' | 'redemptions' | 'submitted'
 let sortDir = 'asc';
 // Status priority used for default sort (PENDING first, REJECTED last).
 const STATUS_PRIORITY = { 'PENDING_APPROVAL': 0, 'LIVE': 1, 'PAUSED': 2, 'DRAFT': 3, 'REJECTED': 4 };

 // Quality score (G6): returns { score, missing[] } for a partner venue.
 // 10 fields each worth 1 point; "missing" lists the ones that scored 0.
 function qualityFor(pv, isSeed) {
 const checks = [
 ['name', !!(pv.name && String(pv.name).trim())],
 ['cuisine', !!(pv.cuisine && String(pv.cuisine).trim())],
 ['barrio', !!(pv.barrio && String(pv.barrio).trim())],
 ['priceTier', pv.priceTier != null && pv.priceTier !== ''],
 ['rating', Number(pv.rating) > 0],
 ['reviews', Number(pv.reviews) > 0],
 ['photos', (pv.photos || []).length > 0]
 ];
 // K3: seeds don't have these slots so we exclude them from missing-list.
 if (!isSeed) {
 checks.push(
 ['address', !!(pv.address && String(pv.address).trim())],
 ['website', !!(pv.website && String(pv.website).trim())],
 ['dealTerms', !!(pv.dealTerms && String(pv.dealTerms).trim())]
 );
 }
 const missing = checks.filter(([,ok]) => !ok).map(([k]) => k);
 // Score is always out of 10 for partners; for seeds we scale to /10 so
 // the badge thresholds (>=8 green, 5-7 amber, <=4 red) stay consistent.
 const total = checks.length;
 const score = total - missing.length;
 const scaled = isSeed ? Math.round((score / total) * 10) : score;
 return { score: scaled, missing, isSeed };
 }

 function qualityBadge(q) {
 let cls;
 if (q.score >= 8) cls = 'bg-accent-emer/20 text-accent-emer border-accent-emer/40';
 else if (q.score >= 5) cls = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
 else cls = 'bg-red-500/20 text-red-300 border-red-500/40';
 const title = q.missing.length ? ('Missing: ' + q.missing.join(', ')) : 'All quality fields populated';
 return el('span',{class:'rounded-full border px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-widest ' + cls, title}, 'Q ' + q.score + '/10');
 }

 const wrap = el('div',{class:'space-y-4'});

 function clearAllFilters() {
 filters.barrios.clear();
 filters.cuisines.clear();
 filters.priceMin = 1; filters.priceMax = 4;
 filters.ratingMin = 0; filters.ratingMax = 5;
 filters.photos = 'any';
 }
 function anyFilterActive() {
 return filters.barrios.size > 0 || filters.cuisines.size > 0
 || filters.priceMin !== 1 || filters.priceMax !== 4
 || filters.ratingMin !== 0 || filters.ratingMax !== 5
 || filters.photos !== 'any';
 }

 function paintPartners() {
 wrap.innerHTML = '';

 // --- Compute filtered list ---
 const filtered = store.partnerVenues.filter(v => {
 if (statusFilter !== 'all' && v.status !== statusFilter) return false;
 if (q) {
 const owner = store.users.find(x => x.id === v.ownerId);
 const hay = (v.name + ' ' + (v.cuisine||'') + ' ' + (v.barrio||'') + ' ' + (owner?.email||'')).toLowerCase();
 if (!hay.includes(q.toLowerCase())) return false;
 }
 if (filters.barrios.size > 0 && !filters.barrios.has(v.barrio || '')) return false;
 if (filters.cuisines.size > 0 && !filters.cuisines.has(v.cuisine || '')) return false;
 const pt = Number(v.priceTier ?? 0);
 if (pt < filters.priceMin || pt > filters.priceMax) return false;
 const rt = Number(v.rating ?? 0);
 if (rt < filters.ratingMin || rt > filters.ratingMax) return false;
 const photoCount = (v.photos || []).length;
 if (filters.photos === 'has' && photoCount === 0) return false;
 if (filters.photos === 'missing' && photoCount > 0) return false;
 return true;

 // Build an inline edit form for a venue.
 // isSeed = true → saves to store.seedOverrides[slug] (override layer)
 // isSeed = false → saves directly to the partner venue object
 //
 // Form covers every admin-editable field across five sections:
 // 1. Basics, Name / Cuisine / Barrio / Price tier / Rating / Reviews
 // 2. Location, Address / Postcode / Lat / Lng (seeds get Lat/Lng only)
 // 3. Contact, Website / Instagram / Phone (partner-only)
 // 4. Hours & deal, opening hours line + deal terms (partner-only;
 // deal terms are normally partner-edited under approval flow but
 // admin can short-circuit here when needed)
 // 5. Photos, full management: upload (compressImage handles size
 // guard + JPEG re-encode), reorder via ↑↓, set-as-cover, delete.
 // First photo is the cover everywhere a venue card renders.
 //
 // Admin direct-edits bypass the partner-side change-request approval
 // flow, they're treated as authoritative. Use the Re-review button on
 // the row above this form to send a partner back through the queue.
 function buildEditForm(venue, isSeed) {
 const current = isSeed
 ? { ...venue, ...((store.seedOverrides || {})[venue.slug] || {}) }
 : venue;

 // Working draft, mutated as the user types/uploads, applied on Save.
 // Four photo arrays are tracked separately so admins can curate the
 // gallery per surface (cover, food, venue interior/exterior, menu).
 const draft = {
 name: current.name ?? '',
 cuisine: current.cuisine ?? '',
 barrio: current.barrio ?? '',
 priceTier: current.priceTier ?? 2,
 rating: current.rating ?? 4.5,
 reviews: current.reviews ?? 0,
 address: current.address ?? '',
 postcode: current.postcode ?? '',
 lat: current.lat ?? '',
 lng: current.lng ?? '',
 website: current.website ?? '',
 instagram: current.instagram ?? '',
 phone: current.phone ?? '',
 hours: current.hours ?? '',
 dealTerms: current.dealTerms ?? '',
 // Deep-clone slot array so per-slot edits to the draft don't mutate

 Array.isArray(current.deals) && current.deals.length

 inp.oninput = () => {
 const v = inp.value;
 draft[name] = (type === 'number') ? (v === '' ? '' : Number(v)) : v;
 markDirty();
 };
 wrap.appendChild(inp);

 g.className = 'grid sm:grid-cols-2 gap-3';
 kids.forEach(k => k && g.appendChild(k));

 // ----- 1. BASICS -----

 descInput.oninput = () => { d.description = descInput.value; markDirty(); };

 // Active toggle

 });

 // ----- 2. LOCATION -----
 form.appendChild(section('Location'));

 form.appendChild(row2(
 field('address', 'Street address'),

 // A3 LIVE-vs-DRAFT diff panel at the top, then default dealTerms

 // A3: Proposed-changes / diff panel. Compares the editor draft (top
 // of buildEditForm) against the snapshot members currently see

 const diffMount = document.createElement('div');

 function fmtSlotLine(s) {
 if (!s) return ', ';
 const days = s.days || (Array.isArray(s.daysArr) ? s.daysArr.join('/') : '');
 const time = (s.timeStart || '') + (s.timeEnd ? '-' + s.timeEnd : '');
 const cap = (typeof s.seatCap === 'number') ? (' · cap ' + s.seatCap) : '';
 const act = s.active ? '' : ' · inactive';
 return (s.label || '(no label)') + ', ' + [days, time].filter(Boolean).join(' ') + cap + act;
 }
 function slotsKey(arr) {
 // Stable key for diff comparison, ignores `id` (cosmetic) so
 // re-keying doesn't masquerade as a real change.
 return JSON.stringify((arr || []).map(s => ({
 label: s.label || '',
 days: s.days || '',
 timeStart: s.timeStart || '',
 timeEnd: s.timeEnd || '',
 active: !!s.active,
 seatCap: Number(s.seatCap) || 0,
 terms: s.terms || ''
 })));
 }

 function paintDiff() {
 diffMount.innerHTML = '';

 const diffs = [];
 if ((live.dealTerms || '') !== (draft.dealTerms || '')) {
 diffs.push({ k: 'Default deal terms', live: live.dealTerms || ', ', draft: draft.dealTerms || ', ' });
 }
 if (slotsKey(live.dealSlots) !== slotsKey(draft.dealSlots)) {
 const liveLines = (live.dealSlots || []).map(fmtSlotLine).join('\n') || ', ';
 const draftLines = (draft.dealSlots || []).map(fmtSlotLine).join('\n') || ', ';
 diffs.push({ k: 'Deal slots', live: liveLines, draft: draftLines, multiline: true });
 }
 if (diffs.length === 0) return;

 const panel = document.createElement('div');
 panel.className = 'rounded-2xl border border-mv-500/40 bg-mv-500/10 p-3 mt-2';
 const head = document.createElement('div');
 head.className = 'flex items-center justify-between gap-3 flex-wrap';
 head.innerHTML =
 '<div>' +

 '</div>';
 const pushBtn = document.createElement('button');
 pushBtn.type = 'button';
 pushBtn.className = 'rounded-full bg-mv-500 hover:bg-mv-600 text-white px-3 py-1.5 text-xs font-extrabold cursor-pointer shrink-0';
 pushBtn.textContent = 'Apply draft to live now';

 rows.className = 'mt-3 space-y-2';
 diffs.forEach(d => {
 const row = document.createElement('div');
 row.className = 'rounded-xl bg-slate2-50/[0.04] border border-slate2-50/10 p-2';

 : '<div class="text-xs text-slate2-200 break-words">';

 // Marketplace-wide KPIs + per-venue dashboards. Read-only, no mutations.
 function AdminInsights() {
 let expandedSlug = null; // which venue's 30-day sparkline is open
 const wrap = el('div',{class:'space-y-6'});

 // Tiny SVG sparkline, 30 daily redemption counts for one venue.
 function sparklineFor(slug) {
 const now = Date.now();
 const days = 30;
 const counts = new Array(days).fill(0);
 (store.redemptions || []).forEach(r => {
 if (r.venueSlug !== slug || !r.redeemedAt) return;
 const dayIdx = Math.floor((now - r.redeemedAt) / 86400000);
 if (dayIdx >= 0 && dayIdx < days) counts[days - 1 - dayIdx]++;
 });
 const max = Math.max(1, ...counts);
 const W = 360, H = 50, step = W / (days - 1);
 const points = counts.map((c,i) => i*step + ',' + (H - (c/max)*(H-6) - 3)).join(' ');
 const total = counts.reduce((a,b)=>a+b, 0);
 // Inline SVG, no external lib.
 const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
 svg.setAttribute('viewBox','0 0 ' + W + ' ' + H);
 svg.setAttribute('width','100%');
 svg.setAttribute('height',H);
 svg.setAttribute('preserveAspectRatio','none');
 const poly = document.createElementNS('http://www.w3.org/2000/svg','polyline');
 poly.setAttribute('fill','none');
 poly.setAttribute('stroke','#C8392E');
 poly.setAttribute('stroke-width','2');
 poly.setAttribute('points', points);
 svg.appendChild(poly);
 return el('div',{class:'mt-2 rounded-xl bg-slate2-50/[0.04] border border-slate2-50/10 p-3'},
 el('div',{class:'flex items-center justify-between text-xs text-slate2-400 mb-1'},
 el('span',{},'30-day redemptions'),
 el('span',{class:'font-bold text-slate2-50'}, String(total) + ' total · peak ' + max + '/day')
 ),
 svg
 );
 }

 // ===== Tab: Reviews (L1) =====
 // Moderation list across every venue. Filter chips + sort toggle, plus a
 // basic profanity heuristic that auto-flags any review containing a banned
 // word so the admin sees them in the "Flagged" bucket on the next paint.
 function AdminReviews() {
 let filter = 'all'; // all | flagged | low | high
 let sortBy = 'recency'; // recency | rating | venue
 const wrap = el('div',{class:'space-y-4'});

 // Tiny English+Spanish word list. Intentionally minimal, the goal is to
 // catch obvious cases, not to ship a content-moderation engine.
 const PROFANITY = ['fuck','shit','idiot','imbécil','mierda','jodido'];
 function looksProfane(text) {
 if (!text) return false;
 const t = String(text).toLowerCase();
 return PROFANITY.some(w => t.indexOf(w) !== -1);
 }

 // Auto-flag pass on every paint. Only sets flagged=true; never clears it
 // (an admin who manually un-flags shouldn't see it re-flagged).
 function autoFlag() {
 let touched = false;
 (store.reviews || []).forEach(r => {
 if (!r.flagged && looksProfane(r.note)) { r.flagged = true; touched = true; }
 });
 if (touched) saveStore();
 }

 function paintReviews() {
 autoFlag();
 wrap.innerHTML = '';
 let list = (store.reviews || []).slice();
 if (filter === 'flagged') list = list.filter(r => r.flagged);
 else if (filter === 'low') list = list.filter(r => (r.stars || 0) <= 2);
 else if (filter === 'high') list = list.filter(r => (r.stars || 0) >= 5);
 if (sortBy === 'recency') list.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
 else if (sortBy === 'rating') list.sort((a,b) => (b.stars||0) - (a.stars||0));
 else if (sortBy === 'venue') list.sort((a,b) => (a.venueSlug||'').localeCompare(b.venueSlug||''));

 const chips = [
 ['all','All', (store.reviews||[]).length],
 ['flagged','Flagged', (store.reviews||[]).filter(r=>r.flagged).length],
 ['low','Low (≤2)', (store.reviews||[]).filter(r=>(r.stars||0)<=2).length],
 ['high','High (≥5)', (store.reviews||[]).filter(r=>(r.stars||0)>=5).length]
 ];

 wrap.append(
 el('div',{class:'flex items-center justify-between gap-3 flex-wrap'},
 el('div',{class:'flex gap-1 flex-wrap'},
 ...chips.map(([k,l,n]) => el('button',{
 class:'rounded-full px-3 py-1.5 text-xs font-bold cursor-pointer ' + (filter===k ? 'bg-slate2-50 text-ink-900' : 'bg-slate2-50/5 text-slate2-300 border border-slate2-50/10'),
 onclick:()=>{ filter = k; paintReviews(); }
 }, l + ' (' + n + ')'))
 ),
 el('div',{class:'flex items-center gap-2 text-xs text-slate2-400'},
 'Sort:',
 ...[['recency','Recent'],['rating','Rating'],['venue','Venue']].map(([k,l]) => el('button',{
 class:'rounded-full px-3 py-1 cursor-pointer ' + (sortBy===k ? 'bg-slate2-50 text-ink-900' : 'bg-slate2-50/5 text-slate2-300 border border-slate2-50/10'),
 onclick:()=>{ sortBy = k; paintReviews(); }
 }, l))
 )
 ),
 el('div',{class:'text-xs text-slate2-400'}, list.length + ' review' + (list.length===1?'':'s'))
 );

 if (list.length === 0) {
 wrap.append(el('p',{class:'text-sm text-slate2-400'},'No reviews match this filter.'));
 return;
 }

 wrap.append(
 el('div',{class:'space-y-2'},
 ...list.map(r => {
 const m = store.users.find(x => x.id === r.memberId);
 const v = findVenueBySlug(r.venueSlug);
 const note = r.note || '';
 const trimmed = note.length > 120 ? (note.slice(0, 120) + '…') : note;
 const flagged = !!r.flagged;
 return el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-4 ' + (flagged ? 'border-l-4 border-l-red-500' : '')},
 el('div',{class:'flex items-start justify-between gap-3 flex-wrap'},
 el('div',{class:'min-w-0 flex-1'},
 el('div',{class:'text-sm font-bold text-amber-300 tracking-widest'}, '★'.repeat(r.stars||0) + '☆'.repeat(Math.max(0,5-(r.stars||0)))),
 el('p',{class:'mt-1 text-sm text-slate2-200'}, trimmed || el('em',{class:'text-slate2-400'},'(no note)')),
 el('div',{class:'mt-2 text-xs text-slate2-400'},
 (m ? ((m.name||'') + ' · ' + m.email) : 'unknown member'),
 ' · ',
 el('button',{class:'underline cursor-pointer bg-transparent border-0', onclick:()=>v && go('venue',{slug:v.slug})}, v ? v.name : r.venueSlug),
 ' · ',
 r.createdAt ? new Date(r.createdAt).toLocaleString('en-GB') : ', '
 )
 ),
 el('div',{class:'flex items-center gap-2 shrink-0'},
 el('button',{
 class:'rounded-full px-3 py-1.5 text-xs font-bold cursor-pointer ' + (flagged ? 'bg-red-500/20 text-red-200 border border-red-500/40' : 'bg-slate2-50/5 text-slate2-300 border border-slate2-50/10'),
 onclick:()=>{ r.flagged = !r.flagged; saveStore(); paintReviews(); }
 }, flagged ? ' Flagged' : ' Flag'),
 el('button',{
 class:'rounded-full px-3 py-1.5 text-xs font-bold cursor-pointer bg-red-500/20 text-red-200 border border-red-500/40',
 onclick:()=>{
 confirmDo('Delete this review? Cannot be undone.', () => {
 store.reviews = (store.reviews || []).filter(x => x.id !== r.id);
 saveStore(); toast('Review deleted'); paintReviews();
 });
 }
 }, 'Delete')
 )
 )
 );
 })
 )
 );
 }
 paintReviews();
 return wrap;
 }

 // ===== Tab: Audit (E1+E2) =====
 // Read-only history of admin mutations against venues, plus a "revert to
 // this state" button on each entry that applies the recorded `before`
 // snapshot back onto the venue (partnerVenues or seedOverrides).
 function AdminAudit() {
 let q = '';
 let venueFilter = ''; // slug or ''
 let expandedId = null;
 let showAll = false;
 const wrap = el('div',{class:'space-y-4'});

 function applyRevert(entry) {
 if (!entry || !entry.venueSlug || !entry.before) { toast('Nothing to revert', 'err'); return; }
 const slug = entry.venueSlug;
 const before = entry.before;
 // Try partnerVenues first.
 const pv = store.partnerVenues.find(x => x.slug === slug);
 if (pv) {
 // Take a snapshot of current state BEFORE overwriting so the revert
 // itself is auditable.
 const currentSnap = JSON.parse(JSON.stringify(pv));
 Object.keys(before).forEach(k => { pv[k] = JSON.parse(JSON.stringify(before[k])); });
 logAudit('revert', slug, currentSnap, pv, 'reverted to audit entry ' + entry.id);
 saveStore(); toast('Reverted ' + (pv.name || slug)); render();
 return;
 }
 // Otherwise treat as a seedOverride.
 if (!store.seedOverrides) store.seedOverrides = {};
 const prev = store.seedOverrides[slug] ? JSON.parse(JSON.stringify(store.seedOverrides[slug])) : null;
 store.seedOverrides[slug] = JSON.parse(JSON.stringify(before));
 logAudit('revert', slug, prev, store.seedOverrides[slug], 'reverted seedOverride to audit entry ' + entry.id);
 saveStore(); toast('Reverted seed override for ' + slug); render();
 }

 function paintAudit() {
 wrap.innerHTML = '';
 let entries = (store.auditLog || []).slice();
 entries.sort((a,b) => (b.ts||0) - (a.ts||0));
 if (venueFilter) entries = entries.filter(e => e.venueSlug === venueFilter);
 if (q) {
 const needle = q.toLowerCase();
 entries = entries.filter(e => {
 const v = e.venueSlug ? findVenueBySlug(e.venueSlug) : null;
 const hay = (e.action + ' ' + (e.venueSlug||'') + ' ' + (v?.name||'') + ' ' + (e.reason||'')).toLowerCase();
 return hay.includes(needle);
 });
 }
 const totalMatching = entries.length;
 const HARD_CAP = 500;
 if (!showAll) entries = entries.slice(0, HARD_CAP);

 // Unique slugs (for filter dropdown)
 const slugs = Array.from(new Set((store.auditLog || []).map(e => e.venueSlug).filter(Boolean)));

 wrap.append(
 el('div',{class:'flex items-center gap-3 flex-wrap'},
 el('div',{class:'flex-1 min-w-[220px] flex items-center gap-2 bg-slate2-50/[0.06] rounded-md px-3 h-9 border border-slate2-50/12 focus-within:border-mv-500/60 focus-within:bg-slate2-50/[0.08] transition-colors'},
 lucide('search',{class:'h-4 w-4 text-slate2-500 shrink-0'}),
 el('input',{class:'bg-transparent outline-none text-[13px] text-slate2-50 placeholder:text-slate2-500 flex-1', placeholder:'Search action, venue, reason', value:q,
 onInput: e => { q = e.target.value; paintAudit(); }}),
 q ? el('button',{class:'text-slate2-500 hover:text-slate2-200 cursor-pointer bg-transparent border-0 shrink-0', onclick:()=>{ q=''; paintAudit(); }}, lucide('x',{class:'h-3.5 w-3.5'})) : null
 ),
 el('select',{class:'bg-slate2-50/5 border border-slate2-50/10 rounded-full px-3 py-1.5 text-xs text-slate2-50 cursor-pointer',
 onChange: e => { venueFilter = e.target.value; paintAudit(); }
 },
 el('option',{value:''}, 'All venues'),

 return el('option',{value:s, selected: venueFilter === s ? '' : false}, v ? v.name : s);
 })
 )
 ),
 el('div',{class:'flex items-center justify-between gap-3'},
 el('div',{class:'text-xs text-slate2-400'},
 totalMatching + ' entr' + (totalMatching===1?'y':'ies') + (totalMatching > HARD_CAP && !showAll ? ' · showing first ' + HARD_CAP : '')
 ),
 totalMatching > HARD_CAP && el('button',{class:'text-xs underline cursor-pointer bg-transparent border-0 text-slate2-300',
 onclick:()=>{ showAll = !showAll; paintAudit(); }
 }, showAll ? 'Limit to ' + HARD_CAP : 'Show all ' + totalMatching)
 )
 );

 if (entries.length === 0) {
 wrap.append(el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-6 text-sm text-slate2-400'},
 (store.auditLog || []).length === 0
 ? 'No audit entries yet, existing admin handlers can opt in by calling logAudit(...). See the helper comments in source for the recommended hooks.'
 : 'No entries match this filter.'
 ));
 return;
 }

 // Compute a stable diff between two snapshots, top-level keys only,
 // good enough for the demo's small venue shape.
 function diffRows(before, after) {
 const keys = new Set([...Object.keys(before || {}), ...Object.keys(after || {})]);
 const rows = [];
 keys.forEach(k => {
 const a = (before||{})[k];
 const b = (after||{})[k];
 if (JSON.stringify(a) === JSON.stringify(b)) return;
 rows.push({ k, a, b });
 });
 return rows;
 }
 function fmt(v) {
 if (v == null) return el('em',{class:'text-slate2-400'},'(none)');
 if (typeof v === 'object') return el('code',{class:'text-xs text-slate2-300 break-all'}, JSON.stringify(v));
 return el('span',{class:'text-xs text-slate2-200'}, String(v));
 }

 wrap.append(
 el('div',{class:'space-y-2'},
 ...entries.map(e => {
 const v = e.venueSlug ? findVenueBySlug(e.venueSlug) : null;
 const author = store.users.find(usr => usr.id === e.adminId);
 const isOpen = expandedId === e.id;
 const rows = isOpen ? diffRows(e.before, e.after) : [];
 return el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10'},
 el('button',{class:'w-full text-left px-4 py-3 cursor-pointer bg-transparent border-0',
 onclick:()=>{ expandedId = isOpen ? null : e.id; paintAudit(); }
 },
 el('div',{class:'flex items-center justify-between gap-3 flex-wrap'},
 el('div',{class:'min-w-0 flex-1'},
 el('div',{class:'text-sm'},
 el('span',{class:'font-extrabold text-slate2-50'}, e.action),
 ' · ',
 el('span',{class:'text-slate2-300'}, v ? v.name : (e.venueSlug || '(no venue)')),
 ),
 el('div',{class:'text-xs text-slate2-400'},
 (author ? author.email : 'unknown admin'),
 ' · ',
 e.ts ? new Date(e.ts).toLocaleString('en-GB') : '',
 e.reason ? ' · ' + e.reason : ''
 )
 ),
 el('span',{class:'text-xs text-slate2-400 shrink-0'}, isOpen ? '▾' : '▸')
 )
 ),
 isOpen && el('div',{class:'px-4 pb-4 border-t border-slate2-50/10 pt-3 space-y-2'},
 rows.length === 0
 ? el('p',{class:'text-xs text-slate2-400 italic'},'No field-level differences captured.')
 : el('div',{class:'overflow-x-auto'},
 el('table',{class:'w-full text-xs'},
 el('thead',{class:'text-slate2-400 text-left uppercase tracking-widest'},
 el('tr',{}, el('th',{class:'pb-2 pr-3'},'Field'), el('th',{class:'pb-2 pr-3'},'Before'), el('th',{class:'pb-2'},'After'))
 ),
 el('tbody',{},
 ...rows.map(r => el('tr',{class:'border-t border-slate2-50/5 align-top'},
 el('td',{class:'py-2 pr-3 font-mono text-slate2-300 whitespace-nowrap'}, r.k),
 el('td',{class:'py-2 pr-3 text-red-300'}, fmt(r.a)),
 el('td',{class:'py-2 text-accent-emer'}, fmt(r.b))
 ))
 )
 )
 ),
 el('div',{class:'flex justify-end'},
 e.before
 ? el('button',{class:'rounded-full bg-mv-500 text-white px-4 py-1.5 text-xs font-extrabold cursor-pointer', onclick:()=>{
 confirmDo('Revert ' + (v ? v.name : e.venueSlug) + ' to the recorded "before" state? This overwrites current fields.', () => applyRevert(e));
 }},'↺ Revert to this state')
 : el('span',{class:'text-xs text-slate2-400 italic'},'No "before" snapshot recorded, revert disabled.')
 )

 );
 })
 )
 );
 }

 // 2) Common attributes, placeholder, title, aria-label, value (button)
 var els = root.querySelectorAll('[placeholder],[title],[aria-label]');
 for (var i = 0; i < els.length; i++) {
 var el = els[i];
 ['placeholder','title','aria-label'].forEach(function(a){
 var v = el.getAttribute(a);
 if (v && TR[v.trim()]) el.setAttribute(a, TR[v.trim()]);
 });
 }
 } catch(err) { /* no-op: don't let translation break rendering */ }
}
// Lock the <html lang> attribute so screen readers + browser features know
document.documentElement.setAttribute('lang', MV_LANG);

function render() {
 const root = $('#root');
 root.innerHTML = '';
 const page = ROUTES[state.route] || Landing;
 root.appendChild(page());
 // Translate every English text node / attribute under root in one pass.
 autoTranslate(root);
 // Also translate the Concept banner + headers / footers that live
 // OUTSIDE #root (those render inline via page() but if any sticky
 // chrome lives on document.body, sweep it too).
 autoTranslate(document.body);
}

// If the user already has a session, route them to their right home.
if (state.session) {
 const u = currentUser();
 if (u) {
 if (state.route === 'landing') {
 // keep them on landing, that's the marketing entrance, but the header
 // shows "Open App →" for them now
 }
 } else {
 clearSession();
 }
}
render();
installIdleTimeout();
// Phase 2: kick off cross-device venue pull right after first render so
// the UI paints fast first, then upgrades to Supabase data when it arrives.
if (typeof fetchVenuesFromSupabaseAndMerge === 'function') {
 setTimeout(function(){ fetchVenuesFromSupabaseAndMerge(); }, 50);
}
</script>
</body>
