    // Build an inline edit form for a venue. `isSeed = true` saves to
    // store.seedOverrides[slug]; otherwise saves directly to the partner
    // venue in store.partnerVenues. Editable fields differ slightly:
    // seed venues only expose Name / Cuisine / Barrio / Price tier; partner
    // venues additionally expose Address / Postcode / Website / Instagram.
    function buildEditForm(venue, isSeed) {
      const current = isSeed
        ? { ...venue, ...((store.seedOverrides || {})[venue.slug] || {}) }
        : venue;
      const form = document.createElement('div');
      form.setAttribute('data-edit-form', '1');
      form.className = 'mt-4 pt-4 border-t border-slate2-50/10 grid sm:grid-cols-2 gap-3';
      function input(name, label, val, type) {
        const wrap = document.createElement('label');
        wrap.className = 'block';
        wrap.innerHTML = '<div class="text-[10px] uppercase tracking-widest text-slate2-400 font-bold mb-1">' + label + '</div>';
        const inp = document.createElement('input');
        inp.type = type || 'text';
        inp.name = name;
        inp.value = val ?? '';
        inp.className = 'w-full rounded-xl bg-slate2-50/[0.04] border border-slate2-50/15 px-3 py-2 text-sm text-slate2-50 outline-none focus:border-mv-500/60';
        wrap.appendChild(inp);
        return wrap;
      }
      form.appendChild(input('name', 'Name', current.name));
      form.appendChild(input('cuisine', 'Cuisine', current.cuisine));
      form.appendChild(input('barrio', 'Barrio', current.barrio));
      form.appendChild(input('priceTier', 'Price tier (1–4)', current.priceTier ?? 2, 'number'));
      if (!isSeed) {
        form.appendChild(input('address', 'Address', current.address));
        form.appendChild(input('postcode', 'Postcode', current.postcode));
        form.appendChild(input('website', 'Website', current.website));
        form.appendChild(input('instagram', 'Instagram', current.instagram));
      }
      const actions = document.createElement('div');
      actions.className = 'sm:col-span-2 flex gap-2 justify-end mt-2';
      const save = document.createElement('button');
      save.type = 'button';
      save.className = 'rounded-full bg-mv-500 hover:bg-mv-600 text-white px-4 py-2 text-xs font-extrabold cursor-pointer';
      save.textContent = 'Save changes';
      save.onclick = () => {
        const changes = {};
        form.querySelectorAll('input').forEach(inp => {
          const v = inp.type === 'number' ? Number(inp.value) : inp.value.trim();
          if (v !== '' && v !== (current[inp.name] ?? '')) changes[inp.name] = v;
        });
        if (Object.keys(changes).length === 0) { toast('No changes'); return; }
        if (isSeed) {
          store.seedOverrides = store.seedOverrides || {};
          store.seedOverrides[venue.slug] = { ...(store.seedOverrides[venue.slug] || {}), ...changes };
        } else {
          Object.assign(venue, changes);
        }
        saveStore();
        toast('Saved · ' + (changes.name || venue.name));
        render();
      };
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'rounded-full bg-slate2-50/10 border border-slate2-50/15 text-slate2-50 px-4 py-2 text-xs font-bold cursor-pointer';
      cancel.textContent = 'Cancel';
      cancel.onclick = () => form.remove();
      actions.appendChild(cancel);
      actions.appendChild(save);
      form.appendChild(actions);
      return form;
    }

    paintPartners();
    return wrap;
  }

  // ===== Tab: Activity (bookings + redemptions) =====
  function AdminActivity() {
    let q = '';
    let scope = 'active';
    const wrap = el('div',{class:'space-y-4'});
    function paintActivity() {
      wrap.innerHTML = '';
      const now = Date.now();
      let list = [];
      if (scope === 'active') list = store.bookings.filter(b => !b.redeemed && !b.cancelled && b.expiresAt > now);
      else if (scope === 'redeemed') list = store.bookings.filter(b => b.redeemed);
      else if (scope === 'expired') list = store.bookings.filter(b => !b.redeemed && !b.cancelled && b.expiresAt <= now);
      else if (scope === 'cancelled') list = store.bookings.filter(b => b.cancelled);
      else list = store.bookings.slice();
      list = list.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      if (q) {
        list = list.filter(b => {
          const v = findVenueBySlug(b.venueSlug);
          const m = store.users.find(x => x.id === b.memberId);
          const hay = (b.code + ' ' + (v?.name||'') + ' ' + (m?.email||'')).toLowerCase();
          return hay.includes(q.toLowerCase());
        });
      }
      wrap.append(
        el('div',{class:'flex items-center gap-3 flex-wrap'},
          el('div',{class:'flex-1 min-w-[200px] flex items-center gap-2 bg-slate2-50/5 rounded-full px-3 py-2 border border-slate2-50/10'},
            el('span',{class:'text-slate2-400'},'🔍'),
            el('input',{class:'bg-transparent outline-none text-sm flex-1', placeholder:'Search by code, venue, member email', value:q,
              onInput: e => { q = e.target.value; paintActivity(); }})
          ),
          el('div',{class:'flex gap-1 flex-wrap'},
            ...[['active','Active'],['redeemed','Redeemed'],['expired','Expired'],['cancelled','Cancelled'],['all','All']].map(([s,l]) =>
              el('button',{class:'rounded-full px-3 py-1.5 text-xs font-bold cursor-pointer ' + (scope === s ? 'bg-slate2-50 text-ink-900' : 'bg-slate2-50/5 text-slate2-300 border border-slate2-50/10'),
                onclick:()=>{ scope = s; paintActivity(); }
              }, l)
            )
          )
        ),
        el('div',{class:'text-xs text-slate2-400'}, list.length + ' booking' + (list.length===1?'':'s')),
        el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 overflow-hidden'},
          el('table',{class:'w-full text-sm'},
            el('thead',{class:'text-slate2-400 text-left text-xs uppercase tracking-widest'}, el('tr',{}, el('th',{class:'p-3'},'Code'), el('th',{},'Venue'), el('th',{},'Member'), el('th',{},'Status'), el('th',{},'When'), el('th',{},'Actions'))),
            el('tbody',{},
              ...(list.length === 0
                ? [el('tr',{}, el('td',{class:'p-4 text-sm text-slate2-400 text-center', colspan:'6'},'No bookings match.'))]
                : list.slice(0, 100).map(b => {
                    const v = findVenueBySlug(b.venueSlug);
                    const m = store.users.find(x => x.id === b.memberId);
                    const isActive = !b.redeemed && !b.cancelled && b.expiresAt > now;
                    const status = b.redeemed ? 'REDEEMED' : b.cancelled ? 'CANCELLED' : (b.expiresAt <= now ? 'EXPIRED' : 'ACTIVE');
                    const cls = status==='REDEEMED' ? 'text-accent-emer' : status==='ACTIVE' ? 'text-mv-400' : 'text-slate2-400';
                    return el('tr',{class:'border-t border-slate2-50/5'},
                      el('td',{class:'p-3 font-mono text-xs font-bold'}, b.code),
                      el('td',{class:'text-xs'},
                        el('button',{class:'underline hover:text-slate2-50 cursor-pointer bg-transparent border-0 text-left', onclick:()=>v && go('venue',{slug:v.slug})}, v?.name ?? '(unknown)')
                      ),
                      el('td',{class:'text-xs font-mono'}, m?.email ?? '—'),
                      el('td',{class:'text-xs font-extrabold ' + cls}, status),
                      el('td',{class:'text-xs text-slate2-400'},
                        b.redeemedAt ? new Date(b.redeemedAt).toLocaleString('en-GB') :
                        b.createdAt ? new Date(b.createdAt).toLocaleString('en-GB') : '—'
                      ),
                      el('td',{class:'text-xs'},
                        isActive && el('button',{class:'underline text-red-300 cursor-pointer bg-transparent border-0', onclick:()=>{
                          confirmDo('Cancel this active booking?', ()=>{
                            b.cancelled = true; saveStore(); toast('Booking cancelled'); render();
                          });
                        }},'Cancel'),
                        status === 'ACTIVE' && el('button',{class:'ml-2 underline text-accent-emer cursor-pointer bg-transparent border-0', onclick:()=>{
                          confirmDo('Manually mark redeemed? (admin override)', ()=>{
                            const now = Date.now();
                            b.redeemed = true; b.redeemedAt = now;
                            // E-2: audit trail — record which admin overrode this so we can
                            // distinguish operator decisions from real partner redemptions.
                            store.redemptions.unshift({
                              memberId: b.memberId,
                              venueSlug: b.venueSlug,
                              redeemedAt: now,
                              method: 'ADMIN_OVERRIDE',
                              byUserId: u.id,
                              byEmail: u.email
                            });
                            saveStore(); toast('Marked redeemed'); render();
                          });
                        }},'Mark redeemed')
                      )
                    );
                  })
              )
            )
          )
        )
      );
    }
    paintActivity();
    return wrap;
  }

            const blob = new Blob([dataJson], { type:'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'menuverso-store-' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json';
            document.body.appendChild(a); a.click(); a.remove();

          el('button',{class:'rounded-full bg-slate2-50/5 border border-slate2-50/10 px-4 py-1.5 text-xs font-bold cursor-pointer', onclick:()=>{
            navigator.clipboard?.writeText(dataJson).then(()=>toast('Copied to clipboard'), ()=>toast('Copy failed','err'));
          }},'Copy to clipboard')
        ),
        el('details',{class:'mt-3 text-xs text-slate2-300'},
          el('summary',{class:'cursor-pointer text-slate2-400 hover:text-slate2-50'},'Preview JSON'),
          el('pre',{class:'mt-2 max-h-64 overflow-auto bg-ink-900/80 border border-slate2-50/10 rounded-md p-3 text-[11px] font-mono'}, dataJson)
        )
      ),
      el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-5'},
        el('h3',{class:'font-bold'},'📥 Data import'),
        el('p',{class:'mt-1 text-xs text-slate2-400'},'Replace the entire store with a previously-exported JSON. Refreshes the app on success.'),
        (() => {
          const ta = el('textarea',{class:'mt-3 w-full bg-ink-900/80 border border-slate2-50/10 rounded-xl px-3 py-2 text-[11px] font-mono', rows:'6', placeholder:'Paste a JSON dump here…'});
          const btn = el('button',{class:'mt-3 rounded-full bg-mv-500 hover:bg-mv-600 text-white px-4 py-1.5 text-xs font-extrabold cursor-pointer', onclick:()=>{
            const txt = ta.value.trim();
            if (!txt) { toast('Paste a JSON first','err'); return; }
            confirmDo('Replace ALL data with this JSON? Your current state will be overwritten.', ()=>{
              try {
                const parsed = JSON.parse(txt);
                Object.keys(store).forEach(k => delete store[k]);
                Object.assign(store, parsed);
                saveStore(); toast('Imported. Reloading…');
                setTimeout(()=>{ render(); }, 400);
              } catch (e) { toast('Invalid JSON: ' + e.message, 'err'); }
            });
          }},'Import & overwrite');
          return el('div',{}, ta, btn);
        })()
      ),
      el('div',{class:'rounded-2xl bg-red-500/10 border border-red-500/30 p-5'},
        el('h3',{class:'font-bold text-red-200'},'⚠️ Reset all data'),
        el('p',{class:'mt-1 text-xs text-red-200/80'},'Wipes localStorage and reloads the page with the original seed. Use during demos when state has drifted.'),
        el('button',{class:'mt-3 rounded-full bg-red-500/30 border border-red-500/50 text-red-100 px-4 py-1.5 text-xs font-extrabold cursor-pointer', onclick:()=>{
          confirmDo('Wipe ALL demo data and reload? This cannot be undone.', ()=>{
            try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(SESSION_KEY); } catch (_) {}
            location.reload();
          });
        }},'Wipe & reload')
      ),
      el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-5'},
        el('h3',{class:'font-bold'},'📚 Catalog'),
        el('p',{class:'mt-1 text-xs text-slate2-400'},'Read-only — the static seed catalog of placeholder venues used to populate Discover before real partners onboard.'),
        el('div',{class:'mt-3 text-xs text-slate2-300'},'Total: ', el('strong',{class:'text-slate2-50'}, String(VENUES.length)), ' placeholder venues')
      )
    );
  }

  return el('div',{class:'min-h-screen bg-ink-950 text-slate2-50'},
    el('header',{class:'border-b border-slate2-50/5 bg-ink-900/80 sticky top-0 z-30'},
      el('div',{class:'mx-auto max-w-6xl px-4 py-3 flex items-center justify-between'},
        el('div',{class:'flex items-center gap-2'},
          el('div',{},
            el('div',{class:'font-bold'}, el('span',{class:'lowercase text-mv-500'},'menuverso'), ' · admin'),
            el('div',{class:'text-xs text-slate2-400'}, u.email)
          )
        ),
        el('button',{class:'text-xs text-slate2-400 underline cursor-pointer bg-transparent border-0', onclick:logout},'Sign out')
      )
    ),
    tabBar,
    el('div',{class:'mx-auto max-w-6xl px-4 py-6'},
      tab === 'overview' ? AdminOverview() :
      tab === 'partners' ? AdminPartners() :
      tab === 'requests' ? AdminRequests() :
      tab === 'users' ? AdminUsers() :
      tab === 'activity' ? AdminActivity() :
      tab === 'system' ? AdminSystem() :
      AdminOverview()
    )
  );
}

  "\"Most deals platforms pitch you on volume. We're building the opposite.\"": "\"La mayoría de plataformas de ofertas te venden volumen. Nosotros construimos lo contrario.\"",
  "Pay a cut of every cover, get a flood of price-sensitive diners, and hope to break even on drinks. That's the model. It works for the platform — for the restaurant, the math rarely does.": "Paga un porcentaje de cada cubierto, recibe una avalancha de comensales sensibles al precio, y reza por compensar con las bebidas. Ese es el modelo. Funciona para la plataforma — para el restaurante, los números rara vez cuadran.",
  "Members pay from €3.99/month for the privilege of dining out at a curated set of Barcelona restaurants. That fee is our entire revenue. Your bill goes straight to you — we take": "Los miembros pagan desde 3,99 €/mes por el privilegio de salir a cenar en un grupo seleccionado de restaurantes de Barcelona. Esa cuota es todo nuestro ingreso. Tu cuenta va directa a ti — nos llevamos",

  "In return, you set the rules: which days, which slots, which seats. Pause for holidays in one click. We're onboarding the first venues now and we'd love yours to be one of them.": "A cambio, tú pones las reglas: qué días, qué turnos, cuántas mesas. Pausa por vacaciones con un clic. Estamos incorporando los primeros locales ahora mismo y nos encantaría que el tuyo fuera uno de ellos.",

  "before you list": "antes de listar",
  "So how does Menuverso make money if there's no commission?": "Entonces, ¿cómo gana dinero Menuverso si no hay comisión?",
  "Members pay €3.99/month (billed annually) or €6.99/month (billed monthly). That subscription is our only revenue. We don't take a cut of your bill and we never will — it'd undermine the trust that gets restaurants to list here in the first place.": "Los miembros pagan 3,99 €/mes (facturación anual) o 6,99 €/mes (facturación mensual). Esa suscripción es nuestro único ingreso. No nos quedamos un porcentaje de tu cuenta y nunca lo haremos — destruiría la confianza que hace que los restaurantes se listen aquí en primer lugar.",
  "What if I get too many bookings?": "¿Y si me llegan demasiadas reservas?",
  "You control the slots. Each slot has a seat cap. Once it's full, members can't book it. You can pause your entire listing in one click — useful for holidays, private events, or when a server quits.": "Tú controlas los turnos. Cada turno tiene un límite de mesas. Una vez lleno, los miembros no pueden reservar. Puedes pausar todo tu listado con un clic — útil para vacaciones, eventos privados, o cuando se va un camarero.",
  "Do I have to discount every dish?": "¿Tengo que descontar todos los platos?",
  "Not unless you want to. You set the deal — could be 2x1 on mains only, drinks only, full menu, a flash dessert giveaway, percentage off the bill. Members see the terms before they slide to redeem.": "Solo si tú quieres. Tú decides la oferta — puede ser 2×1 solo en principales, solo bebidas, carta completa, un postre flash gratis, un porcentaje sobre la cuenta. Los miembros ven las condiciones antes de deslizar para canjear.",
  "Can I exclude certain dishes (e.g. lobster, special menu)?": "¿Puedo excluir ciertos platos (p. ej. bogavante, menú degustación)?",
  "Yes. In Profile → Deals, you write the terms. \"Excludes tasting menu\", \"Mains under €25\", whatever you like. The terms are shown to members before they book.": "Sí. En Perfil → Ofertas, tú escribes las condiciones. \"Excluye menú degustación\", \"Principales hasta 25 €\", lo que prefieras. Las condiciones se muestran a los miembros antes de reservar.",
  "How does the staff know the redemption is real?": "¿Cómo sabe el personal que el canje es real?",
  "Members slide-to-redeem at the table in front of your server, then show an animated verification screen — rotating venue token, live timestamp, shimmer pattern. Screenshots can't fake it. The same redemption pings your dashboard in real time as a secondary confirmation.": "Los miembros deslizan para canjear en la mesa delante del camarero, y luego enseñan una pantalla de verificación animada — token rotativo del local, marca de tiempo en vivo, brillo en movimiento. Las capturas de pantalla no lo pueden falsificar. El mismo canje hace ping en tu panel en tiempo real como confirmación secundaria.",
  "Can I list multiple restaurants?": "¿Puedo listar varios restaurantes?",
  "Yes — one partner account, multiple venues. Each venue has its own slots, hours, and dashboard. Get in touch and we'll set it up.": "Sí — una cuenta de partner, varios locales. Cada local tiene sus propios turnos, horarios y panel. Contáctanos y lo configuramos.",

function autoTranslate(root) {
  if (MV_LANG !== 'es' || !root) return;
  var TR = window.MV_TR_ES; if (!TR) return;
  try {
    // 1) Text nodes (most user-facing copy)
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var n;
    while ((n = w.nextNode())) {
      var raw = n.nodeValue;
      if (!raw) continue;
      var key = raw.trim();
      if (key && TR[key]) {
        // Preserve leading/trailing whitespace from the original node
        var lead = raw.slice(0, raw.indexOf(key));
        var tail = raw.slice(raw.indexOf(key) + key.length);
        n.nodeValue = lead + TR[key] + tail;
      }
    }
    // 2) Common attributes — placeholder, title, aria-label, value (button)
    var els = root.querySelectorAll('[placeholder],[title],[aria-label]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      ['placeholder','title','aria-label'].forEach(function(a){
        var v = el.getAttribute(a);
        if (v && TR[v.trim()]) el.setAttribute(a, TR[v.trim()]);
      });
    }
  } catch(err) { /* no-op: don't let translation break rendering */ }
}
// Lock the <html lang> attribute so screen readers + browser features know
document.documentElement.setAttribute('lang', MV_LANG);

function render() {
  const root = $('#root');
  root.innerHTML = '';
  const page = ROUTES[state.route] || Landing;
  root.appendChild(page());
  // Translate every English text node / attribute under root in one pass.
  autoTranslate(root);
  // Also translate the Concept banner + headers / footers that live
  // OUTSIDE #root (those render inline via page() but if any sticky
  // chrome lives on document.body, sweep it too).
  autoTranslate(document.body);
}

// If the user already has a session, route them to their right home.
if (state.session) {
  const u = currentUser();
  if (u) {
    if (state.route === 'landing') {
      // keep them on landing — that's the marketing entrance, but the header
      // shows "Open App →" for them now
    }
  } else {
    clearSession();
  }
}
render();
installIdleTimeout();
