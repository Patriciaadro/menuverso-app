function yearMonthOf(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function currentYearMonth() { return yearMonthOf(Date.now()); }
// How many credits has this member already committed at this restaurant
// during the current calendar month? = past redemptions this month + any
// active (unredeemed/uncancelled/unexpired) bookings created this month.
function userCreditsForVenueThisMonth(userId, venueSlug) {
  const ym = currentYearMonth();
  const now = Date.now();
  const redeemedThisMonth = (store.redemptions || []).filter(r =>
    r.memberId === userId &&
    r.venueSlug === venueSlug &&
    yearMonthOf(r.redeemedAt) === ym
  ).length;
  const activeBookings = (store.bookings || []).filter(b =>
    b.memberId === userId &&
    b.venueSlug === venueSlug &&
    !b.redeemed && !b.cancelled &&
    b.expiresAt > now
  ).length;
  return redeemedThisMonth + activeBookings;
}
// Remaining credits this month. capOverride lets a UI override pull from
// the partner venue without needing the full venue lookup.
function userCreditsRemaining(userId, venueSlug, capOverride) {
  const v = findVenueBySlug(venueSlug);
  const cap = capOverride
    ?? v?._pv?.creditsPerUser
    ?? DEFAULT_CREDITS_PER_USER;
  return Math.max(0, cap - userCreditsForVenueThisMonth(userId, venueSlug));
}
// User-friendly label for when credits next refresh. Always the 1st of next month.
function creditsRefreshLabel() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  return next.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });
}

function bookSlot(v, slot) {
  const u = currentUser();
  if (!u) { go('signin'); return; }
  if (u.role !== 'MEMBER') {
    toast(u.role === 'PARTNER_OWNER' ? 'Partner accounts can\'t book deals — sign in as a member.' : 'Admin accounts can\'t book deals.', 'err');
    return;
  }
  if (!hasSub()) { go('checkout'); return; }
  // G4: enforce per-user, per-restaurant, per-month credit cap. Counts both
  // redemptions this month AND active unexpired bookings so the user can't
  // pre-stack codes. The cap refreshes on the 1st of every month.
  {
    // G2: read the LIVE cap (admin-approved), not the partner's editor draft.
    const cap = (v._pv?.liveDeal?.creditsPerUser) ?? v._pv?.creditsPerUser ?? DEFAULT_CREDITS_PER_USER;
    const remaining = userCreditsRemaining(u.id, v.slug, cap);
    if (remaining <= 0) {
      toast(`You've used your ${cap} credit${cap===1?'':'s'} at ${v.name || 'this restaurant'} this month. Come back ${creditsRefreshLabel()}.`, 'err');
      return;
    }
  }
  // Block paused venues.
  if (v._pv && v._pv.status === 'PAUSED') { toast('This venue paused new bookings — try again later.', 'err'); return; }
  // Rate-limit defense (E-5).
  if (tooManyRecentBookings(u.id)) { toast('Slow down — too many bookings in the last minute.', 'err'); return; }
  // B-2: enforce day-of-week + time-of-day if this is a partner-owned venue with structured slots.
  const slotEntry = v._pv ? resolveSlotFromLabel(v._pv, slot) : null;
  if (slotEntry && !isSlotBookableNow(v._pv, slotEntry)) {
    toast('That slot isn\'t open right now. Try a different time.', 'err');
    return;
  }
  // B-1: enforce per-slot capacity. Default 4 covers if the partner hasn't set one.
  const seatCap = (slotEntry && Number.isFinite(slotEntry.seatCap)) ? slotEntry.seatCap : 4;
  if (activeSlotCount(v.slug, slot) >= seatCap) {
    toast('That slot is fully booked — try another time.', 'err');
    return;
  }
  // M-3: enforce single active booking across all venues. Cancel any prior code
  // (NOT just same-venue). Tell the member if we did.
  let cancelledOther = null;
  store.bookings.forEach(b => {
    if (b.memberId === u.id && !b.redeemed && !b.cancelled && b.expiresAt > Date.now()) {
      if (b.venueSlug !== v.slug || b.slot !== slot) {
        const otherV = findVenueBySlug(b.venueSlug);
        if (otherV && !cancelledOther) cancelledOther = otherV.name;
      }
      b.cancelled = true;
      // Tag the cancel reason so AppBookings can explain why an old row
      // shows "Cancelled" without the user having clicked anything.
      b.cancelReason = b.cancelReason || 'CROSS_VENUE_REBOOK';
    }
  });
  const booking = {
    id: 'b_' + Math.random().toString(36).slice(2,10),
    memberId: u.id,
    venueSlug: v.slug,
    code: uniqueCode6(),
    slot,
    createdAt: Date.now(),
    expiresAt: Date.now() + 60*60*1000,
    redeemed: false,
    cancelled: false
  };
  store.bookings.unshift(booking);
  saveStore();
  if (cancelledOther) toast('Cancelled your prior code at ' + cancelledOther + '.');
  go('booking',{id:booking.id});
}

function Booking() {
  const u = currentUser();
  const b = store.bookings.find(x => x.id === state.params.id);
  if (!u || !b || b.memberId !== u.id) { go('app'); return el('div'); }
  const v = findVenueBySlug(b.venueSlug);
  const inner = el('div',{class:'pb-8'});

  function paint() {
    inner.innerHTML = '';
    // === STAGE B (animated verification) — must precede the redeemed-success
    // branch below, otherwise commitRedeem (which sets b.redeemed=true) would
    // skip straight to the success view. While the redemption is still fresh
    // (< 6 minutes old), show the shimmer-gradient verification screen with
    // a rotating display token + live timestamp.
    if (b.redeemed && b.redeemedAt && Date.now() - b.redeemedAt < 6 * 60 * 1000) {
      const bucket = Math.floor(Date.now() / 2000);
      let h = 0x811c9dc5 >>> 0;
      const seed = b.id + ':' + bucket;
      for (let i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
      const hex = h.toString(16).padStart(8, '0').toUpperCase();
      const token = `T·${hex.slice(0,3)}·${hex.slice(3,6)}`;
      const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
      inner.append(
        el('div',{class:'p-5'},
          el('div',{class:'relative rounded-3xl overflow-hidden shadow-2xl shadow-mv-500/30 ring-1 ring-mv-500/40 mt-2'},
            el('div',{class:'absolute inset-0', style:'background: linear-gradient(135deg, #DC4A26 0%, #F08461 50%, #B73A1A 100%);'}),
            el('div',{class:'absolute inset-0 mv-shimmer-anim opacity-20 pointer-events-none'}),
            el('div',{class:'relative p-7 text-white text-center'},
              el('div',{class:'text-[10px] uppercase tracking-[0.28em] font-extrabold opacity-85'},'Redeeming at'),
              el('h1',{class:'mt-1 font-serif-display italic text-3xl font-extrabold leading-tight'}, v?.name ?? '?'),
              el('p',{class:'mt-2 text-sm font-bold opacity-85'}, b.slot),
              el('div',{class:'mt-7 mx-auto h-40 w-40 rounded-full grid place-items-center relative', style:'border: 2px dashed rgba(255,255,255,0.35);'},
                el('div',{class:'absolute inset-2 rounded-full', style:'border: 1px solid rgba(255,255,255,0.4);'}),
                el('div',{class:'text-center'},
                  el('div',{class:'text-[9px] uppercase tracking-[0.25em] font-bold opacity-80'},'Verification'),
                  el('div',{class:'mt-1 font-mono font-extrabold text-xl tracking-widest'}, token)
                )
              ),
              el('div',{class:'mt-6 font-mono font-bold text-sm opacity-90'}, ts, ' · BCN'),
              el('div',{class:'text-[10px] uppercase tracking-[0.2em] font-extrabold opacity-85 mt-1'},'Show this to your server'),
              el('div',{class:'mt-5 inline-flex items-center gap-2 rounded-full bg-accent-emer/95 px-3 py-1.5 text-xs font-bold'},
                el('span',{html:'<svg viewBox="0 0 24 24" class="h-4 w-4 text-white" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l4 4L20 6"/></svg>'}),
                'Confirmed · partner notified'
              )
            )
          ),
          el('button',{class:'mt-6 w-full rounded-2xl bg-slate2-50 text-ink-900 hover:bg-slate2-200 py-3 font-extrabold cursor-pointer transition text-sm', onclick:()=>go('profile')},'Done — back to profile')
        )
      );
      return;
    }
    if (b.redeemed) {
      const existingReview = (store.reviews || []).find(r => r.memberId === u.id && r.venueSlug === b.venueSlug);
      const rated = !!existingReview;
      inner.append(el('div',{class:'p-6 text-center'},
        el('div',{class:'pop mx-auto h-24 w-24 rounded-full bg-accent-emer/15 grid place-items-center text-5xl border-4 border-accent-emer'},'✓'),
        el('h1',{class:'mt-5 text-2xl font-extrabold'},'Redeemed'),
        el('p',{class:'mt-1 text-slate2-300'}, v?.name),
        el('p',{class:'mt-1 text-xs text-slate2-500'}, new Date(b.redeemedAt).toLocaleString('en-GB')),
        el('p',{class:'mt-6 text-sm text-slate2-300'},'Enjoy your meal.'),
        // ---- Rate-your-visit ----
        el('div',{class:'mt-8 rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-5 text-left max-w-md mx-auto'},
          rated
            ? el('div',{class:'text-center'},
                el('div',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'},'Your rating'),
                el('div',{class:'mt-2 text-accent-amber text-2xl'}, '★'.repeat(existingReview.stars) + '☆'.repeat(5 - existingReview.stars)),
                existingReview.note && el('p',{class:'mt-2 text-sm text-slate2-300 italic'}, '"' + existingReview.note + '"')
              )
            : (() => {
                const wrap2 = el('div',{class:'text-center'});
                let stars = 0; let note = '';
                function paintRater() {
                  wrap2.innerHTML = '';
                  wrap2.append(
                    el('div',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'},'How was it?'),
                    el('div',{class:'mt-3 flex justify-center gap-1'},
                      ...[1,2,3,4,5].map(n => el('button',{
                        class:'text-3xl cursor-pointer bg-transparent border-0 transition ' + (n <= stars ? 'text-accent-amber' : 'text-slate2-500 hover:text-accent-amber/60'),
                        onclick:()=>{ stars = n; paintRater(); }
                      }, '★'))
                    ),
                    stars > 0 && el('textarea',{
                      class:'mt-3 w-full bg-slate2-50/[0.04] border border-slate2-50/10 rounded-xl px-3 py-2 text-sm', rows:'2', placeholder:'Quick note (optional)',
                      onInput: e => { note = e.target.value; }
                    }),
                    stars > 0 && el('button',{
                      class:'mt-3 w-full rounded-full bg-mv-500 hover:bg-mv-600 text-white py-2.5 text-sm font-extrabold cursor-pointer',
                      onclick: ()=>{
                        if (!store.reviews) store.reviews = [];
                        store.reviews.push({ memberId: u.id, venueSlug: b.venueSlug, stars, note: note.trim() || null, createdAt: Date.now() });
                        saveStore(); toast('Thanks for the rating'); paint();
                      }
                    },'Submit rating')
                  );
                }
                paintRater();
                return wrap2;
              })()
        ),
        el('button',{class:'mt-8 rounded-full bg-slate2-50 text-ink-900 px-5 py-2.5 font-bold text-sm cursor-pointer', onclick:()=>go('profile')},'Back to profile')
      ));
      return;
    }
    // STAGE A — pre-confirm slide screen.
    // (STAGE B animated verification is rendered earlier in this function —
    // see the top branch, which fires while b.redeemed is true and the
    // redemption is still fresh.)
    let progress = 0;       // 0..1
    let dragging = false;
    let fired = false;

    function commitRedeem() {
      b.redeemed = true; b.redeemedAt = Date.now();
      store.redemptions.unshift({ memberId: u.id, venueSlug: b.venueSlug, redeemedAt: Date.now(), method: 'SLIDE_CONFIRM' });
      saveStore(); paint();
    }

    inner.append(
      el('div',{class:'p-5'},
        el('button',{class:'text-slate2-400 text-sm cursor-pointer bg-transparent border-0', onclick:()=>go('venue',{slug:b.venueSlug})},'← Back'),
        el('div',{class:'text-xs uppercase tracking-widest text-mv-500 font-bold mt-3 text-center'},'Redeeming at'),
        el('h1',{class:'mt-1 text-2xl font-extrabold text-center'}, v?.name ?? '?'),
        el('div',{class:'mt-1 text-sm text-slate2-400 text-center'}, b.slot),

        // Deal terms callout
        el('div',{class:'mt-6 rounded-2xl border border-mv-500/30 bg-mv-500/5 p-4 text-sm'},
          el('div',{class:'font-bold text-slate2-50'},'Before you order:'),
          el('ol',{class:'mt-2 space-y-1.5 list-decimal pl-5 text-slate2-300 text-xs'},
            el('li',{},'Tell your server you\'re redeeming with Menuverso.'),
            el('li',{},'Slide to confirm below — the animated screen proves it\'s real.'),
            el('li',{},'Your server acknowledges at the table. Order as normal.')
          )
        ),

        // Slide-to-confirm bar
        (() => {
          const track = el('div',{class:'relative h-14 rounded-full bg-slate2-50/[0.06] ring-1 ring-mv-500/30 overflow-hidden select-none mt-7'});
          const fill = el('div',{class:'absolute inset-y-0 left-0 bg-gradient-to-r from-mv-500 to-mv-400 transition-[width] duration-150 ease-out', style:'width:0%'});
          const label = el('div',{class:'absolute inset-0 flex items-center justify-center pointer-events-none text-[12px] font-extrabold uppercase tracking-[0.25em] text-slate2-300'},'Slide to redeem →');
          const thumb = el('button',{class:'absolute top-1 h-12 w-12 rounded-full bg-white shadow-lg shadow-mv-500/30 flex items-center justify-center cursor-grab', style:'left:4px'},
            el('span',{html:'<svg viewBox="0 0 24 24" class="h-5 w-5 text-mv-500" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'})
          );
          track.append(fill, label, thumb);
          function setProgress(p) {
            progress = Math.max(0, Math.min(1, p));
            fill.style.width = (progress * 100) + '%';
            const tw = track.getBoundingClientRect().width;
            thumb.style.left = Math.max(4, Math.min(tw - 52, progress * tw - 24)) + 'px';
            if (progress >= 0.92 && !fired) {
              fired = true; dragging = false;
              fill.style.width = '100%';
              label.textContent = 'Confirming…';
              setTimeout(commitRedeem, 280);
            }
          }
          function onMove(e) {
            if (!dragging || fired) return;
            const rect = track.getBoundingClientRect();
            const x = ('touches' in e ? e.touches[0]?.clientX : e.clientX) ?? rect.left;
            setProgress((x - rect.left) / rect.width);
          }
          function onUp() {
            if (fired) return;
            dragging = false;
            setProgress(0);
          }
          thumb.addEventListener('pointerdown', () => { dragging = true; fired = false; });
          thumb.addEventListener('touchstart', () => { dragging = true; fired = false; });
          window.addEventListener('pointermove', onMove);
          window.addEventListener('touchmove', onMove);
          window.addEventListener('pointerup', onUp);
          window.addEventListener('touchend', onUp);
          // Keyboard fallback — Enter or click commits.
          thumb.addEventListener('click', () => { if (!fired) { fired = true; commitRedeem(); } });
          return track;
        })(),

        el('p',{class:'mt-4 text-center text-[11px] text-slate2-500'},
          'Or ',
          el('button',{class:'underline hover:text-slate2-200 cursor-pointer bg-transparent border-0', onclick:()=>{ if (!fired) { fired = true; commitRedeem(); } }},'tap to confirm'),
          ' — both work.'
        ),
        // Cancel link
        el('div',{class:'mt-6 text-center'},
          el('button',{class:'text-xs text-slate2-400 hover:text-slate2-200 underline cursor-pointer bg-transparent border-0', onclick:()=>{
            if (confirm('Cancel this redemption? You can come back later.')) {
              b.cancelled = true; saveStore(); toast('Cancelled'); go('profile');
            }
          }},'Cancel')
        )
      )
    );
  }
  paint();
  // Repaint every second while on the animated verification screen — the
  // rotating token + ticking timestamp depend on it.
  const t = setInterval(() => {
    if (!document.body.contains(inner)) { clearInterval(t); return; }
    if (!b.redeemed || b.cancelled) return;
    // Only repaint while the animated verification window is fresh (< 6m).
    if (b.redeemedAt && Date.now() - b.redeemedAt < 6 * 60 * 1000) paint();
  }, 1000);
  return AppShell(inner, { narrow: true });
}

function PartnerLanding() {
  const me = currentUser();
  const isPartner = me?.role === 'PARTNER_OWNER';
  const isOtherRole = me && !isPartner;

  const primaryCtas = el('div',{class:'flex flex-wrap items-center gap-3'},
    !me && el('button',{class:'rounded-2xl bg-mv-500 hover:bg-mv-600 text-white px-7 py-3.5 font-extrabold cursor-pointer shadow-xl shadow-mv-500/30 transition', onclick:()=>go('partner-signup')}, t('partner.hero.cta.list')),
    !me && el('button',{class:'rounded-2xl border border-slate2-50/15 bg-slate2-50/[0.02] px-7 py-3.5 font-extrabold hover:bg-slate2-50/[0.06] cursor-pointer transition', onclick:()=>{
      setSession('u_demo_partner');
      toast('Signed in as demo partner'); go('partner-portal',{tab:'overview'});
    }}, t('partner.hero.cta.demo')),
    isPartner && el('button',{class:'rounded-2xl bg-mv-500 hover:bg-mv-600 text-white px-7 py-3.5 font-extrabold cursor-pointer shadow-xl shadow-mv-500/30', onclick:()=>go('partner-portal',{tab:'overview'})}, t('partner.hero.cta.openPortal')),
    !isPartner && !me && el('button',{class:'text-sm text-slate2-300 underline hover:text-slate2-50 cursor-pointer bg-transparent border-0', onclick:()=>go('partner-signin')}, t('partner.hero.cta.alreadyPartner')),
    // Logged-in non-partner (member/admin) — always show a clear next action.
    // No primary button works because their session blocks partner signup;

    isOtherRole && el('button',{class:'rounded-2xl bg-mv-500 hover:bg-mv-600 text-white px-7 py-3.5 font-extrabold cursor-pointer shadow-xl shadow-mv-500/30 transition', onclick:()=>{ logout(); toast('Signed out — you can register a partner account now.'); go('partner-signup'); }}, t('partner.hero.cta.signOut')),
    isOtherRole && el('button',{class:'rounded-2xl border border-slate2-50/15 bg-slate2-50/[0.02] px-7 py-3.5 font-extrabold hover:bg-slate2-50/[0.06] cursor-pointer transition', onclick:()=>go(me.role === 'ADMIN' ? 'admin' : 'app')}, t('partner.hero.cta.backAccount'))
  );

  // Inline lead-capture form — the neotaste-style "Get in touch" pattern.
  // Posts to localStorage in the demo; in production this would POST to a
  // /api/partner-lead route backed by a Supabase `partner_leads` table.
  // The full CTA buttons below this form stay as the higher-commitment path.
  const leadCapture = el('form',{class:'mt-7 max-w-lg', onsubmit: (ev)=>{
    ev.preventDefault();
    const f = ev.target;

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      toast(t('lead.invalid'));
      return;
    }
    const leads = JSON.parse(localStorage.getItem('mv_partner_leads') || '[]');

    toast(t('lead.success'));
  }},
    el('label',{class:'block text-[11px] uppercase tracking-[0.22em] font-bold text-slate2-400 mb-2'}, t('lead.label')),
    el('div',{class:'flex flex-col sm:flex-row gap-2'},

      el('button',{ type:'submit', class:'rounded-2xl bg-mv-500 hover:bg-mv-600 text-white px-7 py-3.5 font-extrabold cursor-pointer shadow-xl shadow-mv-500/30 transition shrink-0'}, t('lead.submit'))

    ConceptBanner(),
    MarketingHeader(),

    // HERO — split layout: pitch on left, glass card on right with the headline stat.

      el('div',{class:'absolute inset-0 opacity-25', style:'background-image: radial-gradient(circle at 80% 30%, #DC4A26 0, transparent 45%), radial-gradient(circle at 10% 80%, #FB7185 0, transparent 40%);'}),
      el('div',{class:'relative mx-auto max-w-6xl px-4 py-20 md:py-24 grid md:grid-cols-2 gap-12 items-center'},
        el('div',{},
          el('div',{class:'inline-flex items-center gap-2 rounded-full bg-mv-500 px-4 py-1.5 text-xs font-bold text-white shadow-lg shadow-mv-500/30 ring-1 ring-mv-600/30'},

          ),

          const sampleSlug = sample ? sample.slug : (getAllVenues()[0]?.slug);
          const previewVenue = sample ? toMemberShape(sample) : getAllVenues().find(v => v.slug === sampleSlug);
          return el('div',{class:'relative'},

        state.params.tab === 'profile' ? PortalProfile() :
        state.params.tab === 'deals' ? PortalDeals() : null

  // REJECTED — same shell but with a reason.
  if (pv.status === 'REJECTED') {
    return el('div',{class:'min-h-screen bg-ink-950 text-slate2-50'}, portalHeader,
      el('div',{class:'mx-auto max-w-2xl px-4 py-16 text-center'},

    MarketingHeader(),
    el('div',{class:'mx-auto max-w-md px-4 py-12'},

        e.preventDefault();

        const fd = new FormData(e.target);
        const pw = String(fd.get('password') || '');

          const email = String(fd.get('email')||'').trim().toLowerCase();
          if (!isEmail(email)) throw new Error('Enter a valid email.');
          if (store.users.find(u => u.email === email)) throw new Error('That email already has an account.');
          const restaurantName = String(fd.get('restaurantName')||'').trim() || 'My restaurant';
          // Build a unique slug.
          let slug = slugify(restaurantName) || 'restaurant-' + Math.random().toString(36).slice(2,6);
          while (store.partnerVenues.some(v => v.slug === slug) || VENUES.some(v => v.slug === slug)) {
            slug = slug + '-' + Math.random().toString(36).slice(2,4);
          }
          const venueId = 'pv_' + Math.random().toString(36).slice(2,10);
          const userId = 'u_' + Math.random().toString(36).slice(2,12);
          const newVenue = {
            id: venueId, ownerId: userId, name: restaurantName, slug,
            barrio: '', cuisine: '', priceTier: 2, address: '', postcode: '',
            phone: '', website: '', instagram: '',
            description: '', hours: '',
            photos: [], dealTerms: DEFAULT_DEAL_TERMS, dealSlots: DEFAULT_SLOTS(),
            rating: null, reviews: 0, status: 'DRAFT', submittedAt: null, approvedAt: null
          };
          const newUser = {
            id: userId, email,
            passwordHash: await hashPassword(String(fd.get('password'))),
            firstName: String(fd.get('firstName')||'').trim() || null,
            lastName: String(fd.get('lastName')||'').trim() || null,
            role: 'PARTNER_OWNER',
            partnerVenueId: venueId,
            createdAt: Date.now(), verifiedAt: Date.now()
          };
          store.users.push(newUser);
          store.partnerVenues.push(newVenue);
          saveStore();
          setSession(userId);
          toast('Partner account created');
          go('partner-onboarding');
        } catch (err) {
          toast(err.message, 'err');
          btn.disabled = false; btn.textContent = 'Create partner account';
        }
      }},
        el('div',{class:'grid grid-cols-2 gap-3'},
          InputField('First name','text','firstName','Joan', true),

        ),
        InputField('Restaurant name','text','restaurantName','e.g. Bar Brutal', true),
        InputField('Business email','email','email','owner@yourplace.com', true, 'email'),
        PasswordField('Password','password','At least 8 characters', { helpText:'Tap Show to verify you typed it correctly.' }),
        PasswordField('Confirm password','confirmPassword','Re-type to confirm'),
        el('button',{type:'submit', class:'mt-3 w-full rounded-2xl bg-slate2-50 text-ink-900 hover:bg-slate2-200 py-3.5 font-extrabold cursor-pointer disabled:opacity-50'},'Create partner account')
      ),
      // What happens next — explains the path for skeptical owners
      el('div',{class:'mt-6 rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-4'},
        el('div',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold mb-3'},'What happens next'),
        el('ol',{class:'space-y-2 text-sm text-slate2-300'},

            el('span',{},'Add your restaurant details and photos — ~3 minutes.')

            el('span',{},'Once you\'re live, members find you and book 2-for-1 codes. No per-redemption fees.')
          )

/* Partner onboarding — 4-step wizard with progress, inline validation, live preview. */
function PartnerOnboarding() {
  const u = currentUser();
  if (!u || u.role !== 'PARTNER_OWNER') { go('partner-signup'); return el('div'); }
  let pv = currentPartnerVenue();
  // B-4 (companion): if the owner has no venue (e.g., admin-deleted), seed a
  // fresh DRAFT so they can re-list without getting locked out of signup.
  if (!pv) {
    pv = {
      id: 'pv_' + Math.random().toString(36).slice(2,10),
      ownerId: u.id, name: '', slug: '',
      barrio: '', cuisine: '', priceTier: 2,
      address: '', postcode: '',
      phone: '', website: '', instagram: '',
      description: '', hours: '',
      photos: [], dealTerms: DEFAULT_DEAL_TERMS, dealSlots: DEFAULT_SLOTS(),
      rating: null, reviews: 0, status: 'DRAFT', submittedAt: null, approvedAt: null
    };
    store.partnerVenues.push(pv);
    u.partnerVenueId = pv.id;
    saveStore();
  }

  // Resume where they left off (persisted as state.params.step for back-button friendliness).
  // Wizard is now 5 steps (Sprint G1 added Terms): basics, address, photos, deal review, terms.
  let step = Math.max(1, Math.min(5, parseInt(state.params.step || '1', 10)));
  let errors = {}; // { fieldKey: msg }
  const wrap = el('div',{class:'min-h-screen bg-ink-950 text-slate2-50'});

  // ---- helpers ----
  function setStep(n) { step = Math.max(1, Math.min(5, n)); errors = {}; paint(); }
  function reqLabel(label, key) {
    return el('label',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold flex items-center gap-1'},
      label, el('span',{class:'text-mv-500'},'*'),
      errors[key] && el('span',{class:'normal-case text-red-400 text-xs ml-2'}, errors[key])
    );
  }
  function optLabel(label) {
    return el('label',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'}, label);
  }
  function help(s) { return el('div',{class:'mt-1 text-[10px] text-slate2-500'}, s); }
  function inputField(label, key, ph='', { required=false, type='text', help: helpText, attrs={} } = {}) {
    return el('div',{},
      required ? reqLabel(label, key) : optLabel(label),
      el('input',{
        type, value: pv[key] ?? '', placeholder: ph,
        ...attrs,
        class: 'mt-1 w-full bg-slate2-50/[0.04] border rounded-xl px-3 py-2 text-sm outline-none ' + (errors[key] ? 'border-red-500/60 focus:border-red-500' : 'border-slate2-50/10 focus:border-mv-500'),
        onInput: e => { pv[key] = e.target.value; if (errors[key]) { errors[key] = null; paint(); } }
      }),
      helpText && help(helpText)
    );
  }
  function textareaField(label, key, rows=3, { required=false, maxLen, help: helpText } = {}) {
    const count = (pv[key] ?? '').length;
    return el('div',{},
      el('div',{class:'flex items-center justify-between'},
        required ? reqLabel(label, key) : optLabel(label),
        maxLen ? el('span',{class:'text-[10px] text-slate2-500'}, `${count}/${maxLen}`) : null
      ),
      el('textarea',{
        rows: String(rows), value: pv[key] ?? '',
        class: 'mt-1 w-full bg-slate2-50/[0.04] border rounded-xl px-3 py-2 text-sm outline-none ' + (errors[key] ? 'border-red-500/60' : 'border-slate2-50/10 focus:border-mv-500'),
        onInput: e => { pv[key] = e.target.value; saveStore(); if (errors[key]) { errors[key] = null; } paint(); }
      }, pv[key] ?? ''),
      helpText && help(helpText)
    );
  }

  // ---- step validators ----
  function validateStep(n) {
    errors = {};
    if (n === 1) {
      if (!pv.name?.trim()) errors.name = 'Required';
      if (!pv.cuisine?.trim()) errors.cuisine = 'Required';
      if (!pv.barrio?.trim()) errors.barrio = 'Required';
      if (!pv.priceTier) errors.priceTier = 'Pick a price tier';
    } else if (n === 2) {
      if (!pv.address?.trim()) errors.address = 'Required';
      if (!pv.postcode?.trim()) errors.postcode = 'Required';
    } else if (n === 3) {
      if ((pv.photos || []).length === 0) errors._photos = 'Upload at least one photo';
    } else if (n === 4) {
      if (!pv.description?.trim()) errors.description = 'Required';
      if (!(pv.dealSlots || []).some(s => s.active)) errors._slots = 'Activate at least one deal slot';
    } else if (n === 5) {
      // Sprint G1: must accept the current T&C version explicitly.
      if (!pv.tncAcceptedAt || pv.tncVersion !== TNC_VERSION) errors._tnc = 'Please read and accept the partner terms';
    }
    return Object.keys(errors).length === 0;
  }
  function next() {
    if (!validateStep(step)) { saveStore(); paint(); toast('Please fix the highlighted fields', 'err'); return; }
    saveStore();
    if (step < 4) setStep(step + 1);
  }
  function back() { saveStore(); setStep(step - 1); }

  // ---- preview card (matches DealCard shape) ----
  function previewCard() {
    // Show their real uploaded photo if they have one; otherwise the
    // illustrated venue hero. Both honest — neither claims to be something it isn't.
    return el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 overflow-hidden max-w-sm'},
      el('div',{class:'relative'},
        VenueArt({_pv: pv, name: pv.name, slug: pv.slug, cuisine: pv.cuisine, barrio: pv.barrio}, {aspect:'16/9', radius:'rounded-none'}),
        el('div',{class:'absolute top-2 left-2 rounded-full bg-mv-500 px-2.5 py-1 text-[10px] font-extrabold uppercase tracking-widest z-10'},'2×1 main'),
        el('div',{class:'absolute top-2 right-2 h-8 w-8 rounded-full bg-ink-900/80 grid place-items-center text-sm z-10'},'🤍')
      ),
      el('div',{class:'p-4'},
        el('div',{class:'flex items-start justify-between gap-2'},
          el('div',{class:'min-w-0'},
            el('div',{class:'font-bold truncate'}, pv.name || 'Your restaurant'),
            el('div',{class:'text-xs text-slate2-400 truncate'}, (pv.barrio || 'Barrio') + ' · ' + (pv.cuisine || 'Cuisine') + ' · ' + '€'.repeat(pv.priceTier || 0))
          ),
          el('span',{class:'text-xs text-slate2-400'},'★ —')
        )
      )
    );
  }

  // ---- step renderers ----
  function StepBasics() {
    return el('div',{class:'space-y-4'},
      el('div',{class:'grid md:grid-cols-2 gap-4'},
        inputField('Restaurant name','name','e.g. Bar Brutal',{ required:true, help:'How members will see you in search.' }),
        inputField('Cuisine','cuisine','e.g. Spanish · Tapas',{ required:true, help:'Short — pick the 1–3 cuisines you\'re known for.' }),
        inputField('Barrio (neighbourhood)','barrio','e.g. El Born, Gràcia',{ required:true, help:'One of Barcelona\'s 73 barrios.' }),
        el('div',{},
          reqLabel('Price tier','priceTier'),
          el('div',{class:'mt-1 grid grid-cols-4 gap-2'},
            ...[1,2,3,4].map(n => el('button',{
              type:'button',
              class: 'rounded-xl border py-2 text-sm font-bold cursor-pointer ' + (pv.priceTier === n ? 'bg-mv-500 text-white border-mv-500' : 'bg-slate2-50/[0.04] border-slate2-50/10 text-slate2-300 hover:bg-slate2-50/[0.08]'),
              onclick:()=>{ pv.priceTier = n; errors.priceTier = null; saveStore(); paint(); }
            }, '€'.repeat(n)))
          ),
          help('1 = bargain · 4 = fine dining')
        )
      )
    );
  }
  function StepAddress() {
    return el('div',{class:'space-y-4'},
      el('div',{class:'grid md:grid-cols-2 gap-4'},
        inputField('Street address','address','C/ Mallorca, 236',{ required:true }),
        inputField('Postcode','postcode','08008',{ required:true })

        )
      ),
      el('p',{class:'mt-2 text-[10px] text-slate2-500'},'Tip: 3–4 horizontal shots of dishes and your dining room work best.')
    ));

    // ---- Status toggle (Pause / Resume) + removal request (G3) ----
    if (pv.status === 'LIVE' || pv.status === 'PAUSED') {
      const isPaused = pv.status === 'PAUSED';
      // G3: inside the 30-day commitment, PAUSE is disabled. Resume is
      // always allowed (if currently paused). The clock starts from
      // offerPublishedAt set on first LIVE approval.
      const lockUntil = (pv.offerPublishedAt || 0) + OFFER_MIN_MS;
      const inLockWindow = !isPaused && Date.now() < lockUntil;
      const daysLeft = Math.max(0, Math.ceil((lockUntil - Date.now()) / 86400000));
      const lockLiftDate = new Date(lockUntil).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      wrap.append(el('div',{class:'rounded-2xl ' + (isPaused ? 'bg-amber-500/10 border border-amber-500/30' : 'bg-slate2-50/[0.04] border border-slate2-50/10') + ' p-5 flex items-center justify-between gap-3 flex-wrap'},
        el('div',{class:'min-w-0'},
          el('div',{class:'font-bold flex items-center gap-2'},
            el('span',{class:'h-2 w-2 rounded-full ' + (isPaused ? 'bg-amber-400' : 'bg-accent-emer animate-pulse')}),
            isPaused ? 'Listing paused' : 'Listing live'
          ),
          el('p',{class:'mt-1 text-sm text-slate2-400'},
            isPaused
              ? 'Members can\'t book new codes right now. Toggle on when you\'re ready to accept again.'
              : (inLockWindow
                  ? `In your 30-day commitment window — ${daysLeft} day${daysLeft===1?'':'s'} left. You agreed to keep the offer live and bookable until ${lockLiftDate}. After that, pause is available anytime.`
                  : 'New bookings open. Going on holiday or having an off night? Pause to stop accepting new bookings until you resume.')
          )
        ),
        el('button',{
          class:'rounded-full ' + (inLockWindow ? 'bg-slate2-50/5 text-slate2-500 border border-slate2-50/10 cursor-not-allowed' : (isPaused ? 'bg-accent-emer text-ink-900 hover:bg-accent-emer/90 cursor-pointer' : 'bg-amber-500 text-ink-900 hover:bg-amber-400 cursor-pointer')) + ' px-4 py-2 text-sm font-extrabold',
          disabled: inLockWindow || undefined,
          'aria-disabled': inLockWindow ? 'true' : 'false',
          title: inLockWindow ? `Pause locked until ${lockLiftDate} (30-day commitment)` : '',
          onclick: inLockWindow ? null : (()=>{
            if (!isPaused) {
              const now = Date.now();
              const pending = store.bookings.filter(b => b.venueSlug === pv.slug && !b.redeemed && !b.cancelled && b.expiresAt > now);
              if (pending.length > 0) {
                const latest = pending.reduce((m,b) => b.expiresAt > m ? b.expiresAt : m, 0);
                const minutes = Math.max(0, Math.ceil((latest - now) / 60000));
                const summary = pending.length + ' active booking' + (pending.length === 1 ? '' : 's') + ' at ' + (pv.name || 'this venue') + ' still good for ' + minutes + ' min.';
                const cancelThem = confirm(
                  'Pause new bookings at ' + (pv.name || 'this venue') + '?\n\n' +
                  summary + '\n\n' +
                  'OK = also CANCEL the ' + pending.length + ' pending code' + (pending.length === 1 ? '' : 's') + ' (those diners won\'t be honored)\n' +
                  'Cancel = keep those codes valid, just stop new bookings'
                );
                store.partnerActions = store.partnerActions || [];
                if (cancelThem) {
                  pending.forEach(b => { b.cancelled = true; b.cancelReason = 'PARTNER_PAUSE'; });
                  store.partnerActions.unshift({ id:'pa_'+Math.random().toString(36).slice(2,10), venueSlug:pv.slug, action:'PAUSE_CANCEL_PENDING', count:pending.length, at:now });
                } else {
                  store.partnerActions.unshift({ id:'pa_'+Math.random().toString(36).slice(2,10), venueSlug:pv.slug, action:'PAUSE_KEEP_PENDING', count:pending.length, at:now });
                }
              }
            }
            pv.status = isPaused ? 'LIVE' : 'PAUSED';
            saveStore(); toast(isPaused ? 'Listing is live' : 'Listing paused'); paint();
          })
        }, inLockWindow ? '⏸ Pause locked' : (isPaused ? '▶ Resume listing' : '⏸ Pause listing'))
      ));

      // ---- G3: Request removal — replaces partner-side delete entirely.
      // Inside the 30-day window the request is flagged "earlyRemoval"; the
      // admin can still approve at their discretion, but it's recorded as
      // a breach of the commitment.
      const existingPendingRemoval = (store.changeRequests || []).find(cr =>
        cr.venueId === pv.id && cr.type === 'REMOVAL' && cr.status === 'PENDING'
      );
      wrap.append(el('div',{class:'rounded-2xl border border-slate2-50/10 bg-slate2-50/[0.02] p-5'},
        el('div',{class:'flex items-center justify-between gap-3 flex-wrap'},
          el('div',{class:'min-w-0'},
            el('div',{class:'font-bold text-sm flex items-center gap-2'},
              el('span',{class:'text-slate2-400'},'🗑️'), 'Remove this listing'
            ),
            el('p',{class:'mt-1 text-xs text-slate2-400 leading-relaxed'},
              existingPendingRemoval
                ? 'Your removal request is pending admin review. You can withdraw it below.'
                : (inLockWindow
                    ? `You\'re inside the 30-day commitment. Removal is by request only — flagged as early. Admin may still approve in exceptional circumstances.`
                    : 'After the 30-day commitment, you can request removal anytime. Admin reviews within 3 business days.')
            )
          ),
          existingPendingRemoval
            ? el('button',{class:'rounded-full bg-slate2-50/10 border border-slate2-50/15 px-4 py-2 text-xs font-extrabold cursor-pointer hover:bg-slate2-50/[0.15]', onclick:()=>{
                existingPendingRemoval.status = 'WITHDRAWN';
                existingPendingRemoval.reviewedAt = Date.now();
                saveStore(); toast('Removal request withdrawn'); paint();
              }},'Withdraw request')
            : el('button',{class:'rounded-full bg-red-500/15 text-red-300 border border-red-500/30 hover:bg-red-500/25 px-4 py-2 text-xs font-extrabold cursor-pointer', onclick:()=>{
                const earlyRemoval = inLockWindow;
                const prompt = earlyRemoval
                  ? `EARLY REMOVAL REQUEST\n\nYou\'re still inside the 30-day commitment (lifts ${lockLiftDate}, ${daysLeft} day${daysLeft===1?'':'s'} remaining).\n\nIf you submit anyway, the admin team will review your reason and may still approve — but this will be recorded as a breach of your commitment on your partner record.\n\nReason for early removal:`
                  : 'Why are you requesting removal? (e.g. closing, renovating, switching directions). The admin team reviews within 3 business days:';
                const reason = window.prompt(prompt) || '';
                if (!reason.trim()) { toast('A reason is required', 'err'); return; }
                const cr = {
                  id: 'cr_' + Math.random().toString(36).slice(2,10),
                  venueId: pv.id,
                  type: 'REMOVAL',
                  status: 'PENDING',
                  submittedAt: Date.now(),
                  submittedBy: u.id,
                  reason: reason.trim(),
                  earlyRemoval
                };
                store.changeRequests.unshift(cr);
                saveStore();
                toast(earlyRemoval ? 'Early-removal request submitted — admin will review.' : 'Removal request submitted. We\'ll respond within 3 business days.');
                paint();
              }},'Request removal')
        )
      ));
    }

    // ---- G3: REMOVED state — admin approved removal, partner kept access ----
    if (pv.status === 'REMOVED') {
      wrap.append(el('div',{class:'rounded-2xl border border-slate2-50/10 bg-slate2-50/[0.03] p-6 text-center'},
        el('div',{class:'text-2xl'},'🗑️'),
        el('h3',{class:'mt-2 font-bold'},'Your listing was removed'),
        el('p',{class:'mt-1 text-sm text-slate2-400 max-w-md mx-auto'},
          pv.removedAt
            ? 'On ' + new Date(pv.removedAt).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }) + (pv.removalReason ? ' · ' + pv.removalReason : '') + '. Your account is still active — you can request reinstatement at any time.'
            : 'Removed by Menuverso. Your account is still active.'
        ),
        el('button',{class:'mt-4 rounded-full bg-mv-500 hover:bg-mv-600 text-white px-5 py-2 text-sm font-extrabold cursor-pointer', onclick:()=>{
          pv.status = 'PENDING_APPROVAL';
          pv.submittedAt = Date.now();
          pv.removedAt = null;
          pv.removalReason = null;
          saveStore();
          toast('Reinstatement submitted — admin will review.');
          render();
        }},'Request reinstatement')
      ));
    }

    // ---- Basics ----
    wrap.append(el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-5'},
      el('h3',{class:'font-bold'},'📝 Restaurant info'),
      el('div',{class:'mt-3 grid md:grid-cols-2 gap-3'},
        field('Restaurant name','name'),
        field('Cuisine','cuisine','e.g. Spanish · Tapas'),
        field('Barrio (neighbourhood)','barrio','e.g. Eixample'),
        field('Address','address'),
        field('Postcode','postcode'),
        el('div',{},
          el('label',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'},'Price tier (1–4)'),
          el('input',{
            type:'number', min:'1', max:'4', value: String(pv.priceTier ?? 2),
            class:'mt-1 w-full bg-slate2-50/[0.04] border border-slate2-50/10 rounded-xl px-3 py-2 text-sm',
            onInput: e => { pv.priceTier = Math.max(1, Math.min(4, parseInt(e.target.value || '2', 10))); }
          })
        ),
        field('Phone','phone'),
        field('Website','website','www.example.com'),
        field('Instagram','instagram','@yourhandle'),
        field('Opening hours (free text)','hours')
      ),
      el('div',{class:'mt-3'}, textareaField('Description (members see this)','description', 4))
    ));

    // ---- Save ----
    wrap.append(el('div',{class:'flex items-center justify-between gap-3 sticky bottom-0 bg-ink-900/90 backdrop-blur p-3 rounded-xl border border-slate2-50/10'},
      el('span',{class:'text-xs text-slate2-400'},'Status: ', el('span',{class:'font-bold text-slate2-50'}, pv.status)),
      el('button',{class:'rounded-full bg-mv-500 hover:bg-mv-600 px-6 py-2 text-sm font-extrabold cursor-pointer', onclick:()=>{
        // B-3: lock the slug once the venue has been approved at least once.
        // Renaming the venue after approval would orphan every existing booking,
        // redemption, saved entry, and review that references the slug.
        if (!pv.approvedAt) {
          pv.slug = slugify(pv.name) || pv.slug;
        }
        saveStore(); toast('Profile saved'); paint();
      }},'Save changes')
    ));
  }
  paint();
  return wrap;
}
function StatPanel(icon,label,value,sub) {
  // Subtitle is neutral by default. Only colour it green when it actually

  const subClass = (sub && /^\+/.test(String(sub))) ? 'text-xs text-accent-emer' : 'text-xs text-slate2-500';

/* ========================================================================
   ADMIN
   ======================================================================== */
/* ========================================================================
   ADMIN — full power: tabs for Overview / Partners / Users / Activity /
   System with edit, delete, role change, subscription grants, force-pause,
   re-review, booking cancellation, data export/import/reset. Confirmation
   dialogs for destructive actions. Search/filter on every table.
   ======================================================================== */
function Admin() {
  const u = currentUser();
  if (!u || u.role !== 'ADMIN') { go('signin'); return el('div'); }

  const tab = state.params.tab || 'overview';
  const pendingVenues = store.partnerVenues.filter(v => v.status === 'PENDING_APPROVAL');
  const liveVenues = store.partnerVenues.filter(v => v.status === 'LIVE');
  const totalRedemptions = store.redemptions.length;
  const activeBookings = store.bookings.filter(b => !b.redeemed && !b.cancelled && b.expiresAt > Date.now()).length;

  // Helper: confirm + run destructive action (uses window.confirm for safety).
  const confirmDo = (msg, fn) => { if (window.confirm(msg)) fn(); };

  // Cascade-delete a user — remove their bookings, redemptions, saved list,
  // subscription, and (if partner) their venue. Returns count summary.
  function deleteUser(userId) {
    const user = store.users.find(x => x.id === userId);
    if (!user) return false;
    // E-1: never let the last admin be deleted. Leaving the store with no
    // admins is an unrecoverable state (no one can promote new admins).
    if (user.role === 'ADMIN') {
      const remainingAdmins = store.users.filter(x => x.role === 'ADMIN' && x.id !== userId).length;
      if (remainingAdmins === 0) {
        toast('Can\'t delete the only admin. Promote another user first.', 'err');
        return false;
      }
    }
    const venueIds = store.partnerVenues.filter(v => v.ownerId === userId).map(v => v.id);
    const venueSlugs = store.partnerVenues.filter(v => v.ownerId === userId).map(v => v.slug);
    store.partnerVenues = store.partnerVenues.filter(v => v.ownerId !== userId);
    store.bookings = store.bookings.filter(b => b.memberId !== userId && !venueSlugs.includes(b.venueSlug));
    store.redemptions = store.redemptions.filter(r => r.memberId !== userId && !venueSlugs.includes(r.venueSlug));
    if (store.reviews) store.reviews = store.reviews.filter(r => r.memberId !== userId && !venueSlugs.includes(r.venueSlug));
    delete store.saved[userId];
    delete store.subscriptions[userId];
    store.users = store.users.filter(x => x.id !== userId);
    saveStore();
    return true;
  }

  function deleteVenue(venueId) {
    const v = store.partnerVenues.find(x => x.id === venueId);
    if (!v) return;
    // B-4: Detach the venue from its owner so they can sign back in and re-list.
    // Without this, the owner's partnerVenueId points at a deleted venue and the
    // portal redirect chain locks them out (portal → onboarding → signup → "email exists").
    const owner = store.users.find(u => u.id === v.ownerId);
    if (owner) owner.partnerVenueId = null;
    store.bookings = store.bookings.filter(b => b.venueSlug !== v.slug);
    store.redemptions = store.redemptions.filter(r => r.venueSlug !== v.slug);
    if (store.reviews) store.reviews = store.reviews.filter(r => r.venueSlug !== v.slug);
    Object.keys(store.saved).forEach(uid => { store.saved[uid] = (store.saved[uid] || []).filter(s => s !== v.slug); });
    store.partnerVenues = store.partnerVenues.filter(x => x.id !== venueId);
    saveStore();
  }

  // G3: pending change requests (removal + future edit). Tab badge.
  const pendingRequests = (store.changeRequests || []).filter(cr => cr.status === 'PENDING');
  // ===== Tabs nav =====
  const tabs = [
    ['overview','📊 Overview', pendingVenues.length || 0],
    ['partners','🏪 Partners', 0],
    ['requests','🛠️ Requests', pendingRequests.length || 0],
    ['users','👤 Users', 0],
    ['activity','🎫 Activity', 0],
    ['system','⚙️ System', 0]
  ];
  const tabBar = el('div',{class:'mx-auto max-w-6xl mt-6 overflow-x-auto px-4'},
    // Horizontal scroll instead of wrap on narrow screens.
    el('div',{class:'inline-flex bg-slate2-50/[0.04] border border-slate2-50/10 rounded-full p-1 whitespace-nowrap'},
      ...tabs.map(([k,l,n]) => el('button',{
        class: 'rounded-full px-4 py-1.5 text-sm font-bold cursor-pointer bg-transparent border-0 relative shrink-0 ' + (tab===k ? 'bg-slate2-50 text-ink-900' : 'text-slate2-300 hover:text-slate2-50'),
        onclick: ()=>go('admin',{tab:k})
      }, l, n > 0 ? el('span',{class:'ml-1.5 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1.5 rounded-full bg-mv-500 text-white text-[10px] font-extrabold animate-pulse'}, String(n)) : null))
    )
  );

  // ===== Tab: Overview =====
  function AdminOverview() {
    return el('div',{class:'space-y-8'},
      el('div',{class:'grid md:grid-cols-4 gap-4'},
        StatPanel('🏪','Pending partners', pendingVenues.length, pendingVenues.length ? 'awaiting review' : 'queue empty'),
        StatPanel('✓','Live partner venues', liveVenues.length, liveVenues.length ? 'real onboarded' : 'none yet'),
        StatPanel('👤','Members', store.users.filter(x=>x.role==='MEMBER').length, 'registered'),
        StatPanel('🎫','Active bookings', activeBookings, totalRedemptions + ' redemptions total')
      ),
      pendingVenues.length > 0 && el('div',{},
        el('h2',{class:'text-xl font-extrabold'},'Approval queue'),
        el('div',{class:'mt-3 space-y-3'},
          ...pendingVenues.map(pv => {
            const owner = store.users.find(x => x.id === pv.ownerId);
            return el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-4'},
              el('div',{class:'flex items-start justify-between flex-wrap gap-3'},
                el('div',{class:'min-w-0 flex-1'},
                  el('div',{class:'font-bold text-lg'}, pv.name),
                  el('div',{class:'text-xs text-slate2-400 mt-0.5'},
                    (pv.barrio || '—'), ' · ', (pv.cuisine || '—'),
                    ' · ', '€'.repeat(pv.priceTier || 0) || '—',
                    ' · ', owner ? owner.email : 'unknown owner'
                  ),
                  el('div',{class:'text-xs text-slate2-400'}, pv.address || 'No address yet', pv.postcode ? (', ' + pv.postcode) : ''),
                  el('div',{class:'text-xs text-slate2-400 mt-1'},'Submitted ', pv.submittedAt ? new Date(pv.submittedAt).toLocaleString('en-GB') : '—'),
                  pv.description && el('p',{class:'mt-2 text-sm text-slate2-300 max-w-2xl'}, pv.description),
                  el('div',{class:'mt-2 flex gap-2 flex-wrap'},
                    ...(pv.photos || []).slice(0,4).map(src => el('img',{src, class:'h-14 w-20 object-cover rounded border border-slate2-50/10'}))
                  )
                ),
                el('div',{class:'flex gap-2 shrink-0 flex-wrap'},
                  el('button',{class:'rounded-full bg-accent-emer text-ink-900 px-4 py-1.5 text-sm font-extrabold cursor-pointer', onclick:()=>{
                    pv.status = 'LIVE'; pv.approvedAt = Date.now();
                    // Sprint G1: stamp the 30-day commitment clock on first
                    // LIVE approval. Subsequent re-approvals (after a removal
                    // + re-list cycle) reset this, which is the intended
                    // behaviour — each fresh approval restarts the 30 days.
                    pv.offerPublishedAt = Date.now();
                    if (!pv.offerVersion) pv.offerVersion = 1;
                    saveStore(); toast('Approved ' + pv.name); render();
                  }},'✓ Approve'),
                  el('button',{class:'rounded-full bg-slate2-50/10 border border-slate2-50/10 px-4 py-1.5 text-sm font-extrabold cursor-pointer', onclick:()=>{
                    const reason = window.prompt('Reason to send the partner (optional):') || 'A reviewer asked for changes. Please refine your profile and resubmit.';
                    pv.status = 'REJECTED'; pv.rejectionReason = reason; saveStore(); toast('Rejected ' + pv.name); render();
                  }},'Reject')
                )
              )
            );
          })
        )
      ),
      // Recent activity feed
      el('div',{},
        el('h2',{class:'text-xl font-extrabold'},'Recent activity'),
        (() => {
          const events = [];
          store.redemptions.slice(0, 12).forEach(r => events.push({ t: r.redeemedAt, type:'redemption', text: 'Code redeemed at ' + (findVenueBySlug(r.venueSlug)?.name ?? r.venueSlug) }));
          store.bookings.slice(0, 12).forEach(b => events.push({ t: b.createdAt, type:'booking', text: 'Booking created at ' + (findVenueBySlug(b.venueSlug)?.name ?? b.venueSlug) + ' (code ' + b.code + ')' }));
          store.partnerVenues.forEach(v => {
            if (v.submittedAt) events.push({ t: v.submittedAt, type:'submit', text: v.name + ' submitted for review' });
            if (v.approvedAt) events.push({ t: v.approvedAt, type:'approve', text: v.name + ' approved' });
          });
          events.sort((a,b) => (b.t||0) - (a.t||0));
          const recent = events.slice(0, 10);
          if (recent.length === 0) return el('p',{class:'mt-2 text-sm text-slate2-400'},'No activity yet.');
          const icons = { redemption:'✓', booking:'🎫', submit:'📝', approve:'✅' };
          return el('ul',{class:'mt-3 rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 divide-y divide-white/5'},
            ...recent.map(e => el('li',{class:'flex items-center justify-between gap-3 px-4 py-3 text-sm'},
              el('span',{class:'flex items-center gap-2'},
                el('span',{}, icons[e.type] || '·'),
                el('span',{class:'text-slate2-200'}, e.text)
              ),
              el('span',{class:'text-xs text-slate2-400 shrink-0'}, e.t ? new Date(e.t).toLocaleString('en-GB') : '')
            ))
          );
        })()
      )
    );
  }

  // ===== Tab: Requests (G3 + G2) =====
  // Pending change requests by partners. Two types right now:
  //   - REMOVAL: partner wants to take their listing down
  //   - EDIT:    partner wants to change deal terms, slots, or credit cap
  // G3 ships REMOVAL handling end-to-end. EDIT handling lands in G2.
  function AdminRequests() {
    const all = (store.changeRequests || []).slice().sort((a,b) => {
      // PENDING first, then by submittedAt descending
      if (a.status === 'PENDING' && b.status !== 'PENDING') return -1;
      if (b.status === 'PENDING' && a.status !== 'PENDING') return 1;
      return (b.submittedAt || 0) - (a.submittedAt || 0);
    });
    const pending = all.filter(r => r.status === 'PENDING');
    const removals = pending.filter(r => r.type === 'REMOVAL');
    const edits = pending.filter(r => r.type === 'EDIT');
    const history = all.filter(r => r.status !== 'PENDING').slice(0, 20);
    function venueLabel(cr) {
      const v = store.partnerVenues.find(x => x.id === cr.venueId);
      return v?.name || '(unknown venue)';
    }
    function fmtDate(ts) {
      return new Date(ts).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    }
    function approveRemovalSoft(cr) {
      const v = store.partnerVenues.find(x => x.id === cr.venueId);
      if (!v) { toast('Venue not found', 'err'); return; }
      v.status = 'REMOVED';
      v.removedAt = Date.now();
      v.removalReason = cr.reason;
      // Cancel any pending bookings at this venue.
      const now = Date.now();
      store.bookings.forEach(b => {
        if (b.venueSlug === v.slug && !b.redeemed && !b.cancelled && b.expiresAt > now) {
          b.cancelled = true;
          b.cancelReason = b.cancelReason || 'VENUE_REMOVED';
        }
      });
      cr.status = 'APPROVED';
      cr.reviewedAt = Date.now();
      cr.reviewedBy = u.id;
      saveStore();
      toast('Listing removed (soft). Partner retains portal access.');
      render();
    }
    function approveRemovalHard(cr) {
      const v = store.partnerVenues.find(x => x.id === cr.venueId);
      if (!v) { toast('Venue not found', 'err'); return; }
      if (!window.confirm(`Hard-delete ${v.name}? This wipes the venue + all its bookings, redemptions, reviews. Use ONLY for spam/banned partners. Cannot be undone.`)) return;
      cr.status = 'APPROVED';
      cr.reviewedAt = Date.now();
      cr.reviewedBy = u.id;
      cr.method = 'HARD_DELETE';
      saveStore();
      deleteVenue(v.id);
      toast('Hard-deleted ' + v.name);
      render();
    }
    function rejectRequest(cr) {
      const reason = window.prompt('Why are you rejecting this request? (Shown to the partner)') || '';
      if (!reason.trim()) { toast('A rejection reason is required', 'err'); return; }
      cr.status = 'REJECTED';
      cr.reviewedAt = Date.now();
      cr.reviewedBy = u.id;
      cr.rejectionReason = reason.trim();
      saveStore();
      toast('Request rejected — partner will see the reason.');
      render();
    }
    function approveEdit(cr) {
      const v = store.partnerVenues.find(x => x.id === cr.venueId);
      if (!v) { toast('Venue not found', 'err'); return; }
      // Apply the proposed snapshot to liveDeal — what members see.
      v.liveDeal = {
        dealTerms: cr.proposedDealTerms,
        dealSlots: JSON.parse(JSON.stringify(cr.proposedDealSlots || [])),
        creditsPerUser: cr.proposedCreditsPerUser
      };
      v.offerVersion = (v.offerVersion || 0) + 1;
      // Also sync the partner-editor copy so they don't see dirty state after.
      v.dealTerms = cr.proposedDealTerms;
      v.dealSlots = JSON.parse(JSON.stringify(cr.proposedDealSlots || []));
      v.creditsPerUser = cr.proposedCreditsPerUser;
      cr.status = 'APPROVED';
      cr.reviewedAt = Date.now();
      cr.reviewedBy = u.id;
      saveStore();
      toast('Edit approved — live for members now (v' + v.offerVersion + ').');
      render();
    }
    function dealDiff(cr) {
      const v = store.partnerVenues.find(x => x.id === cr.venueId);
      if (!v) return [];
      const live = v.liveDeal || { dealTerms: v.dealTerms, dealSlots: v.dealSlots, creditsPerUser: v.creditsPerUser };
      const out = [];
      if (live.dealTerms !== cr.proposedDealTerms) {
        out.push({ field: 'Conditions text', from: live.dealTerms, to: cr.proposedDealTerms });
      }
      if ((live.creditsPerUser ?? DEFAULT_CREDITS_PER_USER) !== (cr.proposedCreditsPerUser ?? DEFAULT_CREDITS_PER_USER)) {
        out.push({ field: 'Credits / member / month', from: live.creditsPerUser, to: cr.proposedCreditsPerUser });
      }
      const liveSlotsKey = JSON.stringify((live.dealSlots || []).map(s => ({label:s.label, time:s.timeStart+'-'+s.timeEnd, active:s.active, days:s.daysArr, seatCap:s.seatCap, terms:s.terms})));
      const propSlotsKey = JSON.stringify((cr.proposedDealSlots || []).map(s => ({label:s.label, time:s.timeStart+'-'+s.timeEnd, active:s.active, days:s.daysArr, seatCap:s.seatCap, terms:s.terms})));
      if (liveSlotsKey !== propSlotsKey) {
        const summary = `${(live.dealSlots || []).filter(s => s.active).length} active slot(s) → ${(cr.proposedDealSlots || []).filter(s => s.active).length} active slot(s)`;
        out.push({ field: 'Deal slots', from: summary, to: '(see slot list below)' });
      }
      return out;
    }
    function statusBadgeClass(s) {
      if (s === 'PENDING') return 'bg-mv-500/20 text-mv-300 border-mv-500/40';
      if (s === 'APPROVED') return 'bg-accent-emer/20 text-accent-emer border-accent-emer/40';
      if (s === 'REJECTED') return 'bg-red-500/20 text-red-300 border-red-500/40';
      if (s === 'WITHDRAWN') return 'bg-slate2-50/[0.05] text-slate2-400 border-slate2-50/10';
      return 'bg-slate2-50/[0.05] text-slate2-400 border-slate2-50/10';
    }
    return el('div',{class:'space-y-8'},
      // ----- Pending removals -----
      el('div',{},
        el('div',{class:'flex items-center justify-between flex-wrap gap-2'},
          el('h2',{class:'text-xl font-extrabold'},'Pending removals'),
          el('span',{class:'text-xs text-slate2-400'}, removals.length + ' awaiting decision')
        ),
        removals.length === 0
          ? el('p',{class:'mt-3 text-sm text-slate2-400 italic'},'No pending removal requests.')
          : el('div',{class:'mt-3 space-y-3'},
              ...removals.map(cr => el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border ' + (cr.earlyRemoval ? 'border-amber-500/40' : 'border-slate2-50/10') + ' p-4'},
                el('div',{class:'flex items-start justify-between gap-3 flex-wrap'},
                  el('div',{class:'min-w-0'},
                    el('div',{class:'font-bold'}, venueLabel(cr), cr.earlyRemoval && el('span',{class:'ml-2 text-[10px] uppercase tracking-widest font-extrabold text-amber-300 bg-amber-500/15 border border-amber-500/30 rounded-full px-2 py-0.5'},'⚠ early')),
                    el('div',{class:'mt-0.5 text-xs text-slate2-400'},'Requested ', fmtDate(cr.submittedAt)),
                    el('p',{class:'mt-2 text-sm text-slate2-300 leading-relaxed'}, el('span',{class:'font-bold text-slate2-50'},'Reason: '), cr.reason)
                  )
                ),
                el('div',{class:'mt-3 flex flex-wrap gap-2'},
                  el('button',{class:'rounded-full bg-accent-emer text-ink-900 px-4 py-1.5 text-xs font-extrabold cursor-pointer hover:bg-accent-emer/90', onclick:()=>approveRemovalSoft(cr)},'Approve removal'),
                  el('button',{class:'rounded-full bg-red-500/20 text-red-300 border border-red-500/40 px-4 py-1.5 text-xs font-extrabold cursor-pointer hover:bg-red-500/30', onclick:()=>approveRemovalHard(cr)},'Approve + hard delete'),
                  el('button',{class:'rounded-full bg-slate2-50/10 border border-slate2-50/10 px-4 py-1.5 text-xs font-bold cursor-pointer hover:bg-slate2-50/[0.15]', onclick:()=>rejectRequest(cr)},'Reject')
                )
              ))
            )
      ),
      // ----- Pending edits -----
      el('div',{},
        el('div',{class:'flex items-center justify-between flex-wrap gap-2'},
          el('h2',{class:'text-xl font-extrabold'},'Pending edits'),
          el('span',{class:'text-xs text-slate2-400'}, edits.length + ' awaiting decision')
        ),
        edits.length === 0
          ? el('p',{class:'mt-3 text-sm text-slate2-400 italic'},'No pending edit requests.')
          : el('div',{class:'mt-3 space-y-3'},
              ...edits.map(cr => {
                const v = store.partnerVenues.find(x => x.id === cr.venueId);
                const diffs = dealDiff(cr);
                const slotsDiff = diffs.find(d => d.field === 'Deal slots');
                const proposedSlots = cr.proposedDealSlots || [];
                const liveSlots = (v && v.liveDeal && v.liveDeal.dealSlots) || (v && v.dealSlots) || [];
                return el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-4 space-y-3'},
                  el('div',{class:'flex items-start justify-between gap-3 flex-wrap'},
                    el('div',{class:'min-w-0'},
                      el('div',{class:'font-bold'}, venueLabel(cr)),
                      el('div',{class:'text-xs text-slate2-400'}, 'Requested ', fmtDate(cr.submittedAt), ' · current version v', v?.offerVersion ?? '?')
                    )
                  ),
                  diffs.length === 0
                    ? el('p',{class:'text-xs text-slate2-400 italic'},'No-op change (proposed matches live). Safe to reject.')
                    : el('div',{class:'space-y-2'},
                        ...diffs.filter(d => d.field !== 'Deal slots').map(d => el('div',{class:'rounded-xl bg-slate2-50/[0.02] border border-slate2-50/10 p-3'},
                          el('div',{class:'text-[10px] uppercase tracking-widest text-mv-400 font-extrabold'}, d.field),
                          el('div',{class:'mt-1 grid sm:grid-cols-2 gap-2 text-xs'},
                            el('div',{},
                              el('div',{class:'text-slate2-500 mb-0.5'},'Currently live'),
                              el('div',{class:'rounded bg-slate2-50/[0.02] border border-slate2-50/5 p-2 text-slate2-300'}, String(d.from ?? '(empty)'))
                            ),
                            el('div',{},
                              el('div',{class:'text-mv-400 mb-0.5'},'Proposed'),
                              el('div',{class:'rounded bg-mv-500/10 border border-mv-500/30 p-2 text-white'}, String(d.to ?? '(empty)'))
                            )
                          )
                        ))
                      ),
                  // Slot detail if slots changed.
                  slotsDiff && el('div',{class:'rounded-xl bg-slate2-50/[0.02] border border-slate2-50/10 p-3'},
                    el('div',{class:'text-[10px] uppercase tracking-widest text-mv-400 font-extrabold mb-2'},'Slot changes (proposed)'),
                    el('div',{class:'grid sm:grid-cols-2 gap-3 text-xs'},
                      el('div',{},
                        el('div',{class:'text-slate2-500 mb-1'},'Currently live'),
                        ...((liveSlots.length === 0)
                          ? [el('div',{class:'text-slate2-500 italic'},'(none)')]
                          : liveSlots.map(s => el('div',{class:'rounded bg-slate2-50/[0.02] border border-slate2-50/5 p-2 mb-1 text-slate2-300'},

                              el('div',{class:'text-[10px]'}, s.timeStart, '-', s.timeEnd, ' · cap ', s.seatCap ?? 4, ' · ', (s.daysArr || []).join(','))
                            ))
                        )
                      ),
                      el('div',{},
                        el('div',{class:'text-mv-400 mb-1'},'Proposed'),
                        ...((proposedSlots.length === 0)
                          ? [el('div',{class:'text-slate2-500 italic'},'(none)')]
                          : proposedSlots.map(s => el('div',{class:'rounded bg-mv-500/10 border border-mv-500/30 p-2 mb-1 text-white'},
                              el('div',{class:'font-bold'}, s.label, ' ', s.active ? '' : el('span',{class:'text-slate2-400'},'(inactive)')),
                              el('div',{class:'text-[10px]'}, s.timeStart, '-', s.timeEnd, ' · cap ', s.seatCap ?? 4, ' · ', (s.daysArr || []).join(','))
                            ))
                        )

                  el('div',{class:'flex flex-wrap gap-2 pt-1'},
                    el('button',{class:'rounded-full bg-accent-emer text-ink-900 px-4 py-1.5 text-xs font-extrabold cursor-pointer hover:bg-accent-emer/90', onclick:()=>approveEdit(cr)},'Approve & ship live'),
                    el('button',{class:'rounded-full bg-slate2-50/10 border border-slate2-50/10 px-4 py-1.5 text-xs font-bold cursor-pointer hover:bg-slate2-50/[0.15]', onclick:()=>rejectRequest(cr)},'Reject')
                  )
                );
              })
            )
      ),
      // ----- Decision history -----
      history.length > 0 && el('div',{},
        el('h2',{class:'text-xl font-extrabold'},'Recent decisions'),
        el('div',{class:'mt-3 rounded-2xl border border-slate2-50/10 overflow-hidden'},
          ...history.map(cr => el('div',{class:'flex items-center justify-between gap-3 px-4 py-2.5 border-b border-slate2-50/5 last:border-b-0 flex-wrap'},
            el('div',{class:'flex items-center gap-3 min-w-0 flex-wrap'},
              el('span',{class:'rounded-full border px-2 py-0.5 text-[10px] uppercase tracking-widest font-extrabold ' + statusBadgeClass(cr.status)}, cr.status),
              el('span',{class:'text-sm font-bold'}, venueLabel(cr)),
              el('span',{class:'text-xs text-slate2-400'}, cr.type),
              cr.reviewedAt && el('span',{class:'text-xs text-slate2-500'}, fmtDate(cr.reviewedAt))
            ),
            cr.rejectionReason && el('span',{class:'text-xs text-slate2-400 italic max-w-md truncate'}, '"' + cr.rejectionReason + '"')
          ))
        )
      )
    );
  }

  // ===== Tab: Partners =====
  function AdminPartners() {
    let q = '';
    let statusFilter = 'all';
    const wrap = el('div',{class:'space-y-4'});
    function paintPartners() {
      wrap.innerHTML = '';
      const filtered = store.partnerVenues.filter(v => {
        if (statusFilter !== 'all' && v.status !== statusFilter) return false;
        if (!q) return true;
        const owner = store.users.find(x => x.id === v.ownerId);
        const hay = (v.name + ' ' + (v.cuisine||'') + ' ' + (v.barrio||'') + ' ' + (owner?.email||'')).toLowerCase();
        return hay.includes(q.toLowerCase());
      });
      wrap.append(
        el('div',{class:'flex items-center gap-3 flex-wrap'},
          el('div',{class:'flex-1 min-w-[200px] flex items-center gap-2 bg-slate2-50/5 rounded-full px-3 py-2 border border-slate2-50/10'},
            el('span',{class:'text-slate2-400'},'🔍'),
            el('input',{class:'bg-transparent outline-none text-sm flex-1', placeholder:'Search by name, cuisine, barrio, owner email', value:q,
              onInput: e => { q = e.target.value; paintPartners(); }})
          ),
          el('div',{class:'flex gap-1 flex-wrap'},
            ...['all','PENDING_APPROVAL','LIVE','PAUSED','REJECTED','DRAFT'].map(s =>
              el('button',{class:'rounded-full px-3 py-1.5 text-xs font-bold cursor-pointer ' + (statusFilter === s ? 'bg-slate2-50 text-ink-900' : 'bg-slate2-50/5 text-slate2-300 border border-slate2-50/10'),
                onclick:()=>{ statusFilter = s; paintPartners(); }
              }, s === 'all' ? 'All' : s)
            )
          )
        ),
        el('div',{class:'text-xs text-slate2-400'}, filtered.length + ' venue' + (filtered.length===1?'':'s')),
        ...filtered.map(pv => {
          const owner = store.users.find(x => x.id === pv.ownerId);
          const reds = store.redemptions.filter(r => r.venueSlug === pv.slug).length;
          const activeBks = store.bookings.filter(b => b.venueSlug === pv.slug && !b.redeemed && !b.cancelled && b.expiresAt > Date.now()).length;
          let statusBadge;
          if (pv.status === 'LIVE') statusBadge = 'bg-accent-emer/20 text-accent-emer border-accent-emer/40';
          else if (pv.status === 'PAUSED') statusBadge = 'bg-amber-500/20 text-amber-300 border-amber-500/40';
          else if (pv.status === 'PENDING_APPROVAL') statusBadge = 'bg-mv-500/20 text-mv-400 border-mv-500/40';
          else if (pv.status === 'REJECTED') statusBadge = 'bg-red-500/20 text-red-300 border-red-500/40';
          else statusBadge = 'bg-slate2-50/5 text-slate2-400 border-slate2-50/10';
          return el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-4'},
            el('div',{class:'flex items-start justify-between gap-3 flex-wrap'},
              el('div',{class:'flex-1 min-w-[200px]'},
                el('div',{class:'flex items-center gap-2 flex-wrap'},
                  el('div',{class:'font-bold text-lg'}, pv.name),
                  el('span',{class:'rounded-full border px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-widest ' + statusBadge}, pv.status)
                ),
                el('div',{class:'text-xs text-slate2-400 mt-1'}, (pv.barrio || '—'), ' · ', (pv.cuisine || '—'), ' · ', owner?.email ?? 'no owner'),
                el('div',{class:'text-xs text-slate2-400'}, (pv.photos||[]).length, ' photos · ', reds, ' redemptions · ', activeBks, ' active booking', activeBks===1?'':'s'),
                pv.rejectionReason && el('div',{class:'mt-1 text-xs text-red-300 italic'},'Rejection reason: ', pv.rejectionReason)
              ),
              el('div',{class:'flex gap-2 flex-wrap shrink-0'},
                pv.status === 'PENDING_APPROVAL' && el('button',{class:'rounded-full bg-accent-emer text-ink-900 px-3 py-1 text-xs font-extrabold cursor-pointer', onclick:()=>{
                  pv.status='LIVE'; pv.approvedAt=Date.now(); saveStore(); toast('Approved'); render();
                }},'✓ Approve'),
                pv.status === 'PENDING_APPROVAL' && el('button',{class:'rounded-full bg-slate2-50/10 px-3 py-1 text-xs font-bold cursor-pointer', onclick:()=>{
                  const reason = window.prompt('Reason:') || 'Requires more info.';
                  pv.status='REJECTED'; pv.rejectionReason=reason; saveStore(); toast('Rejected'); render();
                }},'Reject'),
                pv.status === 'LIVE' && el('button',{class:'rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 px-3 py-1 text-xs font-bold cursor-pointer', onclick:()=>{
                  pv.status='PAUSED'; saveStore(); toast('Paused'); render();
                }},'⏸ Pause'),
                pv.status === 'PAUSED' && el('button',{class:'rounded-full bg-accent-emer/20 text-accent-emer border border-accent-emer/40 px-3 py-1 text-xs font-bold cursor-pointer', onclick:()=>{
                  pv.status='LIVE'; saveStore(); toast('Resumed'); render();
                }},'▶ Resume'),
                (pv.status === 'LIVE' || pv.status === 'PAUSED') && el('button',{class:'rounded-full bg-mv-500/20 text-mv-400 border border-mv-500/40 px-3 py-1 text-xs font-bold cursor-pointer', onclick:()=>{
                  confirmDo('Re-review ' + pv.name + '? It will go back to PENDING and be hidden from members.', ()=>{
                    pv.status='PENDING_APPROVAL'; pv.submittedAt=Date.now(); pv.approvedAt=null; saveStore(); toast('Sent back for review'); render();
                  });
                }},'Re-review'),
                // Inline Edit — opens a small form below the venue row.
                // Saves directly to store.partnerVenues (no admin-approval
                // gate; admins bypass the partner-side change-request flow).
                el('button',{class:'rounded-full bg-slate2-50/10 border border-slate2-50/15 px-3 py-1 text-xs font-bold cursor-pointer', onclick:(ev)=>{
                  const card = ev.target.closest('.rounded-2xl');
                  const existing = card.querySelector('[data-edit-form]');
                  if (existing) { existing.remove(); return; }
                  card.appendChild(buildEditForm(pv, false));
                }},'Edit'),
                el('button',{class:'rounded-full bg-slate2-50/5 border border-slate2-50/10 px-3 py-1 text-xs font-bold cursor-pointer', onclick:()=>go('venue',{slug:pv.slug})},'View'),
                el('button',{class:'rounded-full bg-red-500/20 text-red-300 border border-red-500/40 px-3 py-1 text-xs font-bold cursor-pointer', onclick:()=>{
                  confirmDo('Permanently DELETE ' + pv.name + '? This removes the venue, all its bookings, redemptions, and reviews. Owner account is kept. This cannot be undone.', ()=>{

              )

        }),

        // ===== Catalog (seed venues) — placeholder restaurants hardcoded in
        // VENUES that appear on Discover/Map until real partners onboard.
        // Admin-editable via store.seedOverrides — changes persist in
        // localStorage and are applied at read time by getAllVenues(). =====
        el('div',{class:'mt-10 pt-6 border-t border-slate2-50/10'},
          el('div',{class:'flex items-center justify-between gap-3 flex-wrap'},
            el('div',{},
              el('div',{class:'text-xs uppercase tracking-widest text-mv-500 font-extrabold'},'Catalog · seed venues'),
              el('h3',{class:'mt-1 font-bold text-base text-slate2-50'},
                'Placeholder restaurants', el('span',{class:'text-slate2-400 font-normal'}, ' · used to populate Discover before real partners onboard')
              )
            ),
            // Reset overrides — wipes any admin edits applied on top of the
            // hardcoded seed catalog. Restores the source-of-truth names.
            Object.keys(store.seedOverrides || {}).length > 0 && el('button',{
              class:'rounded-full bg-slate2-50/5 border border-slate2-50/10 px-3 py-1.5 text-xs font-bold cursor-pointer hover:bg-slate2-50/10',
              onclick:()=>{ confirmDo('Reset all catalog overrides? This restores every seed venue to its source-of-truth values.', ()=>{
                store.seedOverrides = {}; saveStore(); toast('Catalog overrides cleared'); render();
              }); }
            }, 'Reset all overrides (' + Object.keys(store.seedOverrides).length + ')')
          ),
          el('div',{class:'mt-4 space-y-3'},
            ...VENUES.map(v => {
              const ovr = (store.seedOverrides || {})[v.slug] || {};
              const live = { ...v, ...ovr };
              const isEdited = Object.keys(ovr).length > 0;
              return el('div',{class:'rounded-2xl bg-slate2-50/[0.03] border border-slate2-50/10 p-4 relative'},
                el('div',{class:'flex items-start justify-between gap-3 flex-wrap'},
                  el('div',{class:'flex-1 min-w-[200px]'},
                    el('div',{class:'flex items-center gap-2 flex-wrap'},
                      el('div',{class:'font-bold text-base'}, live.name),

                      el('span',{class:'rounded-full bg-slate2-50/5 text-slate2-400 border border-slate2-50/10 px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-widest'}, 'Seed')
                    ),
                    el('div',{class:'text-xs text-slate2-400 mt-1'}, (live.barrio || '—'), ' · ', (live.cuisine || '—'), ' · ', '€'.repeat(Math.max(1, Math.min(4, live.priceTier ?? 2))))
                  ),
                  el('div',{class:'flex gap-2 flex-wrap shrink-0'},
                    el('button',{class:'rounded-full bg-slate2-50/10 border border-slate2-50/15 px-3 py-1 text-xs font-bold cursor-pointer', onclick:(ev)=>{
