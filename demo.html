/* safeHash — tries Web Crypto first (Chrome/Firefox file://, all HTTPS).
   Falls back to a small deterministic non-crypto hash so Safari `file://`,
   sandboxed iframes, and other "insecure context" browsers don't fail
   registration. Demo-grade only — production uses Argon2id server-side. */
const cryptoAvailable = typeof crypto !== 'undefined' && crypto.subtle && typeof crypto.subtle.digest === 'function';
function fallbackHash(s) {
  // FNV-1a 64-bit-ish in pure JS, deterministic, sufficient for distinguishing passwords in a demo.
  let h1 = 0x811c9dc5, h2 = 0x1505;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 ^= c; h1 = (h1 * 0x01000193) >>> 0;
    h2 = (((h2 << 5) + h2) ^ c) >>> 0;
  }
  return 'fb_' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}
async function safeHash(text) {
  if (!cryptoAvailable) return fallbackHash(text);
  try {
    const buf = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch {
    return fallbackHash(text);
  }
}
/* Handles seeded 'pwhash:plain' format AND both hash flavors. */
async function checkPassword(stored, plain) {
  if (stored.startsWith('pwhash:')) return stored.slice(7) === plain;
  return stored === await safeHash(plain);
}
async function hashPassword(plain) { return await safeHash(plain); }

// Client-side image compression so localStorage doesn't blow its 5MB quota.
function compressImage(file, maxDim = 1000, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function slugify(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0, 60);
}
// Day-of-week vocabulary used by Deals slot pickers.
const DAYS = [['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];
const DAY_ORDER = DAYS.map(d => d[0]);
function daysToLabel(arr) {
  if (!arr || !arr.length) return '';
  const indices = arr.map(d => DAY_ORDER.indexOf(d)).filter(i => i >= 0).sort((a,b)=>a-b);
  if (!indices.length) return '';
  const runs = [];
  let start = indices[0], prev = indices[0];
  for (let i = 1; i < indices.length; i++) {
    if (indices[i] === prev + 1) prev = indices[i];
    else { runs.push([start, prev]); start = indices[i]; prev = indices[i]; }
  }
  runs.push([start, prev]);
  return runs.map(([a,b]) => a === b ? DAYS[a][1] : DAYS[a][1] + '-' + DAYS[b][1]).join(', ');
}
// Is this venue actively serving the 2-for-1 right now?
// Partner-owned: check active dealSlots against current day/time.
// Platform-seed: simple lunch-or-dinner heuristic for the demo.
function isVenueAvailableNow(v, now = new Date()) {
  const todayKey = DAY_ORDER[(now.getDay() + 6) % 7]; // JS getDay: Sun=0, but DAY_ORDER starts Mon
  const hhmm = now.toTimeString().slice(0, 5);
  if (v._pv) {
    return (v._pv.dealSlots || []).some(s => {
      if (!s.active) return false;
      const days = Array.isArray(s.daysArr) ? s.daysArr : parseDaysString(s.days || '');
      if (!days.includes(todayKey)) return false;
      return hhmm >= (s.timeStart || '00:00') && hhmm <= (s.timeEnd || '23:59');
    });
  }
  // Heuristic for static seeded venues
  const h = now.getHours();
  const day = now.getDay(); // 0 = Sunday
  const isWeekend = day === 0 || day === 6;
  if (isWeekend) return (h >= 13 && h < 16) || (h >= 20 && h < 24);
  return (h >= 13 && h < 16) || (h >= 19 && h < 23);
}
function parseDaysString(s) {
  if (!s) return [];
  const result = new Set();
  s.split(/[,/]/).forEach(part => {
    const m = part.trim().toLowerCase().match(/^(mon|tue|wed|thu|fri|sat|sun)(?:\s*-\s*(mon|tue|wed|thu|fri|sat|sun))?$/);
    if (!m) return;
    const start = DAY_ORDER.indexOf(m[1]);
    const end = m[2] ? DAY_ORDER.indexOf(m[2]) : start;
    for (let i = start; i <= end; i++) result.add(DAY_ORDER[i]);
  });
  return Array.from(result);
}

const $ = s => document.querySelector(s);
function el(tag, attrs={}, ...children) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'ref' && typeof attrs[k] === 'function') attrs[k](e);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k]);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}
function go(route, params={}) { state.route = route; state.params = params; render(); window.scrollTo(0,0); }
function toast(msg, kind='') {
  const t = el('div',{class:`toast fixed bottom-24 left-1/2 -translate-x-1/2 z-50 rounded-full text-white px-5 py-2.5 text-sm shadow-lg border ${kind==='err'?'bg-red-600 border-red-400':'bg-ink-800 border-white/10'}`}, msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);

/* ========================================================================
   AUTH HANDLERS — real persistent users
   ======================================================================== */
async function registerUser({ firstName, email, password, role='MEMBER' }) {
  email = email.trim().toLowerCase();
  if (!isEmail(email)) throw new Error('Please enter a valid email.');
  if (password.length < 8) throw new Error('Password must be at least 8 characters.');
  if (store.users.find(u => u.email === email)) throw new Error('An account with that email already exists.');
  const u = {
    id: 'u_' + Math.random().toString(36).slice(2,12),
    email,
    passwordHash: await hashPassword(password),
    firstName: firstName?.trim() || null,
    lastName: null,
    role,
    createdAt: Date.now(),
    verifiedAt: Date.now() // demo skips email-verify
  };
  store.users.push(u);
  if (!store.saved[u.id]) store.saved[u.id] = [];
  saveStore();
  setSession(u.id);
  return u;
}
async function loginUser({ email, password }) {
  email = email.trim().toLowerCase();
  const u = store.users.find(x => x.email === email);
  if (!u) throw new Error('Email or password is wrong.');
  const ok = await checkPassword(u.passwordHash, password);
  if (!ok) throw new Error('Email or password is wrong.');
  setSession(u.id);
  return u;
}
function logout() {
  clearSession();
  go('landing');
  toast('Signed out');
}

/* AppShell — responsive browser layout.
   - Mobile (<md): top header with logo + profile, bottom nav fixed to viewport.
   - Desktop (≥md): top header with logo + horizontal nav + profile, no bottom nav.
   - Content centered, max-width depends on the screen (narrow for code/auth, wide for grids). */
function AppShell(inner, opts={}) {
  const u = currentUser();
  const showNav = u?.role === 'MEMBER' && opts.appNav !== false;
  const widthClass = opts.narrow ? 'max-w-md' : 'max-w-5xl';
  return el('div',{class:'min-h-screen bg-ink-950 text-white grain'},
    AppTopBar({ showNav }),
    el('main',{class:`mx-auto px-4 md:px-6 ${widthClass} ${showNav ? 'pb-24 md:pb-12' : 'pb-12'} pt-4 md:pt-8`}, inner),
    showNav ? BottomNav() : null,
    el('div',{class:'text-center pb-6 text-xs text-slate2-500'},
      el('button',{class:'underline hover:text-white cursor-pointer bg-transparent border-0', onclick:()=>go('landing')},'← Back to landing site')
    )
  );
}
function AppTopBar({ showNav }) {
  const u = currentUser();
  const r = state.route;
  const navItem = (key, icon, label, route) =>
    el('button',{
      class: 'hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full text-sm font-bold transition cursor-pointer bg-transparent border-0 ' +
        (key === r ? 'bg-white/10 text-white' : 'text-slate2-300 hover:text-white hover:bg-white/5'),
      onclick: () => go(route)
    }, el('span',{}, icon), el('span',{}, label));
  return el('header',{class:'sticky top-0 z-30 bg-ink-950/90 backdrop-blur border-b border-white/5'},
    el('div',{class:'mx-auto max-w-6xl px-4 md:px-6 py-3 flex items-center justify-between gap-4'},
      el('a',{class:'flex items-center gap-2 cursor-pointer shrink-0', onclick:()=>go(u ? (u.role==='ADMIN'?'admin':u.role==='PARTNER_OWNER'?'partner-portal':'app') : 'landing')},
        el('span',{class:'text-xl text-mv-500'},'🍽️'),
        el('span',{class:'font-bold tracking-tight text-mv-500 text-lg'},'Menuverso')
      ),
      showNav ? el('nav',{class:'flex items-center gap-1'},
        navItem('app','🏠','Discover','app'),
        navItem('map','🗺️','Map','map'),
        navItem('saved', (u && (store.saved[u.id] || []).length > 0) ? '❤️' : '🤍', 'Saved' + ((u && (store.saved[u.id] || []).length > 0) ? ` (${(store.saved[u.id] || []).length})` : ''), 'saved')
      ) : el('span',{}),
      u ? el('button',{class:'flex items-center gap-2 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 px-3 py-1.5 text-sm font-bold cursor-pointer', onclick:()=>{
        if (u.role==='MEMBER') go('profile');
        else if (u.role==='ADMIN') go('admin');
        else go('partner-portal');
      }},
        el('span',{class:'h-6 w-6 rounded-full bg-mv-500 grid place-items-center text-xs font-extrabold'}, (u.firstName?.[0] ?? u.email[0]).toUpperCase()),
        el('span',{class:'hidden md:inline'}, u.firstName ?? u.email.split('@')[0])
      ) : el('div',{class:'flex items-center gap-3 md:gap-4'},
        el('button',{class:'hidden md:inline text-sm text-slate2-300 hover:text-white cursor-pointer bg-transparent border-0', onclick:()=>{
          if (state.route !== 'landing') {
            go('landing');
            setTimeout(()=>document.getElementById('how')?.scrollIntoView({behavior:'smooth'}), 120);
          } else {
            document.getElementById('how')?.scrollIntoView({behavior:'smooth'});
          }
        }}, 'How it works'),
        el('button',{class:'hidden md:inline text-sm text-slate2-300 hover:text-white cursor-pointer bg-transparent border-0', onclick:()=>go('partner-landing')}, 'For Restaurants'),
        el('button',{class:'text-sm text-slate2-300 hover:text-white cursor-pointer bg-transparent border-0', onclick:()=>go('signin')},'Sign in'),
        el('button',{class:'rounded-full bg-mv-500 hover:bg-mv-600 text-white font-bold px-4 py-1.5 text-sm cursor-pointer shadow-lg shadow-mv-500/20', onclick:()=>go('signup')},'Join')
      )
    )
  );
}
function BottomNav() {
  const r = state.route;
  const u = currentUser();
  const savedCount = u ? (store.saved[u.id] || []).length : 0;
  const item = (key, icon, label, route, badge) =>
    el('button',{
      class: 'flex-1 flex flex-col items-center gap-0.5 py-2 cursor-pointer bg-transparent border-0 relative ' + (key===r ? 'text-white' : 'text-slate2-400 hover:text-slate2-200'),
      onclick: ()=>go(route)
    },
      el('span',{class:'text-xl relative'}, icon,
        badge ? el('span',{class:'absolute -top-1 -right-2 bg-mv-500 text-white text-[9px] font-extrabold rounded-full px-1.5 py-0.5 leading-tight'}, String(badge)) : null
      ),
      el('span',{class:'text-[10px] font-bold uppercase tracking-wider'}, label)
    );
  return el('div',{class:'md:hidden fixed bottom-0 inset-x-0 z-30 bg-ink-900/95 border-t border-white/10 backdrop-blur flex'},
    item('app','🏠','Discover','app'),
    item('map','🗺️','Map','map'),
    item('saved','❤️','Saved','saved', savedCount || null),
    item('profile','👤','Profile','profile')
  );
}

function Signup() {
  const inner = el('div',{class:'p-6'},
    el('div',{class:'flex items-center justify-between'},
      el('button',{class:'text-slate2-400 text-sm cursor-pointer bg-transparent border-0', onclick:()=>go('landing')},'← Back'),
      el('button',{class:'text-slate2-400 text-sm cursor-pointer bg-transparent border-0', onclick:()=>go('signin')},'Sign in')
    ),
    el('div',{class:'text-center mt-4'},
      el('div',{class:'text-5xl'},'🍽️'),
      el('h1',{class:'mt-3 text-2xl font-extrabold'},'Create your account'),
      el('p',{class:'text-slate2-400 text-sm mt-1'},'Then unlock 2-for-1 at 1,178+ restaurants')
    ),
    el('form',{class:'mt-6 space-y-3', onSubmit: async (e)=>{
      e.preventDefault();
      const btn = e.target.querySelector('button[type=submit]');
      const fd = new FormData(e.target);
      const pw = String(fd.get('password') || '');
      const confirm = String(fd.get('confirmPassword') || '');
      if (pw !== confirm) { toast('Passwords don\'t match.', 'err'); return; }
      if (pw.length < 8) { toast('Password must be at least 8 characters.', 'err'); return; }
      btn.disabled = true; btn.textContent = 'Creating account…';
      try {
        await registerUser({
          firstName: fd.get('firstName'),
          email: fd.get('email'),
          password: pw
        });
        toast('Account created');
        go('checkout');
      } catch (err) {
        toast(err.message, 'err');
        btn.disabled = false; btn.textContent = 'Create account';
      }
    }},
      InputField('First name','text','firstName','Maria', false),
      InputField('Email','email','email','you@example.com', true, 'email'),
      PasswordField('Password','password','At least 8 characters', { helpText:'Tip: tap Show to verify you typed it correctly.' }),
      PasswordField('Confirm password','confirmPassword','Re-type to confirm'),
      el('button',{type:'submit', class:'mt-3 w-full rounded-2xl bg-mv-500 hover:bg-mv-600 text-white py-3.5 font-extrabold cursor-pointer disabled:opacity-50'},'Create account')
    ),
    el('div',{class:'mt-4 text-[10px] text-center text-slate2-500'},'By signing up you agree to the Terms & Privacy.')
  );
  return AppShell(inner, { narrow: true });
}
function InputField(label, type, name, placeholder, required=true, autocomplete='', extra='') {
  const wrap = el('div',{});
  wrap.appendChild(el('label',{class:'block text-xs uppercase tracking-widest text-slate2-400 font-bold mb-1'}, label));
  const inp = el('input',{
    type, name, placeholder,
    class:'w-full bg-white/[0.04] border border-white/10 rounded-xl px-4 py-3 text-white placeholder:text-slate2-500 outline-none focus:border-mv-500 focus:bg-white/[0.07]'
  });
  if (required) inp.required = true;
  if (autocomplete) inp.autocomplete = autocomplete;
  if (extra) {
    const m = extra.matchAll(/(\w+)="([^"]*)"/g);
    for (const x of m) inp.setAttribute(x[1], x[2]);
  }
  wrap.appendChild(inp);
  return wrap;
}
/* PasswordField — password input with a built-in show/hide toggle.
   Optional minlength enforced via the HTML attribute. */
function PasswordField(label, name, placeholder, { required=true, autocomplete='new-password', minlength=8, helpText } = {}) {
  const wrap = el('div',{});
  wrap.appendChild(el('label',{class:'block text-xs uppercase tracking-widest text-slate2-400 font-bold mb-1'}, label));
  const container = el('div',{class:'relative'});
  const inp = el('input',{
    type:'password', name, placeholder, autocomplete,
    class:'w-full bg-white/[0.04] border border-white/10 rounded-xl pl-4 pr-14 py-3 text-white placeholder:text-slate2-500 outline-none focus:border-mv-500 focus:bg-white/[0.07]'
  });
  if (required) inp.required = true;
  if (minlength) inp.setAttribute('minlength', String(minlength));
  let shown = false;
  const toggle = el('button',{
    type:'button',
    class:'absolute inset-y-0 right-2 my-auto h-7 px-2 rounded-md text-xs font-bold text-slate2-400 hover:text-white hover:bg-white/[0.06] cursor-pointer bg-transparent border-0',
    onclick: () => { shown = !shown; inp.type = shown ? 'text' : 'password'; toggle.textContent = shown ? 'Hide' : 'Show'; }
  }, 'Show');
  container.appendChild(inp);
  container.appendChild(toggle);
  wrap.appendChild(container);
  if (helpText) wrap.appendChild(el('div',{class:'mt-1 text-[10px] text-slate2-500'}, helpText));
  return wrap;
}

function AppDiscover() {
  const u = currentUser();
  if (!u) { go('signin'); return el('div'); }
  if (u.role !== 'MEMBER') {
    if (u.role==='ADMIN') return Admin();
    if (u.role==='PARTNER_OWNER') return PartnerPortal();
  }
  // Local state for live filtering — kept in the closure so typing doesn't trigger render() (which would steal focus).
  let q = '';
  let filter = 'all'; // all | now | tapas | catalan | asian | brunch | vegan
  const FILTERS = [
    ['all','All'],
    ['now','Available now'],
    ['tapas','Tapas'],
    ['catalan','Catalan'],
    ['asian','Asian'],
    ['brunch','Brunch']
  ];

  function matches(v) {
    // Skip paused venues
    if (v._pv && v._pv.status === 'PAUSED') return false;
    if (q) {
      const hay = (v.name + ' ' + v.cuisine + ' ' + v.barrio).toLowerCase();
      if (!hay.includes(q.toLowerCase())) return false;
    }
    if (filter === 'all') return true;
    if (filter === 'now') return isVenueAvailableNow(v);
    return v.cuisine.toLowerCase().includes(filter);
  }

  const inner = el('div',{class:'pb-24'});
  const header = el('div',{class:'p-5 pb-3 border-b border-white/5'},
    el('div',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'},'Barcelona'),
    el('h1',{class:'text-2xl font-extrabold'},'Menuverso Deals'),
    el('div',{class:'mt-3 flex items-center gap-2'},
      el('div',{class:'flex-1 flex items-center gap-2 bg-white/5 rounded-full px-3 py-2 border border-white/10 focus-within:border-mv-500'},
        el('span',{class:'text-slate2-400'},'🔍'),
        el('input',{
          class:'bg-transparent outline-none text-sm flex-1 text-white placeholder:text-slate2-500',
          placeholder:'Search restaurants, cuisines, barrios',
          value:q,
          onInput: e => { q = e.target.value; paintGrid(); }
        }),
        q && el('button',{class:'text-slate2-400 hover:text-white text-sm bg-transparent border-0 cursor-pointer', onclick:e => { q=''; e.currentTarget.previousElementSibling.value=''; paintGrid(); }},'✕')
      ),
      el('button',{class:'md:hidden h-9 w-9 rounded-full bg-white/5 border border-white/10 grid place-items-center cursor-pointer', onclick:()=>go('map')},'🗺️')
    )
  );

  // Filter chips row
  const chips = el('div',{class:'px-5 pt-4 flex gap-2 overflow-x-auto'});
  function paintChips() {
    chips.innerHTML = '';
    FILTERS.forEach(([k, label]) => {
      chips.appendChild(el('button',{
        class:'shrink-0 rounded-full px-3 py-1.5 text-xs font-bold cursor-pointer transition ' + (filter === k ? 'bg-white text-ink-900' : 'bg-white/5 text-slate2-300 border border-white/10 hover:bg-white/[0.1]'),
        onclick:()=>{ filter = k; paintChips(); paintGrid(); }
      }, label));
    });
  }

  // Results count + grid
  const summary = el('div',{class:'text-sm text-slate2-400 flex items-center justify-between mt-4'});
  const grid = el('div',{class:'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4'});
  function paintGrid() {
    const list = getAllVenues().filter(matches);
    summary.innerHTML = '';
    summary.append(
      el('span',{}, '📍 ', el('span',{class:'text-white font-bold'}, list.length + ' deal' + (list.length===1?'':'s')),
        q || filter !== 'all' ? ' match your search' : ' in Barcelona'
      ),
      hasSub() ? el('span',{class:'text-accent-emer text-xs font-bold'}, '✓ ACTIVE') : el('button',{class:'text-mv-500 text-xs font-bold underline cursor-pointer bg-transparent border-0', onclick:()=>go('checkout')},'SUBSCRIBE')
    );
    grid.innerHTML = '';
    if (list.length === 0) {
      grid.appendChild(el('div',{class:'col-span-full text-center py-12 text-slate2-400'},
        el('div',{class:'text-5xl'},'🤔'),
        el('p',{class:'mt-3 text-sm'},'No matches. Try a different search or filter.'),
        el('button',{class:'mt-4 text-sm text-mv-500 underline cursor-pointer bg-transparent border-0', onclick:()=>{ q=''; filter='all'; paintChips(); paintGrid(); render(); }},'Clear filters')
      ));
    } else {
      list.forEach(v => grid.appendChild(DealCard(v)));
    }
  }

  inner.append(header, chips, el('div',{class:'px-5'}, summary, grid));
  paintChips(); paintGrid();
  return AppShell(inner);
}

function AppMap() {
  const u = currentUser(); if (!u) { go('signin'); return el('div'); }
  const venues = getAllVenues().filter(v => typeof v.lat === 'number' && typeof v.lng === 'number');
  const mapId = 'mv-map-' + Math.random().toString(36).slice(2,8);
  const mapEl = el('div',{id:mapId, class:'w-full h-[65vh] min-h-[460px] rounded-2xl overflow-hidden border border-white/10'});
  const inner = el('div',{class:'pb-24'},

    )
  );
  // Init Leaflet after the element is mounted; script tag uses defer so we poll for window.L.
  function initMap() {
    if (!window.L) { setTimeout(initMap, 60); return; }

    const map = window.L.map(mapId, { zoomControl: true, attributionControl: false })
      .setView([41.3851, 2.1734], 13);
    window.L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    venues.forEach(v => {
      const isLive = isVenueAvailableNow(v);
      const icon = window.L.divIcon({
        className: 'mv-pin',
        html: '<div style="position:relative">'
            + '<div style="background:#F43F5E;color:white;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:9999px;box-shadow:0 4px 12px rgba(0,0,0,.4);white-space:nowrap;">2×1' + (isLive ? ' • NOW' : '') + '</div>'

            + '</div>',
        iconSize: [60, 26], iconAnchor: [30, 26]
      });
      window.L.marker([v.lat, v.lng], { icon })
        .addTo(map)
        .bindPopup('<div style="min-width:180px"><div style="font-weight:800;color:#0F172A">' + v.name
          + '</div><div style="font-size:11px;color:#64748B;margin-top:2px">' + v.barrio + ' · ' + v.cuisine

    });
    map.on('popupopen', e => {
      const link = e.popup.getElement().querySelector('.mv-popup-link');
      if (link) link.onclick = () => go('venue', { slug: link.dataset.slug });
    });
  }
  setTimeout(initMap, 0);
  return AppShell(inner);
}

function bookSlot(v, slot) {
  const u = currentUser();
  if (!u) { go('signin'); return; }
  if (u.role !== 'MEMBER') {
    toast(u.role === 'PARTNER_OWNER' ? 'Partner accounts can\'t book deals — sign in as a member.' : 'Admin accounts can\'t book deals.', 'err');
    return;
  }
  if (!hasSub()) { go('checkout'); return; }
  // Block paused venues
  if (v._pv && v._pv.status === 'PAUSED') { toast('This venue paused new bookings — try again later.', 'err'); return; }
  // Cancel any prior active booking at this venue
  store.bookings.forEach(b => { if (b.memberId === u.id && b.venueSlug === v.slug && !b.redeemed) b.cancelled = true; });
  const booking = {
    id: 'b_' + Math.random().toString(36).slice(2,10),
    memberId: u.id,
    venueSlug: v.slug,
    code: code6(),
    slot,
    createdAt: Date.now(),
    expiresAt: Date.now() + 60*60*1000,
    redeemed: false,
    cancelled: false
  };
  store.bookings.unshift(booking);
  saveStore();
  go('booking',{id:booking.id});
}

function Booking() {
  const u = currentUser();
  const b = store.bookings.find(x => x.id === state.params.id);
  if (!u || !b || b.memberId !== u.id) { go('app'); return el('div'); }
  const v = findVenueBySlug(b.venueSlug);
  const inner = el('div',{class:'pb-8'});

  function paint() {
    inner.innerHTML = '';
    if (b.redeemed) {
      const existingReview = (store.reviews || []).find(r => r.memberId === u.id && r.venueSlug === b.venueSlug);
      const rated = !!existingReview;
      inner.append(el('div',{class:'p-6 text-center'},
        el('div',{class:'pop mx-auto h-24 w-24 rounded-full bg-accent-emer/15 grid place-items-center text-5xl border-4 border-accent-emer'},'✓'),
        el('h1',{class:'mt-5 text-2xl font-extrabold'},'Redeemed'),
        el('p',{class:'mt-1 text-slate2-300'}, v?.name),
        el('p',{class:'mt-1 text-xs text-slate2-500'}, new Date(b.redeemedAt).toLocaleString('en-GB')),
        el('p',{class:'mt-6 text-sm text-slate2-300'},'Enjoy your meal.'),
        // ---- Rate-your-visit ----
        el('div',{class:'mt-8 rounded-2xl bg-white/[0.04] border border-white/10 p-5 text-left max-w-md mx-auto'},
          rated
            ? el('div',{class:'text-center'},
                el('div',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'},'Your rating'),
                el('div',{class:'mt-2 text-accent-amber text-2xl'}, '★'.repeat(existingReview.stars) + '☆'.repeat(5 - existingReview.stars)),
                existingReview.note && el('p',{class:'mt-2 text-sm text-slate2-300 italic'}, '"' + existingReview.note + '"')
              )
            : (() => {
                const wrap2 = el('div',{class:'text-center'});
                let stars = 0; let note = '';
                function paintRater() {
                  wrap2.innerHTML = '';
                  wrap2.append(
                    el('div',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'},'How was it?'),
                    el('div',{class:'mt-3 flex justify-center gap-1'},
                      ...[1,2,3,4,5].map(n => el('button',{
                        class:'text-3xl cursor-pointer bg-transparent border-0 transition ' + (n <= stars ? 'text-accent-amber' : 'text-slate2-500 hover:text-accent-amber/60'),
                        onclick:()=>{ stars = n; paintRater(); }
                      }, '★'))
                    ),
                    stars > 0 && el('textarea',{
                      class:'mt-3 w-full bg-white/[0.04] border border-white/10 rounded-xl px-3 py-2 text-sm', rows:'2', placeholder:'Quick note (optional)',
                      onInput: e => { note = e.target.value; }
                    }),
                    stars > 0 && el('button',{
                      class:'mt-3 w-full rounded-full bg-mv-500 hover:bg-mv-600 text-white py-2.5 text-sm font-extrabold cursor-pointer',
                      onclick: ()=>{
                        if (!store.reviews) store.reviews = [];
                        store.reviews.push({ memberId: u.id, venueSlug: b.venueSlug, stars, note: note.trim() || null, createdAt: Date.now() });
                        saveStore(); toast('Thanks for the rating'); paint();
                      }
                    },'Submit rating')
                  );
                }
                paintRater();
                return wrap2;
              })()
        ),
        el('button',{class:'mt-8 rounded-full bg-white text-ink-900 px-5 py-2.5 font-bold text-sm cursor-pointer', onclick:()=>go('profile')},'Back to profile')
      ));
      return;
    }
    const now = Date.now();
    const msLeft = Math.max(0, b.expiresAt - now);
    if (msLeft <= 0 && !b.expired) { b.expired = true; saveStore(); }
    const m = Math.floor(msLeft / 60000), s = Math.floor((msLeft / 1000) % 60);
    inner.append(
      el('div',{class:'p-5'},
        el('button',{class:'text-slate2-400 text-sm cursor-pointer bg-transparent border-0', onclick:()=>go('venue',{slug:b.venueSlug})},'← Back'),
        el('div',{class:'text-xs uppercase tracking-widest text-mv-500 font-bold mt-3 text-center'},'Show this code'),
        el('h1',{class:'mt-1 text-2xl font-extrabold text-center'}, v?.name ?? '?'),
        el('div',{class:'mt-1 text-sm text-slate2-400 text-center'}, b.slot),
        el('div',{class:'pop mt-6 mx-auto rounded-3xl border-2 border-dashed border-mv-500/50 bg-mv-500/5 px-8 py-6 inline-block'},
          el('div',{class:'digit text-6xl font-extrabold tracking-[0.18em] bg-gradient-to-r from-white to-slate2-300 bg-clip-text text-transparent'}, b.code)
        ),
        el('p',{class:'mt-5 text-xs text-slate2-400 max-w-[280px] mx-auto text-center'},'Hand the phone to your server. Either tap the button below, or the server can enter the code in the partner portal — both work.'),
        el('div',{class:'mt-6 text-center'},
          el('div',{class:'text-xs text-slate2-500 uppercase tracking-widest font-bold'},'Valid for'),
          el('div',{class:`mt-1 font-mono text-2xl font-bold tabular-nums ${msLeft<5*60000?'text-red-400':''}`},
            `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
          )
        ),
        msLeft > 0
          ? el('button',{class:'mt-6 w-full rounded-2xl bg-mv-500 hover:bg-mv-600 text-white py-3.5 font-extrabold cursor-pointer transition', onclick:()=>{
              b.redeemed = true; b.redeemedAt = Date.now();
              store.redemptions.unshift({ memberId: u.id, venueSlug: b.venueSlug, redeemedAt: Date.now() });
              saveStore(); paint();
            }},'Server: Confirm 2×1 →')
          : el('div',{class:'mt-6 text-center text-sm text-red-400'},'Code expired. Book again.'),
        // Cancel-booking link — releases the slot so the diner isn't locked in.
        msLeft > 0 && el('div',{class:'mt-4 text-center'},
          el('button',{class:'text-xs text-slate2-400 hover:text-slate2-200 underline cursor-pointer bg-transparent border-0', onclick:()=>{
            if (confirm('Cancel this booking? The slot will be released and the code invalidated.')) {
              b.cancelled = true; saveStore(); toast('Booking cancelled'); go('profile');
            }
          }},'Cancel this booking')
        )
      )
    );
  }
  paint();
  // Tick the countdown every second; fire a one-time 5-minute warning toast.
  let warnedAt5 = false;
  const t = setInterval(() => {
    if (!document.body.contains(inner)) { clearInterval(t); return; }
    if (b.redeemed || b.cancelled) return;
    const left = b.expiresAt - Date.now();
    if (!warnedAt5 && left > 0 && left < 5 * 60 * 1000) { toast('Heads up: 5 minutes left on your code', 'err'); warnedAt5 = true; }
    paint();
  }, 1000);
  return AppShell(inner, { narrow: true });
}

        e.preventDefault();

        const pw = String(fd.get('password') || '');

        if (pw.length < 8) { toast('Password must be at least 8 characters.', 'err'); return; }
        btn.disabled = true; btn.textContent = 'Creating…';
        try {
          const email = String(fd.get('email')||'').trim().toLowerCase();
          if (!isEmail(email)) throw new Error('Enter a valid email.');
          if (store.users.find(u => u.email === email)) throw new Error('That email already has an account.');
          const restaurantName = String(fd.get('restaurantName')||'').trim() || 'My restaurant';
          // Build a unique slug.
          let slug = slugify(restaurantName) || 'restaurant-' + Math.random().toString(36).slice(2,6);
          while (store.partnerVenues.some(v => v.slug === slug) || VENUES.some(v => v.slug === slug)) {
            slug = slug + '-' + Math.random().toString(36).slice(2,4);
          }
          const venueId = 'pv_' + Math.random().toString(36).slice(2,10);
          const userId = 'u_' + Math.random().toString(36).slice(2,12);
          const newVenue = {
            id: venueId, ownerId: userId, name: restaurantName, slug,
            barrio: '', cuisine: '', priceTier: 2, address: '', postcode: '',
            phone: '', website: '', instagram: '',
            description: '', hours: '',
            photos: [], dealTerms: DEFAULT_DEAL_TERMS, dealSlots: DEFAULT_SLOTS(),
            rating: null, reviews: 0, status: 'DRAFT', submittedAt: null, approvedAt: null
          };
          const newUser = {
            id: userId, email,

            firstName: String(fd.get('firstName')||'').trim() || null,
            lastName: null, role: 'PARTNER_OWNER',
            partnerVenueId: venueId,
            createdAt: Date.now(), verifiedAt: Date.now()

          store.users.push(newUser);
          store.partnerVenues.push(newVenue);

/* Partner onboarding — 4-step wizard with progress, inline validation, live preview. */
function PartnerOnboarding() {
  const u = currentUser();
  if (!u || u.role !== 'PARTNER_OWNER') { go('partner-signup'); return el('div'); }
  const pv = currentPartnerVenue();
  if (!pv) { go('partner-signup'); return el('div'); }

  // Resume where they left off (persisted as state.params.step for back-button friendliness).
  let step = Math.max(1, Math.min(4, parseInt(state.params.step || '1', 10)));
  let errors = {}; // { fieldKey: msg }
  const wrap = el('div',{class:'min-h-screen bg-ink-950 text-white'});

  // ---- helpers ----
  function setStep(n) { step = Math.max(1, Math.min(4, n)); errors = {}; paint(); }
  function reqLabel(label, key) {
    return el('label',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold flex items-center gap-1'},
      label, el('span',{class:'text-mv-500'},'*'),
      errors[key] && el('span',{class:'normal-case text-red-400 text-xs ml-2'}, errors[key])
    );
  }
  function optLabel(label) {
    return el('label',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'}, label);
  }
  function help(s) { return el('div',{class:'mt-1 text-[10px] text-slate2-500'}, s); }
  function inputField(label, key, ph='', { required=false, type='text', help: helpText, attrs={} } = {}) {
    return el('div',{},
      required ? reqLabel(label, key) : optLabel(label),
      el('input',{
        type, value: pv[key] ?? '', placeholder: ph,
        ...attrs,
        class: 'mt-1 w-full bg-white/[0.04] border rounded-xl px-3 py-2 text-sm outline-none ' + (errors[key] ? 'border-red-500/60 focus:border-red-500' : 'border-white/10 focus:border-mv-500'),
        onInput: e => { pv[key] = e.target.value; if (errors[key]) { errors[key] = null; paint(); } }
      }),
      helpText && help(helpText)
    );
  }
  function textareaField(label, key, rows=3, { required=false, maxLen, help: helpText } = {}) {
    const count = (pv[key] ?? '').length;
    return el('div',{},
      el('div',{class:'flex items-center justify-between'},
        required ? reqLabel(label, key) : optLabel(label),
        maxLen ? el('span',{class:'text-[10px] text-slate2-500'}, `${count}/${maxLen}`) : null
      ),

function PortalRedeem() {
  const wrap = el('div',{class:'max-w-md mx-auto'});
  let digits = ['','','','','',''];
  const pv = currentPartnerVenue();
  if (!pv || pv.status !== 'LIVE') {
    return el('div',{class:'rounded-2xl bg-white/[0.04] border border-white/10 p-6 text-center'},
      el('div',{class:'text-4xl'},'⏳'),
      el('h2',{class:'mt-3 text-xl font-bold'},'Redemption unavailable'),
      el('p',{class:'mt-2 text-sm text-slate2-400'},'Your venue isn\'t live yet, so there are no member codes to redeem.')
    );
  }
  const venueSlug = pv.slug;
  const venueName = pv.name;
  function paint() {
    wrap.innerHTML = '';
    wrap.append(
      el('h2',{class:'font-bold text-xl text-center'},'Enter the 6-digit code'),
      el('p',{class:'mt-1 text-sm text-slate2-400 text-center'},'On the diner\'s phone screen · ', el('span',{class:'text-white font-bold'}, venueName)),
      el('div',{class:'mt-6 grid grid-cols-6 gap-2'},
        ...digits.map((d,i) =>
          el('input',{
            id:`d${i}`, type:'text', inputMode:'numeric', maxlength:'1', value:d,
            class:'aspect-square text-center text-3xl font-mono font-bold bg-white/[0.04] border-2 border-white/10 rounded-md text-white focus:border-mv-500 outline-none',
            onInput: e => {
              const v = e.target.value.replace(/\D/g,'').slice(-1);
              e.target.value = v; digits[i] = v;
              if (v && i < 5) document.getElementById(`d${i+1}`)?.focus();
              if (digits.every(x=>x)) attempt();
            },
            onKeydown: e => { if (e.key==='Backspace' && !digits[i] && i>0) document.getElementById(`d${i-1}`)?.focus(); }
          })
        )
      ),
      el('button',{class:'mt-5 w-full rounded-md bg-mv-500 hover:bg-mv-600 text-white py-3 font-extrabold cursor-pointer', onclick: attempt},'Confirm 2-for-1'),
      el('p',{class:'mt-3 text-xs text-slate2-500 text-center'},'Codes expire 60 minutes after the diner books.')
    );
    setTimeout(()=>document.getElementById('d0')?.focus(), 0);
  }
  async function attempt() {
    const code = digits.join('');
    if (code.length !== 6) return;
    // Look for the code at THIS venue first.
    const b = store.bookings.find(x => x.venueSlug === venueSlug && x.code === code && !x.redeemed && !x.cancelled);
    if (!b) {
      // Helpful hint: is the code valid but for a different venue?
      const wrongVenue = store.bookings.find(x => x.code === code && !x.redeemed && !x.cancelled);
      if (wrongVenue) {
        const v = findVenueBySlug(wrongVenue.venueSlug);
        toast(`That code is for ${v?.name ?? 'another venue'}, not ${venueName}.`, 'err');
      } else {
        toast('No active booking with that code', 'err');
      }
      digits = ['','','','','','']; paint(); return;
    }
    if (b.expiresAt <= Date.now()) { toast('That code expired', 'err'); digits = ['','','','','','']; paint(); return; }
    b.redeemed = true; b.redeemedAt = Date.now();
    store.redemptions.unshift({ memberId: b.memberId, venueSlug: b.venueSlug, redeemedAt: Date.now(), method: 'PARTNER_CODE' });
    saveStore();
    const member = store.users.find(u => u.id === b.memberId);
    wrap.innerHTML = '';
    wrap.append(el('div',{class:'text-center'},
      el('div',{class:'pop mx-auto h-24 w-24 rounded-full bg-accent-emer/15 grid place-items-center text-5xl border-4 border-accent-emer'},'✓'),
      el('h2',{class:'mt-4 text-2xl font-extrabold'},'2-for-1 confirmed'),
      el('p',{class:'mt-1 text-sm text-slate2-400'}, member?.firstName ?? member?.email, ' · ', new Date().toLocaleString('en-GB')),
      el('button',{class:'mt-8 rounded-md bg-mv-500 hover:bg-mv-600 px-5 py-2.5 text-sm font-extrabold cursor-pointer', onclick:()=>{ digits = ['','','','','','']; paint(); }},'Redeem another')
    ));
  }
  paint();
  return el('div',{},
    el('div',{class:'rounded-2xl bg-white/[0.04] border border-white/10 p-6'}, wrap)
  );
}

        el('div',{class:'mt-4 space-y-3'},
          ...((pv.dealSlots||[]).map((s, i) => {
            // Normalize legacy 'days' string to daysArr on first render
            if (!Array.isArray(s.daysArr)) s.daysArr = parseDaysString(s.days || '');
            return el('div',{class:'rounded-xl bg-white/[0.04] border border-white/10 p-3'},
              el('div',{class:'flex items-center gap-2'},
                el('input',{value:s.label, class:'flex-1 bg-transparent border border-white/10 rounded px-2 py-1 text-sm font-bold', onInput: e => { s.label = e.target.value; }, onBlur: ()=>{ saveStore(); }}),
                el('div',{class:`h-6 w-11 rounded-full cursor-pointer transition ${s.active?'bg-accent-emer':'bg-white/10'} relative shrink-0`,
                  onclick:()=>{ s.active = !s.active; saveStore(); paint(); }
                },
                  el('div',{class:`absolute top-0.5 ${s.active?'right-0.5':'left-0.5'} h-5 w-5 rounded-full bg-white transition`})
                ),
                el('button',{class:'text-xs text-red-300 underline cursor-pointer bg-transparent border-0 shrink-0', onclick:()=>{
                  pv.dealSlots = pv.dealSlots.filter(x => x.id !== s.id); saveStore(); paint();
                }},'Remove')
              ),
              // Day-of-week checkboxes
              el('div',{class:'mt-3'},
                el('div',{class:'text-[10px] uppercase tracking-widest text-slate2-400 font-bold'},'Days'),
                el('div',{class:'mt-1 flex gap-1 flex-wrap'},
                  ...DAYS.map(([key, short]) => {
                    const on = s.daysArr.includes(key);
                    return el('button',{
                      type:'button',
                      class: 'rounded-md px-2.5 py-1 text-xs font-bold cursor-pointer ' + (on ? 'bg-mv-500 text-white' : 'bg-white/[0.05] text-slate2-300 border border-white/10 hover:bg-white/[0.1]'),
                      onclick: () => {
                        if (on) s.daysArr = s.daysArr.filter(d => d !== key);
                        else s.daysArr = [...s.daysArr, key];
                        // Keep `days` legacy string in sync for any consumer that still reads it
                        s.days = daysToLabel(s.daysArr);
                        saveStore(); paint();
                      }
                    }, short);
                  })
                ),
                el('div',{class:'mt-1 text-[10px] text-slate2-500'}, s.daysArr.length ? daysToLabel(s.daysArr) : 'Pick at least one day')
              ),
              el('div',{class:'mt-3 grid grid-cols-2 gap-2 text-xs'},
                el('div',{},
                  el('div',{class:'text-[10px] uppercase tracking-widest text-slate2-400 font-bold mb-1'},'Start'),
                  el('input',{value:s.timeStart, type:'time', class:'w-full bg-transparent border border-white/10 rounded px-2 py-1.5', onInput: e => { s.timeStart = e.target.value; }, onBlur: ()=>saveStore()})
                ),
                el('div',{},
                  el('div',{class:'text-[10px] uppercase tracking-widest text-slate2-400 font-bold mb-1'},'End'),
                  el('input',{value:s.timeEnd, type:'time', class:'w-full bg-transparent border border-white/10 rounded px-2 py-1.5', onInput: e => { s.timeEnd = e.target.value; }, onBlur: ()=>saveStore()})
                )
              )
            );
          }))
        )
      ),
      // Conditions
      el('div',{class:'rounded-2xl bg-white/[0.04] border border-white/10 p-5'},
        el('h3',{class:'font-bold'},'📋 Conditions shown to diners'),
        el('textarea',{class:'mt-3 w-full bg-white/[0.04] border border-white/10 rounded-xl px-4 py-3 text-sm', rows:'5',
          onInput: e => { pv.dealTerms = e.target.value; },
          onBlur: ()=>saveStore()
        }, pv.dealTerms || DEFAULT_DEAL_TERMS),
        el('button',{class:'mt-3 rounded-full bg-mv-500 hover:bg-mv-600 px-5 py-2 text-sm font-extrabold cursor-pointer', onclick:()=>{ saveStore(); toast('Saved'); }},'Save')
      )
    );
  }
  paint();
  return wrap;
}

function PortalProfile() {
  const pv = currentPartnerVenue();
  if (!pv) return el('div',{class:'text-sm text-slate2-400'},'No venue.');
  const wrap = el('div',{class:'max-w-3xl space-y-5'});

  function field(label, key, placeholder='') {
    return el('div',{},
      el('label',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'}, label),
      el('input',{
        class:'mt-1 w-full bg-white/[0.04] border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-mv-500 outline-none',
        value: pv[key] ?? '', placeholder,
        onInput: e => { pv[key] = e.target.value; }
      })
    );
  }
  function textareaField(label, key, rows=3) {
    return el('div',{},
      el('label',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'}, label),
      el('textarea',{
        class:'mt-1 w-full bg-white/[0.04] border border-white/10 rounded-xl px-3 py-2 text-sm focus:border-mv-500 outline-none',
        rows: String(rows),
        onInput: e => { pv[key] = e.target.value; }
      }, pv[key] ?? '')
    );
  }

  function paint() {
    wrap.innerHTML = '';
    // ---- Photos ----
    wrap.append(el('div',{class:'rounded-2xl bg-white/[0.04] border border-white/10 p-5'},
      el('div',{class:'flex items-center justify-between'},
        el('h3',{class:'font-bold'},'📷 Photos'),
        el('span',{class:'text-xs text-slate2-400'}, (pv.photos?.length ?? 0) + ' uploaded · auto-resized to 1000px')
      ),
      el('div',{class:'mt-4 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3'},
        ...(pv.photos || []).map((src, i) => el('div',{class:'relative group aspect-[4/3] rounded-lg overflow-hidden border border-white/10 bg-ink-900'},
          el('img',{src, class:'w-full h-full object-cover'}),
          el('button',{class:'absolute top-1 right-1 h-7 w-7 rounded-full bg-ink-900/90 border border-white/20 text-xs cursor-pointer hover:bg-red-600/80',
            onclick:()=>{ pv.photos.splice(i,1); saveStore(); paint(); }
          },'✕')
        )),
        // Upload tile
        el('label',{class:'aspect-[4/3] rounded-lg border-2 border-dashed border-white/15 grid place-items-center cursor-pointer hover:bg-white/[0.05] text-center text-slate2-400 text-sm'},
          el('div',{},
            el('div',{class:'text-2xl'},'➕'),
            el('div',{class:'text-xs mt-1'},'Add photos')
          ),
          el('input',{type:'file', accept:'image/*', multiple:true, class:'hidden', onChange: async e => {
            const files = Array.from(e.target.files || []);
            if (!pv.photos) pv.photos = [];
            for (const f of files) {
              try {
                const dataUrl = await compressImage(f);
                pv.photos.push(dataUrl);
              } catch (err) { console.warn('image error', err); toast('Could not process that image', 'err'); }
            }
            saveStore(); paint(); toast(`${files.length} photo${files.length===1?'':'s'} added`);
          }})
        )
      ),
      el('p',{class:'mt-2 text-[10px] text-slate2-500'},'Tip: 3–4 horizontal shots of dishes and your dining room work best.')
    ));

    // ---- Status toggle (Pause / Resume) ----
    if (pv.status === 'LIVE' || pv.status === 'PAUSED') {
      const isPaused = pv.status === 'PAUSED';
      wrap.append(el('div',{class:'rounded-2xl ' + (isPaused ? 'bg-amber-500/10 border border-amber-500/30' : 'bg-white/[0.04] border border-white/10') + ' p-5 flex items-center justify-between gap-3 flex-wrap'},
        el('div',{class:'min-w-0'},
          el('div',{class:'font-bold flex items-center gap-2'},
            el('span',{class:'h-2 w-2 rounded-full ' + (isPaused ? 'bg-amber-400' : 'bg-accent-emer animate-pulse')}),
            isPaused ? 'Listing paused' : 'Listing live'
          ),
          el('p',{class:'mt-1 text-sm text-slate2-400'},
            isPaused
              ? 'Members can\'t book new codes right now. Toggle on when you\'re ready to accept again.'
              : 'New bookings open. Going on holiday or having an off night? Pause to stop accepting new bookings until you resume.'
          )
        ),
        el('button',{class:'rounded-full ' + (isPaused ? 'bg-accent-emer text-ink-900 hover:bg-accent-emer/90' : 'bg-amber-500 text-ink-900 hover:bg-amber-400') + ' px-4 py-2 text-sm font-extrabold cursor-pointer', onclick:()=>{
          pv.status = isPaused ? 'LIVE' : 'PAUSED';
          saveStore(); toast(isPaused ? 'Listing is live' : 'Listing paused'); paint();
        }}, isPaused ? '▶ Resume listing' : '⏸ Pause listing')
      ));
    }

    // ---- Basics ----
    wrap.append(el('div',{class:'rounded-2xl bg-white/[0.04] border border-white/10 p-5'},
      el('h3',{class:'font-bold'},'📝 Restaurant info'),
      el('div',{class:'mt-3 grid md:grid-cols-2 gap-3'},
        field('Restaurant name','name'),
        field('Cuisine','cuisine','e.g. Spanish · Tapas'),
        field('Barrio (neighbourhood)','barrio','e.g. Eixample'),
        field('Address','address'),
        field('Postcode','postcode'),
        el('div',{},
          el('label',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'},'Price tier (1–4)'),
          el('input',{
            type:'number', min:'1', max:'4', value: String(pv.priceTier ?? 2),
            class:'mt-1 w-full bg-white/[0.04] border border-white/10 rounded-xl px-3 py-2 text-sm',
            onInput: e => { pv.priceTier = Math.max(1, Math.min(4, parseInt(e.target.value || '2', 10))); }
          })
        ),
        field('Phone','phone'),
        field('Website','website','www.example.com'),
        field('Instagram','instagram','@yourhandle'),
        field('Opening hours (free text)','hours')
      ),
      el('div',{class:'mt-3'}, textareaField('Description (members see this)','description', 4))
    ));

    // ---- Save ----
    wrap.append(el('div',{class:'flex items-center justify-between gap-3 sticky bottom-0 bg-ink-900/90 backdrop-blur p-3 rounded-xl border border-white/10'},
      el('span',{class:'text-xs text-slate2-400'},'Status: ', el('span',{class:'font-bold text-white'}, pv.status)),
      el('button',{class:'rounded-full bg-mv-500 hover:bg-mv-600 px-6 py-2 text-sm font-extrabold cursor-pointer', onclick:()=>{
        pv.slug = slugify(pv.name) || pv.slug;
        saveStore(); toast('Profile saved'); paint();
      }},'Save changes')
    ));
  }
  paint();
  return wrap;
}
function StatPanel(icon,label,value,sub) {
  return el('div',{class:'rounded-2xl bg-white/[0.04] border border-white/10 p-4'},
    el('div',{class:'flex items-center gap-2 text-xs text-slate2-400 font-bold uppercase tracking-widest'}, el('span',{},icon), label),
    el('div',{class:'mt-2 text-3xl font-extrabold tabular-nums'}, String(value)),
    el('div',{class:'text-xs text-accent-emer'}, sub)
  );
}

/* ========================================================================
   ADMIN
   ======================================================================== */
function Admin() {
  const u = currentUser();
  if (!u || u.role !== 'ADMIN') { go('signin'); return el('div'); }
  const pendingVenues = store.partnerVenues.filter(v => v.status === 'PENDING_APPROVAL');
  const liveVenues = store.partnerVenues.filter(v => v.status === 'LIVE');
  return el('div',{class:'min-h-screen bg-ink-950 text-white'},
    el('header',{class:'border-b border-white/5 bg-ink-900/80'},
      el('div',{class:'mx-auto max-w-6xl px-4 py-3 flex items-center justify-between'},
        el('div',{class:'flex items-center gap-2'},el('span',{class:'text-xl'},'🍽️'),el('div',{class:'font-bold'},'Menuverso Admin')),
        el('button',{class:'text-xs text-slate2-400 underline cursor-pointer bg-transparent border-0', onclick:logout},'Sign out')
      )
    ),
    el('div',{class:'mx-auto max-w-6xl px-4 py-8'},
      el('div',{class:'grid md:grid-cols-4 gap-4'},
        StatPanel('🏪','Pending partners', pendingVenues.length, pendingVenues.length ? 'Review SLA: 1 day' : 'Queue empty'),
        StatPanel('✓','Live partners', liveVenues.length + VENUES.length, liveVenues.length + ' partner-owned'),
        StatPanel('👤','Members', store.users.filter(x=>x.role==='MEMBER').length, 'registered'),
        StatPanel('🎟️','Redemptions', store.redemptions.length, 'this session')
      ),
      el('h2',{class:'mt-10 text-xl font-extrabold'},'Approval queue'),
      el('div',{class:'mt-3 space-y-3'},
        ...(pendingVenues.length === 0
          ? [el('p',{class:'text-sm text-slate2-400'},'Queue is empty. New partner submissions will appear here.')]
          : pendingVenues.map(pv => {
              const owner = store.users.find(x => x.id === pv.ownerId);
              return el('div',{class:'rounded-2xl bg-white/[0.04] border border-white/10 p-4'},
                el('div',{class:'flex items-start justify-between flex-wrap gap-3'},
                  el('div',{class:'min-w-0 flex-1'},
                    el('div',{class:'font-bold text-lg'}, pv.name),
                    el('div',{class:'text-xs text-slate2-400 mt-0.5'},
                      (pv.barrio || '—'), ' · ', (pv.cuisine || '—'),
                      ' · ', '€'.repeat(pv.priceTier || 0) || '—',
                      ' · ', owner ? owner.email : 'unknown owner'
                    ),
                    el('div',{class:'text-xs text-slate2-400'}, pv.address || 'No address yet', pv.postcode ? (', ' + pv.postcode) : ''),
                    el('div',{class:'text-xs text-slate2-400 mt-1'},'Submitted ', pv.submittedAt ? new Date(pv.submittedAt).toLocaleString('en-GB') : '—'),
                    pv.description && el('p',{class:'mt-2 text-sm text-slate2-300 max-w-2xl'}, pv.description),
                    el('div',{class:'mt-2 flex gap-2 flex-wrap'},
                      ...(pv.photos || []).slice(0,4).map(src => el('img',{src, class:'h-14 w-20 object-cover rounded border border-white/10'}))
                    )
                  ),
                  el('div',{class:'flex gap-2 shrink-0'},
                    el('button',{class:'rounded-full bg-accent-emer text-ink-900 px-4 py-1.5 text-sm font-extrabold cursor-pointer', onclick:()=>{
                      pv.status = 'LIVE'; pv.approvedAt = Date.now(); saveStore(); toast('Approved ' + pv.name); render();
                    }},'✓ Approve'),
                    el('button',{class:'rounded-full bg-white/10 border border-white/10 px-4 py-1.5 text-sm font-extrabold cursor-pointer', onclick:()=>{
                      const reason = prompt('Reason to send the partner (optional):') || 'A reviewer asked for changes. Please refine your profile and resubmit.';
                      pv.status = 'REJECTED'; pv.rejectionReason = reason; saveStore(); toast('Rejected ' + pv.name); render();
                    }},'Reject')
                  )
                )
              );
            })
        )
      ),
      el('h2',{class:'mt-10 text-xl font-extrabold'},'Partner-owned venues'),
      el('div',{class:'mt-3 rounded-2xl bg-white/[0.04] border border-white/10 p-2'},
        el('table',{class:'w-full text-sm'},
          el('thead',{class:'text-slate2-400 text-left'}, el('tr',{}, el('th',{class:'p-2'},'Venue'), el('th',{},'Owner'), el('th',{},'Status'), el('th',{},'Photos'), el('th',{},'Redemptions'))),
          el('tbody',{},
            ...store.partnerVenues.map(pv => {
              const owner = store.users.find(x => x.id === pv.ownerId);
              const reds = store.redemptions.filter(r => r.venueSlug === pv.slug).length;
              return el('tr',{class:'border-t border-white/5'},
                el('td',{class:'p-2 font-bold'}, pv.name),
                el('td',{class:'text-xs'}, owner?.email ?? '—'),
                el('td',{class:'text-xs'}, pv.status),
                el('td',{class:'text-xs'}, String((pv.photos||[]).length)),
                el('td',{class:'text-xs'}, String(reds))
              );
            })
          )
        )
      ),
      el('h2',{class:'mt-10 text-xl font-extrabold'},'All registered users'),
      el('div',{class:'mt-3 rounded-2xl bg-white/[0.04] border border-white/10 p-2'},
        el('table',{class:'w-full text-sm'},
          el('thead',{class:'text-slate2-400 text-left'}, el('tr',{}, el('th',{class:'p-2'},'Email'), el('th',{},'Name'), el('th',{},'Role'), el('th',{},'Subscription'))),
          el('tbody',{},
            ...store.users.map(u => el('tr',{class:'border-t border-white/5'},
              el('td',{class:'p-2 font-mono text-xs'}, u.email),
              el('td',{}, u.firstName ?? '—'),
              el('td',{class:'text-xs'}, u.role),
              el('td',{class:'text-xs'}, store.subscriptions[u.id] ? store.subscriptions[u.id].status : '—')
            ))
          )
        )
      )
    )
  );
}

const ROUTES = {
  landing: Landing,
  privacy: Privacy,
  terms: Terms,
  signup: Signup,
  signin: Signin,
  checkout: Checkout,
  app: AppDiscover,
  map: AppMap,
  saved: AppSaved,
  profile: AppProfile,
  venue: Venue,
  booking: Booking,
  'partner-landing': PartnerLanding,
  'partner-signin': PartnerSignin,
  'partner-signup': PartnerSignup,
  'partner-onboarding': PartnerOnboarding,
  'partner-portal': PartnerPortal,
  admin: Admin
};

function render() {
  const root = $('#root');
  root.innerHTML = '';
  const page = ROUTES[state.route] || Landing;
  root.appendChild(page());
}

// If the user already has a session, route them to their right home.
if (state.session) {
  const u = currentUser();
  if (u) {
    if (state.route === 'landing') {
      // keep them on landing — that's the marketing entrance, but the header
      // shows "Open App →" for them now
    }
  } else {
    clearSession();
  }
}
render();
