tailwind.config = {
  theme: {
    extend: {
      colors: {

<style>
  /* Always reserve scrollbar space so the layout never shifts between routes.
     Three-layer defense: scrollbar-gutter (modern), overflow-y:scroll (legacy),
     and a custom WebKit scrollbar that takes up real width (instead of macOS's
     overlay default which has zero width and causes layout to jump). */
  html { scrollbar-gutter: stable; overflow-y: scroll; }
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #FFFFFF; color: #2A1A0E; }
  /* Custom scrollbar — takes real width on macOS so layout stays stable. */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(28,15,6,0.14); border-radius: 6px; border: 2px solid #FFFFFF; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(28,15,6,0.26); }
  /* Firefox equivalent */
  html { scrollbar-width: thin; scrollbar-color: rgba(28,15,6,0.18) transparent; }
  h1,h2,h3 { letter-spacing: -0.015em; }
  /* Editorial display serif — pairs with sans body to give a culinary-magazine feel.
     Used on hero H1, section H2s, venue name, member name. Inter stays everywhere else. */
  .font-serif-display { font-family: 'Fraunces', 'Source Serif Pro', 'Georgia', serif; font-optical-sizing: auto; letter-spacing: -0.022em; font-feature-settings: 'ss01'; }
  /* Hero text sits on the video and stays legible regardless of frame content —
     light cream foreground with a soft dark halo. */
  .hero-on-video { color: #FAF6EF; text-shadow: 0 2px 18px rgba(28,15,6,0.55), 0 1px 3px rgba(28,15,6,0.4); }
  .hero-on-video strong { color: #FFFFFF; }
  /* Animated shimmer overlay for the redemption verification screen — defeats
     screenshots because the gradient is constantly moving. */
  .mv-shimmer-anim {
    background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 35%, rgba(255,255,255,0) 70%);
    background-size: 250% 250%;
    animation: mvShimmerMove 3.2s linear infinite;
  }
  @keyframes mvShimmerMove {
    0%   { background-position:   0% 100%; }
    100% { background-position: 100%   0%; }
  }
  /* Gentle hue drift on the member avatar tile — makes the profile feel alive. */
  @keyframes hue-drift { 0%, 100% { filter: hue-rotate(-6deg); } 50% { filter: hue-rotate(8deg); } }
  .avatar-drift { animation: hue-drift 9s ease-in-out infinite; }
  /* Page-transition cross-fade — applied on route change via go(). */
  #root { transition: opacity 180ms ease-out; }
  /* .grain dotted pattern removed for the white-bg refresh — the page now
     reads as clean paper rather than textured cream. Class kept as a no-op
     so the many `.grain` references throughout the markup still resolve. */
  .grain { }

  /* Partner logo wall — neotaste-style infinite marquee. The track holds
     TWO copies of the same logo set; sliding it from translateX(0) to
     translateX(-50%) makes the second copy land exactly where the first
     started, so the loop seams are invisible. Soft fade on the left/right
     edges via mask-image. */
  .mv-logo-marquee {
    -webkit-mask-image: linear-gradient(to right, transparent 0, black 100px, black calc(100% - 100px), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, black 100px, black calc(100% - 100px), transparent 100%);
  }
  .mv-logo-track {
    animation: mv-logo-marquee 40s linear infinite;
    will-change: transform;
  }
  @keyframes mv-logo-marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .mv-logo-marquee:hover .mv-logo-track { animation-play-state: paused; }
  .toast { animation: rise .2s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .pop { animation: pop .4s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .digit { font-variant-numeric: tabular-nums; }
  .frame { box-shadow: 0 30px 80px rgba(28,15,6,.18); }
  input::placeholder { color: #A89A82; }

  /* ===== Stellar map styling — brand-coherent overrides ===== */
  /* Make the Leaflet container blend into our cream-paper UI. */
  .leaflet-container { background: #F4ECDD; font-family: inherit; outline: none; }
  /* Attribution panel — dark on cream. */
  .leaflet-control-attribution { background: rgba(255,250,240,0.85) !important; color: #6F624E !important; font-size: 9px !important; padding: 2px 6px !important; }
  .leaflet-control-attribution a { color: #4A3D2A !important; }
  /* Custom zoom controls — cream pills with dark text, terracotta hover. */
  .leaflet-bar { box-shadow: 0 8px 24px rgba(28,15,6,.10) !important; border: 0 !important; }
  .leaflet-bar a { background: rgba(255,250,240,0.96) !important; color: #2A1A0E !important; border-color: rgba(28,15,6,.08) !important; font-weight: 800; }
  .leaflet-bar a:hover { background: #DC4A26 !important; color: #fff !important; }

  /* ----- Pins: simple coral dot with cuisine glyph. Name lives in a tooltip
     that only shows on hover/active state — keeps the map uncluttered. ----- */
  .mv-pin-wrap {
    position: relative; width: 42px; height: 50px;
    cursor: pointer;
  }
  .mv-pin {
    position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 36px; border-radius: 50%;
    background: #DC4A26;
    border: 2.5px solid #FFFFFF;
    box-shadow: 0 6px 14px rgba(220,74,38,.45), 0 1px 0 rgba(255,255,255,.2) inset;
    display: grid; place-items: center;
    font-size: 18px; line-height: 1;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .mv-pin-tail {
    position: absolute; top: 33px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-top: 11px solid #DC4A26;
    filter: drop-shadow(0 4px 4px rgba(220,74,38,.35));
  }
  .mv-pin-name {
    position: absolute; bottom: 100%; left: 50%;
    transform: translateX(-50%);
    margin-bottom: 6px;
    background: #1C0F06;
    color: #FAF6EF;
    border: 1px solid rgba(255,250,240,.18);
    padding: 5px 10px;
    border-radius: 9999px;
    font-size: 11px; font-weight: 700;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s ease, transform .15s ease;
    box-shadow: 0 6px 18px rgba(28,15,6,.30);
  }
  .mv-pin-wrap:hover .mv-pin-name,
  .mv-pin-wrap.is-active .mv-pin-name { opacity: 1; transform: translateX(-50%) translateY(-2px); }
  .mv-pin-wrap:hover .mv-pin { transform: translateX(-50%) scale(1.12); box-shadow: 0 12px 28px rgba(220,74,38,.55); }
  .mv-pin-wrap.is-active .mv-pin { transform: translateX(-50%) scale(1.18); background: #FFFFFF; color: #DC4A26; border-color: #DC4A26; }
  .mv-pin-wrap.is-active .mv-pin-tail { border-top-color: #FFFFFF; filter: drop-shadow(0 4px 4px rgba(255,255,255,.2)); }
  /* Live-now: green pulse ring around the pin head. */
  .mv-pin-wrap.is-live::before {
    content: ''; position: absolute;
    top: -4px; left: 50%; transform: translateX(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(52,211,153,.7);
    animation: mvPulse 1.8s ease-out infinite;
    pointer-events: none;
  }
  @keyframes mvPulse {
    0% { transform: translateX(-50%) scale(.85); opacity: .9; }
    70% { transform: translateX(-50%) scale(1.4); opacity: 0; }
    100% { opacity: 0; }
  }

  /* ----- Cluster bubbles — real circles (we don't load MarkerCluster.Default.css
     so we have to supply our own shape too, not just colour). ----- */
  .marker-cluster {
    background: rgba(220,74,38,.18) !important;
    border-radius: 50% !important;
    width: 44px !important; height: 44px !important;
    text-align: center;
  }
  .marker-cluster div {
    width: 32px !important; height: 32px !important;
    margin: 6px 0 0 6px !important;
    background: #DC4A26 !important;
    color: #fff !important;
    border-radius: 50% !important;
    border: 2px solid #FFFFFF !important;
    font-weight: 800 !important;
    box-shadow: 0 6px 16px rgba(220,74,38,.5);
    display: grid; place-items: center;
  }
  .marker-cluster span { line-height: 1 !important; font-size: 13px; }
  /* Brand-styled popups — cream paper with dark text. */
  .leaflet-popup-content-wrapper { background: #FAF6EF !important; color: #2A1A0E !important; border-radius: 14px !important; box-shadow: 0 20px 50px rgba(28,15,6,.22) !important; padding: 0 !important; overflow: hidden; border: 1px solid rgba(28,15,6,.08); }
  .leaflet-popup-content { margin: 0 !important; line-height: 1.4 !important; min-width: 240px; }
  .leaflet-popup-tip { background: #FAF6EF !important; }
  .leaflet-popup-close-button { color: #82765E !important; padding: 8px !important; }
  .mv-popup { padding: 10px 12px 12px; }
  .mv-popup-img { width: 100%; height: 96px; background: #EDDFC4 center/cover no-repeat; border-radius: 10px; margin-bottom: 8px; }
  .mv-popup-title { font-weight: 800; font-size: 14px; color: #1C0F06; }
  .mv-popup-sub { font-size: 11px; color: #82765E; margin-top: 1px; }
  .mv-popup-btn { display: inline-block; margin-top: 8px; background: #DC4A26; color: #fff !important; font-weight: 800; font-size: 11px; padding: 7px 12px; border-radius: 9999px; text-decoration: none; }
  .mv-popup-btn:hover { background: #B73A1A; }
  /* Map container has a subtle vignette so it doesn't feel like a flat plate. */
  .mv-map-frame { position: relative; }
  .mv-map-frame::after {
    content:''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    box-shadow: inset 0 0 80px rgba(28,15,6,.12), inset 0 0 0 1px rgba(28,15,6,.08);
  }
  /* List rows — hover highlights matching pin via JS. */
  .mv-listrow.is-active { background: rgba(220,74,38,.08); border-color: rgba(220,74,38,.4); }
</style>

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) {
      localStorage.setItem(STORE_KEY, JSON.stringify(initialStore));
      return JSON.parse(JSON.stringify(initialStore));
    }
    return JSON.parse(raw);
  } catch { return JSON.parse(JSON.stringify(initialStore)); }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { console.warn('localStorage full', e); }
}
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.userId || s.expiresAt < Date.now()) return null;
    return s;
  } catch { return null; }
}
function setSession(userId) {
  const s = { userId, expiresAt: Date.now() + 30*86400000 };
  localStorage.setItem(SESSION_KEY, JSON.stringify(s));
  state.session = s;
  // E-4: kick off the idle clock fresh on every sign-in.
  if (typeof resetIdleTimer === 'function') resetIdleTimer();
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
  state.session = null;
  // Stop the idle timers — leaving them running holds the closure alive

  u.prefs = { cuisines: prefs.cuisines || [], barrios: prefs.barrios || [], dietary: prefs.dietary || [] };
  saveStore();
}
// True until the user finishes (or skips) the personalization step.
function needsPrefs(u) {
  return u && u.role === 'MEMBER' && !u.prefs && u.prefsSkipped !== true;
}

// Partner-side unread bookings: count of active (un-redeemed, un-cancelled, un-expired)
// bookings created since the owner last opened the Redeem tab for this venue.
function partnerUnreadBookings(pv) {
  if (!pv) return 0;
  const since = pv.lastReadRedemptionsAt || 0;
  const now = Date.now();
  return store.bookings.filter(b =>
    b.venueSlug === pv.slug && !b.redeemed && !b.cancelled && b.expiresAt > now && b.createdAt > since
  ).length;
}
function markPartnerRedemptionsSeen(pv) {
  if (!pv) return;
  pv.lastReadRedemptionsAt = Date.now();
  saveStore();
}
// Partner-side incremental revenue this calendar month, in € (redemptions × avg ticket).
function partnerMonthRevenueEur(pv) {
  if (!pv) return 0;
  const now = new Date();
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const monthReds = store.redemptions.filter(r => r.venueSlug === pv.slug && r.redeemedAt >= startOfMonth).length;
  return monthReds * AVG_TICKET_EUR;
}
function partnerAllTimeRevenueEur(pv) {
  if (!pv) return 0;
  const all = store.redemptions.filter(r => r.venueSlug === pv.slug).length;
  return all * AVG_TICKET_EUR;
}

// Live ticker for the active-code ribbon — keeps the countdown fresh without
// needing a per-page interval. Singleton, started/stopped from AppShell.
let _activeCodeTimer = null;
function ensureActiveCodeTimer() {
  const u = currentUser();
  const hasActive = !!getActiveBooking(u);
  if (hasActive && !_activeCodeTimer) {
    _activeCodeTimer = setInterval(() => {
      const u2 = currentUser();
      if (getActiveBooking(u2)) {
        // Only re-render if the user is on a member route — avoid disrupting
        // partner / admin / landing surfaces.
        if (u2 && u2.role === 'MEMBER' && state.route !== 'booking') render();
      } else {
        clearInterval(_activeCodeTimer); _activeCodeTimer = null;
      }
    }, 30000);
  } else if (!hasActive && _activeCodeTimer) {
    clearInterval(_activeCodeTimer); _activeCodeTimer = null;
  }
}

/* VenueArt — honest illustrated venue card. Replaces the previous picsum
   stock-photo approach where a random landscape would be claimed as "this is
   what Cervecería Catalana looks like." Now:
   - If the partner uploaded a REAL photo of their venue, we show it.
   - Otherwise we render a brand-coherent illustrated hero — clearly an
     illustration, not a photo: Catalan-tile pattern background, a small
     cuisine line-drawing (tapas / wine / fish etc.) in the center, and a
     monogram chip in the corner. Looks designed, says "restaurant" visually,
     never lies about which one. */
function venueHasRealPhoto(venue) {
  const pv = venue._pv || (venue.ownerId ? venue : null);
  return !!(pv && pv.photos && pv.photos.length > 0 && /^data:image/.test(pv.photos[0]));
}
function venueRealPhotoSrc(venue) {
  const pv = venue._pv || (venue.ownerId ? venue : null);
  return pv && pv.photos && pv.photos[0];
}
// Cuisine-matched Unsplash food photography for venue placeholders. Each
// venue gets a stable photo derived from its slug — same venue always shows
// the same picture, but venues of the same cuisine pull from a small curated
// bucket so the photo honestly represents the cuisine type (tapas plates for
// a tapas place, sushi for asian, etc.). Not claiming to BE the specific
// venue's interior — just representing what kind of restaurant it is.
function cuisinePhotoFor(venue) {
  const slug = venue.slug || venue.name || '';
  let h = 0; for (let i=0;i<slug.length;i++) h = (h*31 + slug.charCodeAt(i)) >>> 0;
  const cuisine = (venue.cuisine || '').toLowerCase();
  // Hand-picked Unsplash photo IDs depicting real food/restaurant scenes.
  const buckets = {
    tapas:   ['1551218808-94e220e084d2','1414235077428-338989a2e8c0','1559339352-11d035aa65de','1565299624946-b28f40a0ae38'],
    catalan: ['1551218808-94e220e084d2','1414235077428-338989a2e8c0','1565299624946-b28f40a0ae38'],
    spanish: ['1565299624946-b28f40a0ae38','1551218808-94e220e084d2','1559339352-11d035aa65de'],
    wine:    ['1510812431401-41d2bd2722f3','1547595628-c61a29f496f0','1568376794508-ae52c6ab3929'],
    brunch:  ['1525351484163-7529414344d8','1504113888839-1c8eb50233d3','1533089860892-a7c6f0a88666'],
    asian:   ['1580822184713-fc5400e7fe10','1579871494447-9811cf80d66c','1546069901-ba9599a7e63c'],
    seafood: ['1559339352-11d035aa65de','1551782450-a2132b4ba21d','1559847844-5315695dadae'],
    med:     ['1546833999-b9f581a1996d','1540189549336-e6e99c3679fe','1565958011703-44f9829ba187'],
    vegan:   ['1540189549336-e6e99c3679fe','1546069901-ba9599a7e63c','1490645935967-10de6ba17061'],
    generic: ['1517248135467-4c7edcad34c4','1559329007-40df8a9345d8','1466978913421-dad2ebd01d17']
  };
  let key = 'generic';
  if (cuisine.includes('catalan')) key = 'catalan';
  else if (cuisine.includes('spanish') || cuisine.includes('tapas')) key = 'tapas';
  else if (cuisine.includes('asian') || cuisine.includes('japan') || cuisine.includes('thai') || cuisine.includes('chinese') || cuisine.includes('ramen')) key = 'asian';
  else if (cuisine.includes('seafood') || cuisine.includes('fish') || cuisine.includes('mariscos')) key = 'seafood';
  else if (cuisine.includes('brunch') || cuisine.includes('breakfast') || cuisine.includes('cafe')) key = 'brunch';
  else if (cuisine.includes('wine') || cuisine.includes('vermut') || cuisine.includes('cava') || cuisine.includes('bar')) key = 'wine';
  else if (cuisine.includes('mediterran') || cuisine.includes('greek')) key = 'med';
  else if (cuisine.includes('vegan') || cuisine.includes('veget')) key = 'vegan';
  const bucket = buckets[key];
  const id = bucket[h % bucket.length];
  return 'https://images.unsplash.com/photo-' + id + '?w=1000&q=80&auto=format&fit=crop';
}

function VenueArt(venue, opts={}) {
  const { aspect='16/10', radius='rounded-2xl', cls='', compact=false } = opts;
  // Honest path: a real partner-uploaded photo of THEIR venue.
  if (venueHasRealPhoto(venue)) {
    return el('div',{class:'relative overflow-hidden ' + radius + ' ' + cls, style:'aspect-ratio:' + aspect.replace('/','/')},
      el('img',{src: venueRealPhotoSrc(venue), alt: venue.name, class:'absolute inset-0 w-full h-full object-cover', style:'filter:brightness(0.92) saturate(1.05)'})
    );
  }
  // Photo path: cuisine-matched real photography. Falls back to SVG illustration
  // only if the image fails to load (offline / blocked CDN). Looks like a real
  // restaurant listing while staying honest about what we know about the venue.
  if (!compact) {
    const photoUrl = cuisinePhotoFor(venue);
    const wrap = el('div',{class:'relative overflow-hidden ' + radius + ' ' + cls, style:'aspect-ratio:' + aspect.replace('/','/')});
    const img = el('img',{
      src: photoUrl,
      alt: venue.name + ' — ' + (venue.cuisine || 'restaurant'),
      loading:'lazy',
      class:'absolute inset-0 w-full h-full object-cover',
      style:'filter:brightness(0.92) saturate(1.05)'
    });
    img.addEventListener('error', () => {
      // Photo failed — swap to the illustrated placeholder built below.
      wrap.innerHTML = '';
      const fallback = renderIllustratedVenue(venue, { aspect, radius, cls:'', compact });
      // fallback is a <div> with the SVG inside; move its children up.
      while (fallback.firstChild) wrap.appendChild(fallback.firstChild);
    });
    wrap.appendChild(img);
    return wrap;
  }
  // Compact thumbnail mode (small history rows) — keep using the lightweight illustration.
  return renderIllustratedVenue(venue, opts);
}

  // motif + one clean cuisine glyph centered. No fake food drawings, no
  // monogram chip, no "illustration" label — the card is obviously not a photo
  // and doesn't need to apologise for it.
  const name = venue.name || 'Venue';
  const seed = (venue.slug || name);
  let h = 0; for (let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  // Coral-family palettes only — keep every card brand-consistent. No amber outlier.
  const palettes = [
    { from:'#1F0A12', via:'#150812', to:'#0A0613', accent:'#DC4A26' }, // wine
    { from:'#1A0A14', via:'#100612', to:'#070612', accent:'#FB7185' }, // soft coral

  const p = palettes[h % palettes.length];
  const uid = 'va' + h.toString(36);
  // Compact glyph viewBox (matches ILLUS.cuisineGlyph kit) — kept simple,

  const glyphPaths = {

    med:     '<path d="M4 12 Q 12 4 20 12"/><path d="M4 16 Q 12 8 20 16"/>'
  };
  const cuisine = cuisineGlyphFor(venue.cuisine);
  const glyph = glyphPaths[cuisine] || glyphPaths.tapas;
  // Tile pattern subtly textures the background; the centered glyph reads as

  const glyphSize = compact ? 90 : 140;

  const svgInner =

      '<defs>'+

          '<stop offset="0%" stop-color="' + p.from + '"/>'+
          '<stop offset="60%" stop-color="' + p.via + '"/>'+
          '<stop offset="100%" stop-color="' + p.to + '"/>'+
        '</linearGradient>'+
        '<pattern id="' + uid + 't" x="0" y="0" width="44" height="44" patternUnits="userSpaceOnUse">'+
          '<path d="M0 22 L22 0 L44 22 L22 44 Z" fill="none" stroke="' + p.accent + '" stroke-width="0.5" stroke-opacity="0.16"/>'+
          '<circle cx="22" cy="22" r="1.2" fill="' + p.accent + '" fill-opacity="0.20"/>'+

      '<rect x="0" y="0" width="800" height="500" fill="url(#' + uid + 'r)"/>'+
      // Single clean cuisine glyph centered. Stroke at coral, low opacity.
      '<svg x="' + glyphX + '" y="' + glyphY + '" width="' + glyphSize + '" height="' + glyphSize + '" viewBox="0 0 24 24" fill="none" stroke="' + p.accent + '" stroke-width="1.1" stroke-linecap="round" stroke-opacity="0.55">' +
        glyph +

  return el('div',{class:'relative overflow-hidden ' + radius + ' ' + cls, style:'aspect-ratio:' + aspect.replace('/','/'), html: svgInner});

// Map a cuisine string to the right glyph key.
function cuisineGlyphFor(c) {
  if (!c) return 'tapas';
  const s = String(c).toLowerCase();
  if (s.includes('catalan')) return 'catalan';
  if (s.includes('mediterran')) return 'med';
  if (s.includes('seafood') || s.includes('mar')) return 'seafood';
  if (s.includes('brunch')) return 'brunch';
  if (s.includes('vegan') || s.includes('vegetar')) return 'vegan';
  if (s.includes('japan') || s.includes('asian') || s.includes('thai') || s.includes('chinese')) return 'asian';
  if (s.includes('wine') || s.includes('vermut') || s.includes('cava')) return 'wine';
  return 'tapas';
}

const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);

/* ========================================================================
   AUTH HANDLERS — real persistent users
   ======================================================================== */
async function registerUser({ firstName, lastName, email, password, role='MEMBER' }) {
  email = email.trim().toLowerCase();
  if (!isEmail(email)) throw new Error('Please enter a valid email.');
  if (password.length < 8) throw new Error('Password must be at least 8 characters.');
  if (store.users.find(u => u.email === email)) throw new Error('An account with that email already exists.');
  const u = {
    id: 'u_' + Math.random().toString(36).slice(2,12),
    email,
    passwordHash: await hashPassword(password),
    firstName: firstName?.trim() || null,
    lastName: lastName?.trim() || null,
    role,
    createdAt: Date.now(),
    verifiedAt: Date.now() // demo skips email-verify
  };
  store.users.push(u);
  if (!store.saved[u.id]) store.saved[u.id] = [];
  saveStore();
  setSession(u.id);
  return u;
}
async function loginUser({ email, password }) {
  email = email.trim().toLowerCase();
  const u = store.users.find(x => x.email === email);
  if (!u) throw new Error('Email or password is wrong.');
  const ok = await checkPassword(u.passwordHash, password);
  if (!ok) throw new Error('Email or password is wrong.');
  setSession(u.id);
  return u;
}
function logout() {
  clearSession();
  go('landing');
  toast('Signed out');
}

/* ========================================================================
   HERO BACKGROUND VIDEO — full-bleed cinematic loop behind the landing copy.

   Pipeline:
   1. Generate clips in Veo 3 → drop as hero-1.mp4, hero-2.mp4, ... in
      media/hero/.
   2. Run `media/hero/stitch.sh` (ffmpeg concat with shared codec/profile,
      faststart, no audio, 1920×1080 30fps) → produces hero.mp4 + hero-poster.jpg.
   3. This component just plays hero.mp4 on loop, with the poster as the
      poster attribute (instant paint before the bytes arrive).

   If hero.mp4 isn't there yet (file 404s), the video element hides itself
   and the SVG Barcelona cityscape underneath stays visible.

   autoplay + muted + playsinline so iOS/Android won't block.
   On narrow screens we preload less aggressively to save mobile data.
   ======================================================================== */
function HeroBackgroundVideo() {
  const SRC    = 'media/hero/hero.mp4';
  const POSTER = 'media/hero/hero-poster.jpg';
  const isNarrow = typeof window !== 'undefined' && window.innerWidth < 700;
  const video = document.createElement('video');
  // Background-video styling: dimmed + slightly desaturated so the copy
  // dominates. opacity 0.55 plus a brightness/saturate filter pushes the
  // shot back into "ambient atmosphere" territory. The dark gradient
  // overlay drawn AFTER this element does the rest of the heavy lifting.
  // mask-image fades the video itself to transparent at the bottom edge
  // so there's no hard seam where the hero section meets the next one.
  video.className = 'absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-700';
  video.style.filter = 'brightness(0.62) saturate(0.85) contrast(1.02)';
  video.style.maskImage = 'linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 70%, rgba(0,0,0,0.5) 88%, rgba(0,0,0,0) 100%)';
  video.style.webkitMaskImage = video.style.maskImage;
  video.muted = true;
  video.autoplay = true;
  video.loop = true;
  video.playsInline = true;
  video.setAttribute('playsinline','');
  video.setAttribute('webkit-playsinline','');
  video.setAttribute('aria-hidden','true');
  video.preload = isNarrow ? 'metadata' : 'auto';
  video.poster = POSTER;
  video.src = SRC;
  video.addEventListener('loadeddata', () => {
    // Fade in to a *muted* opacity, not full 1.0. We want background, not centerpiece.
    video.style.opacity = '0.72';
    // Cityscape SVG fades almost entirely out — the video carries the mood now.
    const svg = document.querySelector('[data-hero-svg]');
    if (svg) svg.style.opacity = '0.08';
  });
  video.addEventListener('error', () => {
    // hero.mp4 not delivered yet → keep the SVG placeholder visible.
    video.style.display = 'none';
  });
  // play() returns a Promise in real browsers, undefined in JSDOM — guard it.
  const p = video.play();
  if (p && typeof p.catch === 'function') p.catch(()=>{});
  return video;
}

/* AppShell — responsive browser layout.
   - Mobile (<md): top header with logo + profile, bottom nav fixed to viewport.
   - Desktop (≥md): top header with logo + horizontal nav + profile, no bottom nav.
   - Content centered, max-width depends on the screen (narrow for code/auth, wide for grids). */
function AppShell(inner, opts={}) {
  const u = currentUser();
  const showNav = u?.role === 'MEMBER' && opts.appNav !== false;
  const widthClass = opts.narrow ? 'max-w-md' : 'max-w-5xl';
  // Active-code ribbon — sits below the top bar on every member screen
  // (except the booking page itself, where it'd duplicate the giant code).
  const showRibbon = u?.role === 'MEMBER' && state.route !== 'booking';
  if (showRibbon) ensureActiveCodeTimer();
  const ribbon = showRibbon ? ActiveCodeRibbon() : null;
  // "Back to landing" footer link only makes sense pre-signup or during auth/checkout —
  // a logged-in member has no reason to be tossed back to marketing. Hide for them.
  const showBackToLanding = !u || opts.showBackToLanding === true;
  return el('div',{class:'min-h-screen bg-ink-950 text-slate2-50 grain'},
    // Same banner as marketing pages so the header sits at the same vertical
    // position on every route — no jump when going landing → signin.
    ConceptBanner(),
    // When the user is signed out, render the EXACT SAME header function as
    // the landing/marketing pages. Previously AppShell rendered AppTopBar
    // which had different child structure (logo + empty span + nav vs logo +
    // nav) — same content but the layout could drift between pages. Using
    // one function guarantees byte-identical output across routes.
    u ? AppTopBar({ showNav }) : MarketingHeader(),
    ribbon,
    el('main',{class:`mx-auto px-4 md:px-6 ${widthClass} ${showNav ? 'pb-24 md:pb-12' : 'pb-12'} pt-4 md:pt-8`}, inner),
    showNav ? BottomNav() : null,
    showBackToLanding && el('div',{class:'text-center pb-6 text-xs text-slate2-500'},
      el('button',{class:'underline hover:text-slate2-50 cursor-pointer bg-transparent border-0', onclick:()=>go('landing')},'← Back to landing site')
    )
  );
}
// Slim sticky reminder when the member has an active booking. Single-line, ~36px tall.
// On the Bookings tab the code is already prominent — show an even quieter
// underline-style strip there.
function ActiveCodeRibbon() {
  const u = currentUser();
  const all = getActiveBookings(u);
  if (all.length === 0) return null;
  const onBookingsTab = state.route === 'bookings';
  // M-4: if more than one active code (edge case), show a summary that the
  // diner can tap to land on Bookings where every code is listed.
  if (all.length > 1) {
    const next = all[0]; // soonest-to-expire
    const msLeft = Math.max(0, next.expiresAt - Date.now());
    const m = Math.floor(msLeft / 60000), sec = Math.floor((msLeft / 1000) % 60);
    const urgent = msLeft < 5*60000;
    const bg = onBookingsTab
      ? 'bg-mv-500/15 border-b border-mv-500/40 text-mv-300'
      : (urgent ? 'bg-red-600 text-white' : 'bg-mv-500 text-white');
    return el('div',{
      class: 'sticky top-[57px] z-20 ' + bg + ' cursor-pointer hover:opacity-95 transition',
      onclick: () => go('bookings')
    },
      el('div',{class:'mx-auto max-w-6xl px-4 md:px-6 h-9 flex items-center justify-between gap-3 text-xs sm:text-sm'},
        el('div',{class:'flex items-center gap-2 min-w-0 font-bold truncate'},
          el('span',{class:'rounded-full bg-slate2-50/20 px-2 py-0.5 text-[10px] shrink-0'}, all.length + ' codes'),
          el('span',{class:'opacity-80 truncate'}, ' · next expires in ')
        ),
        el('div',{class:'flex items-center gap-2 shrink-0'},
          el('span',{class:'font-mono font-bold tabular-nums'}, `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`),
          el('span',{class:'font-extrabold'}, 'Open all ↓')
        )
      )
    );
  }
  // Single-booking path (the normal case post M-3).
  const b = all[0];
  const v = findVenueBySlug(b.venueSlug);
  const msLeft = Math.max(0, b.expiresAt - Date.now());
  const m = Math.floor(msLeft / 60000), s = Math.floor((msLeft / 1000) % 60);
  const urgent = msLeft < 5*60000;
  // Quieter on Bookings tab — the code is already loud below.
  const bg = onBookingsTab
    ? 'bg-mv-500/15 border-b border-mv-500/40 text-mv-300'
    : (urgent ? 'bg-red-600 text-white' : 'bg-mv-500 text-white');
  return el('div',{
    class: 'sticky top-[57px] z-20 ' + bg + ' cursor-pointer hover:opacity-95 transition',
    onclick: () => go('booking', { id: b.id })
  },
    el('div',{class:'mx-auto max-w-6xl px-4 md:px-6 h-9 flex items-center justify-between gap-3 text-xs sm:text-sm'},
      el('div',{class:'flex items-center gap-2 min-w-0 font-bold truncate'},
        el('span',{class:'digit tracking-[0.18em] shrink-0'}, b.code),
        el('span',{class:'opacity-70 truncate'}, ' · ', v?.name ?? 'your booking')
      ),
      el('div',{class:'flex items-center gap-2 shrink-0'},
        el('span',{class:'font-mono font-bold tabular-nums'}, `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`),
        el('span',{class:'font-extrabold'}, 'Open →')
      )
    )
  );
}

      // === Annual / Monthly segmented toggle ===
      // Lives between the H2 and the membership card. Pick a plan → the
      // card's foil-stamp price + caption + sub-line update live. Annual is
      // the default + carries a "save 43%" pill for the comparative cue.
      el('div',{
        class:'mt-10 inline-flex items-center p-1 rounded-full bg-ink-900 ring-1 ring-mv-500/15 shadow-inner shadow-mv-500/[0.04]',
        ref: toggleEl => {
          queueMicrotask(() => {
            const section = toggleEl.closest('section');
            if (!section) return;
            const btns = toggleEl.querySelectorAll('button[data-plan]');
            const amount = section.querySelector('.mv-price-amount');
            const label  = section.querySelector('.mv-price-label');
            const sub    = section.querySelector('.mv-price-sub');
            if (!amount || !label || !sub) return;
            function setPlan(plan) {
              btns.forEach(b => {
                const active = b.dataset.plan === plan;
                b.classList.toggle('bg-mv-500', active);
                b.classList.toggle('text-white', active);
                b.classList.toggle('shadow-md', active);
                b.classList.toggle('shadow-mv-500/30', active);
                b.classList.toggle('text-slate2-300', !active);
                b.classList.toggle('hover:text-slate2-100', !active);
              });
              if (plan === 'annual') {
                amount.textContent = '€3.99';
                label.textContent = '/mo · annual';
                sub.textContent = 'Billed once a year — €47.88 up front. Save €36 vs monthly.';
              } else {
                amount.textContent = '€6.99';
                label.textContent = '/mo · monthly';
                sub.textContent = 'Billed each month. Cancel any month.';
              }
            }
            btns.forEach(b => b.addEventListener('click', () => setPlan(b.dataset.plan)));
            setPlan('annual'); // default
          });
        }
      },

          'Monthly'
        )

// Auto-generated id for each field — lets screen readers connect the visible
// <label> with the <input> (previously they were sibling DOM nodes with no
// associative attribute, so VoiceOver announced "password, edit text" without
// any label text).
let _fieldUid = 0;
function nextFieldId(name) { _fieldUid += 1; return 'fld_' + name + '_' + _fieldUid; }
function InputField(label, type, name, placeholder, required=true, autocomplete='', extra='') {
  const wrap = el('div',{});
  const id = nextFieldId(name);
  wrap.appendChild(el('label',{class:'block text-xs uppercase tracking-widest text-slate2-400 font-bold mb-1', for:id}, label));
  const inp = el('input',{
    id, type, name, placeholder,
    class:'w-full bg-slate2-50/[0.04] border border-slate2-50/10 rounded-xl px-4 py-3 text-slate2-50 placeholder:text-slate2-500 outline-none focus:border-mv-500 focus:bg-slate2-50/[0.07]'
  });
  if (required) inp.required = true;
  if (autocomplete) inp.autocomplete = autocomplete;
  if (extra) {
    const m = extra.matchAll(/(\w+)="([^"]*)"/g);
    for (const x of m) inp.setAttribute(x[1], x[2]);
  }
  wrap.appendChild(inp);
  return wrap;
}
/* PasswordField — password input with a built-in show/hide toggle.
   Optional minlength enforced via the HTML attribute. */
function PasswordField(label, name, placeholder, { required=true, autocomplete='new-password', minlength=8, helpText } = {}) {
  const wrap = el('div',{});
  const id = nextFieldId(name);
  wrap.appendChild(el('label',{class:'block text-xs uppercase tracking-widest text-slate2-400 font-bold mb-1', for:id}, label));
  const container = el('div',{class:'relative'});
  const inp = el('input',{
    id, type:'password', name, placeholder, autocomplete,
    class:'w-full bg-slate2-50/[0.04] border border-slate2-50/10 rounded-xl pl-4 pr-14 py-3 text-slate2-50 placeholder:text-slate2-500 outline-none focus:border-mv-500 focus:bg-slate2-50/[0.07]'
  });
  if (required) inp.required = true;
  if (minlength) inp.setAttribute('minlength', String(minlength));
  let shown = false;
  const toggle = el('button',{
    type:'button',
    'aria-label':'Show password',
    class:'absolute inset-y-0 right-2 my-auto h-7 px-2 rounded-md text-xs font-bold text-slate2-400 hover:text-slate2-50 hover:bg-slate2-50/[0.06] cursor-pointer bg-transparent border-0',
    onclick: () => {
      shown = !shown; inp.type = shown ? 'text' : 'password';
      toggle.textContent = shown ? 'Hide' : 'Show';
      toggle.setAttribute('aria-label', shown ? 'Hide password' : 'Show password');
    }
  }, 'Show');
  container.appendChild(inp);
  container.appendChild(toggle);
  wrap.appendChild(container);
  if (helpText) wrap.appendChild(el('div',{class:'mt-1 text-[10px] text-slate2-500'}, helpText));
  return wrap;
}

  const all = [

   ======================================================================== */
function AppDiscover() {
  const u = currentUser();
  if (!u) { go('signin'); return el('div'); }
  if (u.role !== 'MEMBER') {
    if (u.role==='ADMIN') return Admin();
    if (u.role==='PARTNER_OWNER') return PartnerPortal();
  }
  // Local state for live filtering — kept in the closure so typing doesn't trigger render() (which would steal focus).
  let q = '';
  let filter = 'all';
  // Build filter chips from the member's actual cuisine prefs first, then top up
  // with reasonable defaults. If they picked "Spanish · Tapas" and "Mediterranean"
  // at signup, those chips appear before generic ones.
  const FILTERS = (() => {
    const out = [['all','All'], ['now','Available now']];
    const seen = new Set(['all','now']);
    const tagify = label => label.toLowerCase().replace(/\s*·.*$/,'').split(/[\s,]+/)[0];
    const prefs = getPrefs(u);
    for (const c of (prefs.cuisines || [])) {
      const tag = tagify(c);
      if (!seen.has(tag)) { out.push([tag, c]); seen.add(tag); }
    }
    // Fallbacks so even a member who skipped onboarding gets a chip row.
    for (const [tag,label] of [['tapas','Tapas'],['catalan','Catalan'],['asian','Asian'],['brunch','Brunch'],['mediterranean','Mediterranean']]) {
      if (!seen.has(tag) && out.length < 7) { out.push([tag,label]); seen.add(tag); }
    }
    return out;
  })();

  function matches(v) {
    // Skip paused venues
    if (v._pv && v._pv.status === 'PAUSED') return false;
    if (q) {
      const hay = (v.name + ' ' + v.cuisine + ' ' + v.barrio).toLowerCase();
      if (!hay.includes(q.toLowerCase())) return false;
    }
    if (filter === 'all') return true;
    if (filter === 'now') return isVenueAvailableNow(v);
    return v.cuisine.toLowerCase().includes(filter);
  }

  const inner = el('div',{class:'pb-24'});
  const header = el('div',{class:'p-5 pb-3 border-b border-slate2-50/5'},
    el('div',{class:'text-xs uppercase tracking-widest text-slate2-400 font-bold'},'Barcelona'),
    el('h1',{class:'text-2xl font-extrabold'},'Menuverso Deals'),
    el('div',{class:'mt-3 flex items-center gap-2'},
      el('div',{class:'flex-1 flex items-center gap-2 bg-slate2-50/5 rounded-full px-3 py-2 border border-slate2-50/10 focus-within:border-mv-500'},
        el('span',{class:'text-slate2-400'},'🔍'),
        el('input',{
          class:'bg-transparent outline-none text-sm flex-1 text-slate2-50 placeholder:text-slate2-500',
          placeholder:'Search restaurants, cuisines, barrios',
          value:q,
          onInput: e => { q = e.target.value; paintGrid(); }
        }),
        q && el('button',{class:'text-slate2-400 hover:text-slate2-50 text-sm bg-transparent border-0 cursor-pointer', onclick:e => { q=''; e.currentTarget.previousElementSibling.value=''; paintGrid(); }},'✕')
      ),
      el('button',{class:'md:hidden h-9 w-9 rounded-full bg-slate2-50/5 border border-slate2-50/10 grid place-items-center cursor-pointer', onclick:()=>go('map')},'🗺️')
    )
  );

  // Filter chips row
  const chips = el('div',{class:'px-5 pt-4 flex gap-2 overflow-x-auto'});
  function paintChips() {
    chips.innerHTML = '';
    FILTERS.forEach(([k, label]) => {
      chips.appendChild(el('button',{
        class:'shrink-0 rounded-full px-3 py-1.5 text-xs font-bold cursor-pointer transition ' + (filter === k ? 'bg-slate2-50 text-ink-900' : 'bg-slate2-50/5 text-slate2-300 border border-slate2-50/10 hover:bg-slate2-50/[0.1]'),
        onclick:()=>{ filter = k; paintChips(); paintGrid(); }
      }, label));
    });
  }

  // Results count + grid
  const summary = el('div',{class:'text-sm text-slate2-400 flex items-center justify-between mt-4'});
  const grid = el('div',{class:'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4'});
  function paintGrid() {
    const list = getAllVenues().filter(matches);
    summary.innerHTML = '';
    summary.append(
      el('span',{}, '📍 ', el('span',{class:'text-slate2-50 font-bold'}, list.length + ' deal' + (list.length===1?'':'s')),
        q || filter !== 'all' ? ' match your search' : ' in Barcelona'
      ),
      // Show "Subscribe" CTA only when relevant; never show the redundant "✓ ACTIVE" chip.
      !hasSub() && el('button',{class:'text-mv-500 text-xs font-bold underline cursor-pointer bg-transparent border-0', onclick:()=>go('checkout')},'Subscribe →')
    );
    grid.innerHTML = '';
    if (list.length === 0) {
      grid.appendChild(el('div',{class:'col-span-full text-center py-12 text-slate2-400'},
        el('div',{class:'text-5xl'},'🤔'),
        el('p',{class:'mt-3 text-sm'},'No matches. Try a different search or filter.'),

function validSavedSlugs(u) {

  const venueSlugs = new Set(getAllVenues().map(v => v.slug));

  else if (b.cancelled) { badge = 'Cancelled'; badgeCls = 'bg-slate2-50/[0.05] text-slate2-400 border-slate2-50/10'; }
  else { badge = 'Expired'; badgeCls = 'bg-red-500/10 text-red-300 border-red-500/30'; }
  const when = b.redeemedAt
    ? new Date(b.redeemedAt).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
    : new Date(b.createdAt).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  // Human-readable reason for cancelled rows — otherwise members puzzle over
  // why a booking they don't remember cancelling shows "Cancelled".
  const cancelHint = (b.cancelled && b.cancelReason)
    ? ({ CROSS_VENUE_REBOOK: 'Cancelled when you booked elsewhere',
         PARTNER_PAUSE: 'Cancelled — restaurant paused listings' }[b.cancelReason] || null)
    : null;

  // Existing rating for this redemption (if any).
  const existingReview = (store.reviews || []).find(r => r.memberId === u.id && r.venueSlug === b.venueSlug);
  const showRate = b.redeemed && !existingReview;

  return el('div',{class:'rounded-2xl bg-slate2-50/[0.03] border border-slate2-50/10 p-4 hover:bg-slate2-50/[0.05] transition'},
    el('div',{class:'flex items-start gap-3'},
      v
        ? VenueArt(v, {aspect:'1/1', compact:true, cls:'h-14 w-14 shrink-0', radius:'rounded-xl'})
        : el('div',{class:'h-14 w-14 rounded-xl bg-mv-500/20 shrink-0 grid place-items-center text-xl'},'🍽️'),
      el('div',{class:'flex-1 min-w-0'},
        el('div',{class:'flex items-start justify-between gap-2 flex-wrap'},
          el('button',{class:'font-bold text-base truncate cursor-pointer bg-transparent border-0 text-left hover:text-mv-500', onclick:()=>v && go('venue',{slug:v.slug})}, v?.name ?? '(deleted venue)'),
          el('span',{class:'shrink-0 rounded-full border px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-widest ' + badgeCls}, badge)
        ),
        el('div',{class:'mt-0.5 text-xs text-slate2-400'},
          when, ' · ', b.slot,
          b.redeemed ? el('span',{}, ' · ', el('span',{class:'text-accent-emer font-bold'}, 'Saved €' + AVG_TICKET_EUR)) : null
        ),
        cancelHint && el('div',{class:'mt-1 text-[11px] text-slate2-500 italic'}, cancelHint),
        existingReview
          ? el('div',{class:'mt-2 text-accent-amber text-sm'},
              '★'.repeat(existingReview.stars), el('span',{class:'text-slate2-500'}, '☆'.repeat(5 - existingReview.stars)),
              existingReview.note && el('span',{class:'ml-2 text-xs text-slate2-400 italic'}, '"' + existingReview.note + '"')
            )
          : null,
        showRate && el('button',{class:'mt-2 text-xs font-bold text-mv-500 underline cursor-pointer bg-transparent border-0', onclick:()=>go('booking',{id:b.id})},'Rate your visit →')
      )
    )
  );
}

/* ========================================================================
   POST-SIGNUP PERSONALIZATION — 3 quick questions so the feed feels like
   it knows you on first open. Stores prefs on the user; AppDiscover will
   surface "Picks for you" if any prefs are present.
   ======================================================================== */
function AppOnboardingPrefs() {
  const u = currentUser(); if (!u) { go('signin'); return el('div'); }
  // Already done? Skip.
  if (u.prefs) { go(hasSub() ? 'app' : 'checkout'); return el('div'); }

  const cuisineOptions = ['Spanish · Tapas','Catalan','Mediterranean','Japanese','Italian','Mexican','Asian','Brunch','Vegan','Seafood'];
  const barrioOptions = ['Eixample','Gràcia','El Born','El Raval','Barceloneta','Sant Antoni','Poblenou','Sarrià','Gòtic'];
  const dietaryOptions = ['Vegetarian','Vegan','Gluten-free','Halal','Pescatarian'];

  const picks = { cuisines:[], barrios:[], dietary:[] };

  function chip(label, group, isPicked) {
    return el('button',{
      type:'button',
      class: 'rounded-full border px-4 py-2 text-sm font-bold cursor-pointer transition ' +
        (isPicked
          ? 'bg-mv-500 border-mv-500 text-white shadow-lg shadow-mv-500/30'
          : 'bg-slate2-50/[0.04] border-slate2-50/10 text-slate2-200 hover:bg-slate2-50/[0.08] hover:border-slate2-50/20'),
      onclick: () => {
        const list = picks[group];
        const idx = list.indexOf(label);
        if (idx >= 0) list.splice(idx, 1); else list.push(label);
        render();
      }
    }, label);
  }

  const inner = el('div',{class:'p-6 max-w-xl mx-auto'},
    el('div',{class:'text-center'},
      el('div',{class:'inline-flex items-center gap-2 rounded-full bg-mv-500/10 border border-mv-500/30 px-3 py-1 text-xs font-bold text-mv-400'},
        el('span',{class:'h-2 w-2 rounded-full bg-mv-500 animate-pulse'}),'Welcome, ', u.firstName || 'friend'
      ),
      el('h1',{class:'mt-4 text-3xl md:text-4xl font-extrabold leading-tight'},'Help us ', el('span',{class:'text-mv-500'},'tailor your feed')),
      el('p',{class:'mt-3 text-sm text-slate2-300'},'Three quick taps. We use your picks to surface the right restaurants first — never to share with anyone.'),
      // Tiny tile motif under the intro — gives the screen a brand moment.
      el('div',{class:'mt-5'}, ILLUS.tileStrip('h-2 w-32 mx-auto text-mv-500/30'))
    ),
    el('div',{class:'mt-8 space-y-7'},
      el('div',{},
        el('div',{class:'text-xs uppercase tracking-widest text-slate2-400 font-extrabold'},'Cuisines you love'),
        el('div',{class:'text-xs text-slate2-500 mb-3'},'Pick 2 or more'),
        el('div',{class:'flex flex-wrap gap-2'}, ...cuisineOptions.map(c => chip(c, 'cuisines', picks.cuisines.includes(c))))
      ),
      el('div',{},
        el('div',{class:'text-xs uppercase tracking-widest text-slate2-400 font-extrabold'},'Neighborhoods you frequent'),
        el('div',{class:'text-xs text-slate2-500 mb-3'},'Pick the ones you usually eat in'),
        el('div',{class:'flex flex-wrap gap-2'}, ...barrioOptions.map(b => chip(b, 'barrios', picks.barrios.includes(b))))
      ),
      el('div',{},
        el('div',{class:'text-xs uppercase tracking-widest text-slate2-400 font-extrabold'},'Dietary needs'),
        el('div',{class:'text-xs text-slate2-500 mb-3'},'Optional. We\'ll highlight relevant venues.'),
        el('div',{class:'flex flex-wrap gap-2'}, ...dietaryOptions.map(d => chip(d, 'dietary', picks.dietary.includes(d))))
      )
    ),
    el('div',{class:'mt-10 flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3'},
      el('button',{class:'text-sm text-slate2-400 underline hover:text-slate2-50 cursor-pointer bg-transparent border-0', onclick:()=>{
        u.prefsSkipped = true; saveStore(); go(hasSub() ? 'app' : 'checkout');
      }},'Skip for now'),
      el('button',{class:'rounded-2xl bg-mv-500 hover:bg-mv-600 text-white px-7 py-3.5 font-extrabold cursor-pointer shadow-xl shadow-mv-500/30 transition disabled:opacity-50',
        disabled: picks.cuisines.length === 0,
        onclick:()=>{
          if (picks.cuisines.length === 0) { toast('Pick at least one cuisine.', 'err'); return; }
          setPrefs(u, picks);
          toast('Your feed is ready', '');
          go(hasSub() ? 'app' : 'checkout');
        }},'Continue →')
    )
  );
  return AppShell(inner, { narrow: false });
}

function AppProfile() {
  const u = currentUser(); if (!u) { go('signin'); return el('div'); }
  const sub = currentSub();
  const prefs = getPrefs(u);
  const prefCuisines = (prefs.cuisines || []).slice(0, 6);
  const prefBarrios = (prefs.barrios || []).slice(0, 4);

  // ---- Derived stats ----
  const AVG_SAVED = 18;
  const myReds = store.redemptions.filter(r => r.memberId === u.id);
  const myBookings = store.bookings.filter(b => b.memberId === u.id);
  const since30 = Date.now() - 30 * 86400000;
  const recentReds = myReds.filter(r => r.redeemedAt >= since30);
  const totalSaved = myReds.length * AVG_SAVED;
  const recentSaved = recentReds.length * AVG_SAVED;
  const monthsSub = sub ? Math.max(1, Math.ceil((Date.now() - (sub.startedAt || Date.now())) / (30 * 86400000))) : 0;
  const totalPaid = monthsSub * 4.99;
  const multiple = totalPaid > 0 ? (totalSaved / totalPaid) : 0;
  const memberSince = u.createdAt ? new Date(u.createdAt) : new Date();
  const memberSinceLabel = memberSince.toLocaleDateString('en-GB', { month:'short', year:'numeric' });

  // Unique cuisines + barrios actually visited.
  const visitedVenues = myReds.map(r => findVenueBySlug(r.venueSlug)).filter(Boolean);
  const uniqueCuisines = new Set(visitedVenues.map(v => (v.cuisine || '').split('·')[0].trim())).size;
  const uniqueBarrios = new Set(visitedVenues.map(v => v.barrio)).size;

  // Top cuisine + top venue
  const cuisineCounts = {};
  const venueCounts = {};
  visitedVenues.forEach(v => {
    const c = (v.cuisine || 'Other').split('·')[0].trim();
    cuisineCounts[c] = (cuisineCounts[c] || 0) + 1;
    venueCounts[v.slug] = (venueCounts[v.slug] || 0) + 1;
  });
  const topCuisine = Object.entries(cuisineCounts).sort((a,b) => b[1]-a[1])[0];
  const topVenueSlug = Object.entries(venueCounts).sort((a,b) => b[1]-a[1])[0]?.[0];
  const topVenue = topVenueSlug ? findVenueBySlug(topVenueSlug) : null;

  // Member tier — playful, based on redemption count.
  let tier = { label:'New', color:'text-slate2-400', bg:'bg-slate2-50/5', emoji:'🌱', next: 1 };
  if (myReds.length >= 1) tier = { label:'Explorer', color:'text-mv-400', bg:'bg-mv-500/15', emoji:'🍽️', next: 3 };
  if (myReds.length >= 3) tier = { label:'Regular', color:'text-accent-amber', bg:'bg-accent-amber/15', emoji:'⭐', next: 10 };
  if (myReds.length >= 10) tier = { label:'Connoisseur', color:'text-accent-emer', bg:'bg-accent-emer/15', emoji:'👑', next: 25 };
  if (myReds.length >= 25) tier = { label:'Legend', color:'text-accent-pink', bg:'bg-accent-pink/15', emoji:'🏆', next: null };
  const toNext = tier.next ? (tier.next - myReds.length) : 0;
  const tierPct = tier.next ? Math.min(100, (myReds.length / tier.next) * 100) : 100;

  // 12-week savings sparkline.
  const weeks = 12;
  const weekData = Array(weeks).fill(0);
  myReds.forEach(r => {
    const weeksAgo = Math.floor((Date.now() - r.redeemedAt) / (7*86400000));
    if (weeksAgo >= 0 && weeksAgo < weeks) weekData[weeks - 1 - weeksAgo]++;
  });
  const maxWk = Math.max(1, ...weekData);

  // Recent visits (top 4) for the carousel.
  const recentVisits = myReds.slice(0, 4).map(r => ({ venue: findVenueBySlug(r.venueSlug), redeemedAt: r.redeemedAt })).filter(x => x.venue);

  const inner = el('div',{class:'pb-24'},
    // ===== HERO HEADER — gradient banner with name, member-since, tier =====
    el('div',{class:'relative overflow-hidden'},
      el('div',{class:'absolute inset-0 opacity-50', style:'background-image: radial-gradient(circle at 20% 20%, #DC4A26 0, transparent 50%), radial-gradient(circle at 90% 80%, #FB7185 0, transparent 50%);'}),
      el('div',{class:'relative px-5 pt-6 pb-8'},
        el('div',{class:'flex items-start gap-4 flex-wrap'},
          el('div',{class:'avatar-drift h-20 w-20 rounded-2xl bg-gradient-to-br from-mv-500 to-accent-pink grid place-items-center text-4xl font-extrabold shrink-0 shadow-xl shadow-mv-500/30 border-2 border-slate2-50/20'},
            (u.firstName?.[0] ?? u.email[0]).toUpperCase()
          ),
          el('div',{class:'flex-1 min-w-0'},
            el('div',{class:'text-[10px] uppercase tracking-widest text-mv-300 font-extrabold'},'Member since ' + memberSinceLabel),
            el('h1',{class:'font-serif-display mt-0.5 text-4xl md:text-5xl font-extrabold truncate'}, fullName(u)),
            el('div',{class:'mt-2 flex items-center gap-2 flex-wrap'},
              el('span',{class:'inline-flex items-center gap-1.5 rounded-full ' + tier.bg + ' px-3 py-1 text-xs font-extrabold uppercase tracking-widest ' + tier.color},
                el('span',{}, tier.emoji), tier.label
              ),
              el('span',{class:'text-xs text-slate2-400 truncate'}, u.email)
            )
          )
        ),
        // Tier progress bar
        tier.next && el('div',{class:'mt-5'},
          el('div',{class:'flex items-center justify-between text-[10px] uppercase tracking-widest font-bold text-slate2-300'},
            el('span',{}, myReds.length + ' visit' + (myReds.length===1?'':'s')),
            el('span',{}, toNext + ' to ' + (myReds.length >= 25 ? 'Legend' : myReds.length >= 10 ? 'Legend' : myReds.length >= 3 ? 'Connoisseur' : myReds.length >= 1 ? 'Regular' : 'Explorer'))
          ),
          el('div',{class:'mt-1.5 h-2 rounded-full bg-slate2-50/10 overflow-hidden'},
            el('div',{class:'h-full bg-gradient-to-r from-mv-500 to-accent-pink transition-all duration-700', style:'width:' + tierPct + '%'})
          )
        )
      )
    ),

    // ===== STAT TILES — visits, savings, cuisines, neighborhoods =====
    el('div',{class:'px-5 mt-5 grid grid-cols-2 md:grid-cols-4 gap-3'},
      el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-4'},
        el('div',{class:'text-[10px] uppercase tracking-widest text-slate2-400 font-bold'},'Saved'),
        el('div',{class:'mt-1 text-3xl font-extrabold text-mv-500'},'€' + totalSaved.toLocaleString()),
        el('div',{class:'text-[10px] text-slate2-500 mt-0.5'}, multiple >= 1 && totalPaid > 0 ? multiple.toFixed(1) + '× your sub' : 'all-time')
      ),
      el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-4'},
        el('div',{class:'text-[10px] uppercase tracking-widest text-slate2-400 font-bold'},'Visits'),
        el('div',{class:'mt-1 text-3xl font-extrabold'}, myReds.length),
        el('div',{class:'text-[10px] text-slate2-500 mt-0.5'}, recentReds.length > 0 ? '+' + recentReds.length + ' last 30 days' : 'all-time')
      ),
      el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-4'},
        el('div',{class:'text-[10px] uppercase tracking-widest text-slate2-400 font-bold'},'Cuisines'),
        el('div',{class:'mt-1 text-3xl font-extrabold'}, uniqueCuisines),
        el('div',{class:'text-[10px] text-slate2-500 mt-0.5'},'tried')
      ),
      el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-4'},
        el('div',{class:'text-[10px] uppercase tracking-widest text-slate2-400 font-bold'},'Barrios'),
        el('div',{class:'mt-1 text-3xl font-extrabold'}, uniqueBarrios),
        el('div',{class:'text-[10px] text-slate2-500 mt-0.5'},'explored')
      )
    ),

    // ===== SAVINGS SPARKLINE (12-week activity chart) =====
    myReds.length > 0 && el('div',{class:'px-5 mt-5'},
      el('div',{class:'rounded-2xl bg-gradient-to-br from-mv-500/15 via-mv-500/5 to-transparent border border-mv-500/30 p-5'},
        el('div',{class:'flex items-baseline justify-between'},
          el('div',{},
            el('div',{class:'text-[10px] uppercase tracking-widest text-mv-400 font-extrabold'},'Last 12 weeks'),
            el('div',{class:'mt-1 text-2xl font-extrabold'},'€' + (recentSaved + (weekData.slice(0,8).reduce((s,n)=>s+n,0) * AVG_SAVED)).toLocaleString())
          ),
          el('div',{class:'text-right text-[10px] text-slate2-400'},'~€', String(AVG_SAVED), '/visit')
        ),
        el('div',{class:'mt-4 flex items-end gap-1 h-20'},
          ...weekData.map((v,i) => {
            const isThisWeek = i === weeks - 1;
            return el('div',{class:'flex-1 rounded-t-sm transition-all hover:opacity-100 ' + (v > 0 ? (isThisWeek ? 'bg-mv-500' : 'bg-mv-500/60') : 'bg-slate2-50/5'),
              style:'height:' + Math.max(8, (v / maxWk) * 100) + '%',
              title: v + ' visit' + (v===1?'':'s')
            });
          })
        ),
        el('div',{class:'mt-2 flex justify-between text-[9px] text-slate2-500 font-bold uppercase tracking-widest'},
          el('span',{}, '12w ago'),
          el('span',{}, 'this week')
        )
      )
    ),

    // ===== HIGHLIGHTS — top cuisine, top venue =====
    (topCuisine || topVenue) && el('div',{class:'px-5 mt-5 grid sm:grid-cols-2 gap-3'},
      topCuisine && el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-5'},
        el('div',{class:'text-[10px] uppercase tracking-widest text-slate2-400 font-bold'},'Top cuisine'),
        el('div',{class:'mt-2 flex items-center gap-3'},
          el('span',{class:'h-12 w-12 rounded-2xl bg-mv-500/20 grid place-items-center text-mv-400'},
            ILLUS.cuisineGlyph(cuisineGlyphFor(topCuisine[0]), 'h-7 w-7')
          ),
          el('div',{class:'min-w-0'},
            el('div',{class:'font-bold truncate'}, topCuisine[0]),
            el('div',{class:'text-xs text-slate2-400'}, topCuisine[1] + ' visit' + (topCuisine[1]===1?'':'s'))
          )
        )
      ),
      topVenue && el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-5 cursor-pointer hover:bg-slate2-50/[0.06] transition', onclick:()=>go('venue',{slug:topVenue.slug})},
        el('div',{class:'text-[10px] uppercase tracking-widest text-slate2-400 font-bold'},'Favourite spot'),
        el('div',{class:'mt-2 flex items-center gap-3'},
          VenueArt(topVenue, {aspect:'1/1', compact:true, cls:'h-12 w-12 shrink-0', radius:'rounded-xl'}),
          el('div',{class:'min-w-0 flex-1'},
            el('div',{class:'font-bold truncate'}, topVenue.name),
            el('div',{class:'text-xs text-slate2-400 truncate'}, topVenue.barrio + ' · ' + venueCounts[topVenueSlug] + ' visit' + (venueCounts[topVenueSlug]===1?'':'s'))
          ),
          el('span',{class:'text-mv-500 font-bold text-sm shrink-0'},'→')
        )
      )
    ),

    // ===== RECENT VISITS — horizontal carousel with venue photos =====
    recentVisits.length > 0 && el('div',{class:'mt-5'},
      el('div',{class:'px-5 flex items-center justify-between mb-3'},
        el('h2',{class:'font-bold'},'Recent visits'),
        el('button',{class:'text-xs underline text-slate2-400 hover:text-slate2-50 cursor-pointer bg-transparent border-0', onclick:()=>go('bookings')},'See all →')
      ),
      el('div',{class:'pl-5 pr-2 overflow-x-auto'},
        el('div',{class:'flex gap-3 pb-2'},
          ...recentVisits.map(v => el('button',{class:'shrink-0 w-44 text-left rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 overflow-hidden cursor-pointer hover:bg-slate2-50/[0.07] hover:border-mv-500/30 transition',
            onclick: ()=>go('venue',{slug:v.venue.slug})
          },
            VenueArt(v.venue, {aspect:'16/10', radius:'rounded-none'}),
            el('div',{class:'p-3'},
              el('div',{class:'font-bold text-sm truncate'}, v.venue.name),
              el('div',{class:'text-[11px] text-slate2-400 truncate'}, v.venue.cuisine || '—'),
              el('div',{class:'mt-1 text-[10px] text-slate2-500'},
                new Date(v.redeemedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'})
              )
            )
          ))
        )
      )
    ),

    // ===== YOUR TASTE — cuisine + barrio prefs =====
    el('div',{class:'px-5 mt-5'},
      el('div',{class:'rounded-2xl bg-slate2-50/[0.04] border border-slate2-50/10 p-5'},
        el('div',{class:'flex items-center justify-between gap-2'},
          el('div',{class:'text-[10px] uppercase tracking-widest text-slate2-400 font-bold'}, prefCuisines.length > 0 ? 'Your taste' : 'Tell us your taste'),
          el('button',{class:'text-[10px] underline text-slate2-400 hover:text-slate2-50 cursor-pointer bg-transparent border-0', onclick:()=>{ delete u.prefsSkipped; delete u.prefs; saveStore(); go('onboarding-prefs'); }}, prefCuisines.length > 0 ? 'edit' : 'set up →')
        ),
        prefCuisines.length > 0
          ? el('div',{class:'mt-3 flex flex-wrap gap-2'},
              ...prefCuisines.map(c => el('span',{class:'inline-flex items-center gap-1.5 rounded-full bg-mv-500/10 border border-mv-500/30 px-3 py-1.5 text-xs font-bold text-mv-400'},
                ILLUS.cuisineGlyph(cuisineGlyphFor(c),'h-4 w-4'),
                el('span',{}, c)
              ))
            )
          : el('div',{class:'mt-2 text-sm text-slate2-300'},'Two taps to make your feed smarter.'),
        prefBarrios.length > 0 && el('div',{class:'mt-3 text-xs text-slate2-400'},

        )

            ? el('div',{class:'mt-3 flex items-center justify-between gap-3 flex-wrap'},

                  el('div',{class:'font-bold text-sm'}, 'Active · €3.99/mo · annual'),

                ),
                el('span',{class:'rounded-full bg-accent-emer/15 text-accent-emer px-2.5 py-0.5 text-xs font-extrabold'},'ACTIVE')
              )
            : el('div',{class:'mt-3'},

                el('button',{class:'mt-3 rounded-full bg-mv-500 hover:bg-mv-600 text-white px-4 py-2 text-sm font-extrabold cursor-pointer', onclick:()=>go('checkout')},'Subscribe — from €3.99/mo')
              ),

          }}, 'Cancel renewal'),
          // M-1: Resume renewal — gives the member a way back without contacting support.

// ---- Slot booking eligibility helpers (B-1, B-2) ----
// Maps a slot label like "Lunch · 13:00-15:30" back to its dealSlots entry.
function resolveSlotFromLabel(pv, label) {
  if (!pv) return null;
  // G2: resolve against the LIVE deal (members) not the editor draft.
  // If liveDeal isn't set (DRAFT/PENDING venue), fall back to pv.dealSlots.
  const slots = (pv.liveDeal && Array.isArray(pv.liveDeal.dealSlots))
    ? pv.liveDeal.dealSlots
    : pv.dealSlots;
  if (!Array.isArray(slots)) return null;
  // Strict match by "{label} · {timeStart}-{timeEnd}" — the exact format
  // bookSlot writes into `booking.slot`. Two slots named "Lunch" and "Late
  // Lunch" used to collide via substring match; the timeStart-timeEnd
  // discriminator removes the ambiguity. Fall back to exact label match
  // for legacy bookings that predate the time-suffix format.
  return slots.find(s => {
    if (!s.active) return false;
    const canonical = (s.label || '') + ' · ' + s.timeStart + '-' + s.timeEnd;
    return label === canonical || label === s.label;
  });
}
// Is the given slot bookable RIGHT NOW (today's day-of-week + within hours)?
// A 30-minute lead buffer lets diners grab a code on the way.
function isSlotBookableNow(pv, slotEntry) {
  if (!pv || !slotEntry) return true; // No partner data → assume always bookable (static catalog).
  const now = new Date();
  const todayKey = ['sun','mon','tue','wed','thu','fri','sat'][now.getDay()];
  const days = Array.isArray(slotEntry.daysArr) ? slotEntry.daysArr : [];
  if (days.length > 0 && !days.includes(todayKey)) return false;
  const cur = now.getHours()*60 + now.getMinutes();
  const [sh,sm] = (slotEntry.timeStart || '00:00').split(':').map(Number);
  const [eh,em] = (slotEntry.timeEnd || '23:59').split(':').map(Number);
  const startMin = (sh|0)*60 + (sm|0);
  const endMin   = (eh|0)*60 + (em|0);
  return cur >= (startMin - 30) && cur <= endMin;
}
// Human-readable label for when a slot next opens — used to replace "Book →"
// when today isn't a slot day or the time window hasn't started yet (B-2 UI).
function nextOpenLabel(slotEntry) {
  if (!slotEntry) return 'Closed';
  const dayNames = { sun:'Sun', mon:'Mon', tue:'Tue', wed:'Wed', thu:'Thu', fri:'Fri', sat:'Sat' };
  const dayOrder = ['sun','mon','tue','wed','thu','fri','sat'];
  const now = new Date();
  const todayIdx = now.getDay();
  const days = Array.isArray(slotEntry.daysArr) && slotEntry.daysArr.length ? slotEntry.daysArr : dayOrder;
  // If today is a slot day but the time window hasn't opened, hint at the time.
  if (days.includes(dayOrder[todayIdx])) {
    const cur = now.getHours()*60 + now.getMinutes();
    const [sh,sm] = (slotEntry.timeStart || '00:00').split(':').map(Number);
    const startMin = (sh|0)*60 + (sm|0);
    if (cur < startMin - 30) return 'Opens ' + (slotEntry.timeStart || '');
  }
  // Otherwise find the next day-of-week this slot runs.
  for (let i = 1; i <= 7; i++) {
    const dayKey = dayOrder[(todayIdx + i) % 7];
    if (days.includes(dayKey)) return 'Opens ' + dayNames[dayKey];
  }
  return 'Closed';
}
// Count active (unredeemed, unexpired, uncancelled) bookings at a slot.
function activeSlotCount(venueSlug, slotLabel) {
  const now = Date.now();
  return store.bookings.filter(b => b.venueSlug === venueSlug && b.slot === slotLabel && !b.redeemed && !b.cancelled && b.expiresAt > now).length;
}
// Generate a 6-digit code that doesn't collide with any other active booking (E-6).
function uniqueCode6() {
  const now = Date.now();
  for (let i = 0; i < 50; i++) {
    const c = code6();
    if (!store.bookings.some(b => b.code === c && !b.cancelled && b.expiresAt > now)) return c;
  }
  return code6(); // Fall back after 50 tries — astronomically unlikely.
}
// Rate-limit helper (E-5): a member can't fire off more than 3 bookings in 60 seconds.
function tooManyRecentBookings(memberId) {
  const since = Date.now() - 60*1000;
  return store.bookings.filter(b => b.memberId === memberId && b.createdAt >= since).length >= 3;
}

// ------------------------------------------------------------------------
// G4: Per-user, per-restaurant, per-month redemption credits.
// Each member can redeem one restaurant's offer up to N times per calendar
// month, where N is venue.creditsPerUser (default 3). The cap counts both
// already-redeemed bookings AND currently-active unexpired bookings so the
// user can't pre-stack codes beyond their cap. Cancelled bookings DON'T
// count toward the cap (those credits return).
// Cap refreshes naturally on the 1st of every month because the count is
// scoped to the current YYYY-MM.
